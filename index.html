    // =========================================================================
    // 4. HISTORY MANAGER (Undo / Redo Snapshot Stack)
    // =========================================================================
    class HistoryManager {
      constructor(limit = 50) {
        this.limit = limit;
        this.stack = [];
        this.index = -1;
      }
      push(snapshot, label = 'Edit') {
        if (this.index < this.stack.length - 1) {
          this.stack = this.stack.slice(0, this.index + 1);
        }
        this.stack.push({ data: JSON.stringify(snapshot), label });
        if (this.stack.length > this.limit) this.stack.shift();
        this.index = this.stack.length - 1;
      }
      canUndo() { return this.index > 0; }
      canRedo() { return this.index < this.stack.length - 1; }
      undo() {
        if (!this.canUndo()) return null;
        this.index--;
        return { snapshot: JSON.parse(this.stack[this.index].data), label: this.stack[this.index + 1].label };
      }
      redo() {
        if (!this.canRedo()) return null;
        this.index++;
        return { snapshot: JSON.parse(this.stack[this.index].data), label: this.stack[this.index].label };
      }
    }

    // =========================================================================
    // 5. STORAGE MANAGER (IndexedDB + Safe Fallback + Downloadable Backups)
    // =========================================================================
    const StorageManager = {
      DB_NAME: 'PolycraftStudioDB',
      STORE_NAME: 'projects',
      dbPromise: null,

      openDB() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve) => {
          try {
            if (!window.indexedDB) return resolve(null);
            const req = indexedDB.open(this.DB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(this.STORE_NAME)) {
                db.createObjectStore(this.STORE_NAME, { keyPath: 'id' });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
        return this.dbPromise;
      },

      async saveProject(project) {
        const record = { ...project, updatedAt: Date.now() };
        const db = await this.openDB();
        if (db) {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.STORE_NAME, 'readwrite');
              tx.objectStore(this.STORE_NAME).put(record);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => resolve(false);
            } catch { resolve(false); }
          });
        }
        try {
          localStorage.setItem('polycraft_proj_' + record.id, JSON.stringify(record));
          return true;
        } catch { return false; }
      },

      async listProjects() {
        const db = await this.openDB();
        if (db) {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.STORE_NAME, 'readonly');
              const req = tx.objectStore(this.STORE_NAME).getAll();
              req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.updatedAt - a.updatedAt));
              req.onerror = () => resolve([]);
            } catch { resolve([]); }
          });
        }
        return [];
      },

      async deleteProject(id) {
        const db = await this.openDB();
        if (db) {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.STORE_NAME, 'readwrite');
              tx.objectStore(this.STORE_NAME).delete(id);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => resolve(false);
            } catch { resolve(false); }
          });
        }
        return false;
      }
    };

    // =========================================================================
    // 6. GODOT 4 GLB 2.0 EXPORTER, IMPORTER & VALIDATOR
    // =========================================================================
    const GodotGLB = {
      validateScene(objects, unitScale = 1.0) {
        const issues = [];
        let totalTris = 0;
        let visibleCount = 0;

        for (const obj of objects) {
          if (!obj.visible) continue;
          visibleCount++;
          const m = obj.mesh;
          if (!m.vertices.length || !m.faces.length) {
            issues.push({ level: 'error', text: `"${obj.name}" has no geometry.` });
            continue;
          }
          let degen = 0;
          for (let fi = 0; fi < m.faces.length; fi++) {
            const f = m.faces[fi];
            if (f.verts.length < 3) { degen++; continue; }
            const v0 = m.vertices[f.verts[0]];
            const v1 = m.vertices[f.verts[1]];
            const v2 = m.vertices[f.verts[2]];
            if (!v0 || !v1 || !v2) { degen++; continue; }
            const e1 = new THREE.Vector3(v1.x - v0.x, v1.y - v0.y, v1.z - v0.z);
            const e2 = new THREE.Vector3(v2.x - v0.x, v2.y - v0.y, v2.z - v0.z);
            if (e1.cross(e2).lengthSq() < 1e-10) degen++;
          }
          if (degen > 0) {
            issues.push({ level: 'warn', text: `"${obj.name}" has ${degen} zero-area face(s).` });
          }
          totalTris += m.getTriangleCount();
        }

        if (visibleCount === 0) {
          issues.push({ level: 'error', text: 'No visible objects to export.' });
        }
        if (totalTris > 25000) {
          issues.push({ level: 'warn', text: `High polygon budget (${totalTris} tris) for PS2-era target.` });
        }
        if (unitScale <= 0) {
          issues.push({ level: 'error', text: 'Unit scale must be positive.' });
        }

        return {
          ok: !issues.some(i => i.level === 'error'),
          totalTris,
          visibleCount,
          issues
        };
      },

      exportGLB(objects, unitScale = 1.0) {
        // Standards-compliant glTF 2.0 binary (.glb) with Y-up right-handed coords,
        // per-material primitives, POSITION, NORMAL, TEXCOORD_0, COLOR_0 & PBR materials
        const visibleObjs = objects.filter(o => o.visible && o.mesh.faces.length > 0);
        if (!visibleObjs.length) throw new Error('No visible geometry to export.');

        const gltf = {
          asset: { version: '2.0', generator: 'Polycraft Studio 1.0 (Godot 4 Compatible)' },
          scene: 0,
          scenes: [{ name: 'PolycraftScene', nodes: [] }],
          nodes: [],
          meshes: [],
          materials: [],
          buffers: [],
          bufferViews: [],
          accessors: []
        };

        const binChunks = [];
        let binByteLength = 0;

        const appendBuffer = (typedArray, target) => {
          const pad = (4 - (binByteLength % 4)) % 4;
          if (pad > 0) {
            binChunks.push(new Uint8Array(pad));
            binByteLength += pad;
          }
          const bytes = new Uint8Array(typedArray.buffer, typedArray.byteOffset, typedArray.byteLength);
          const byteOffset = binByteLength;
          binChunks.push(bytes);
          binByteLength += bytes.byteLength;
          const bvIndex = gltf.bufferViews.length;
          const bv = { buffer: 0, byteOffset, byteLength: bytes.byteLength };
          if (target) bv.target = target;
          gltf.bufferViews.push(bv);
          return bvIndex;
        };

        // Build material map keyed by color + roughness + metalness
        const matKeyMap = new Map();
        const getMaterialIndex = (colorHex, materialId) => {
          const preset = MaterialLib.presets.find(p => p.id === materialId) || MaterialLib.presets[0];
          const key = `${colorHex}_${preset.roughness}_${preset.metalness}`;
          if (matKeyMap.has(key)) return matKeyMap.get(key);
          const [r, g, b] = MaterialLib.hexToRgb01(colorHex);
          // Convert sRGB to linear for glTF 2.0 baseColorFactor
          const toLin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
          const idx = gltf.materials.length;
          gltf.materials.push({
            name: `${preset.name}_${idx}`,
            pbrMetallicRoughness: {
              baseColorFactor: [toLin(r), toLin(g), toLin(b), 1.0],
              metallicFactor: preset.metalness,
              roughnessFactor: preset.roughness
            },
            doubleSided: false
          });
          matKeyMap.set(key, idx);
          return idx;
        };

        for (const obj of visibleObjs) {
          const m = obj.mesh;
          // Group faces by material so Godot 4 imports clean multi-material surfaces
          const groups = new Map();
          for (let fi = 0; fi < m.faces.length; fi++) {
            const f = m.faces[fi];
            if (f.verts.length < 3) continue;
            const matIdx = getMaterialIndex(f.color || '#6b442a', f.materialId || 'aged_wood');
            if (!groups.has(matIdx)) groups.set(matIdx, []);
            groups.get(matIdx).push(fi);
          }

          // Smooth normals if object uses smooth shading
          let smoothNormals = null;
          if (!obj.flatShading) {
            smoothNormals = m.vertices.map(() => new THREE.Vector3());
            for (let fi = 0; fi < m.faces.length; fi++) {
              const fn = m.computeFaceNormal(fi);
              for (const vi of m.faces[fi].verts) smoothNormals[vi].add(fn);
            }
            smoothNormals.forEach(n => n.lengthSq() > 1e-8 ? n.normalize() : n.set(0, 1, 0));
          }

          const primitives = [];
          for (const [matIdx, faceIndices] of groups.entries()) {
            const pos = [], norm = [], uv = [];
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

            for (const fi of faceIndices) {
              const f = m.faces[fi];
              const fn = m.computeFaceNormal(fi);
              const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);
              for (let i = 1; i < f.verts.length - 1; i++) {
                const tri = [f.verts[0], f.verts[i], f.verts[i + 1]];
                for (const vi of tri) {
                  const v = m.vertices[vi];
                  const px = v.x * unitScale, py = v.y * unitScale, pz = v.z * unitScale;
                  pos.push(px, py, pz);
                  if (px < minX) minX = px; if (py < minY) minY = py; if (pz < minZ) minZ = pz;
                  if (px > maxX) maxX = px; if (py > maxY) maxY = py; if (pz > maxZ) maxZ = pz;
                  const n = obj.flatShading ? fn : smoothNormals[vi];
                  norm.push(n.x, n.y, n.z);
                  let u = 0, vv = 0;
                  if (ay >= ax && ay >= az) { u = v.x * 0.5 + 0.5; vv = v.z * 0.5 + 0.5; }
                  else if (ax >= ay && ax >= az) { u = v.z * 0.5 + 0.5; vv = v.y * 0.5 + 0.5; }
                  else { u = v.x * 0.5 + 0.5; vv = v.y * 0.5 + 0.5; }
                  uv.push(u, vv);
                }
              }
            }

            const vertCount = pos.length / 3;
            if (vertCount === 0) continue;

            const posBV = appendBuffer(new Float32Array(pos), 34962);
            const normBV = appendBuffer(new Float32Array(norm), 34962);
            const uvBV = appendBuffer(new Float32Array(uv), 34962);

            const posAcc = gltf.accessors.length;
            gltf.accessors.push({
              bufferView: posBV, componentType: 5126, count: vertCount, type: 'VEC3',
              min: [minX, minY, minZ], max: [maxX, maxY, maxZ]
            });
            const normAcc = gltf.accessors.length;
            gltf.accessors.push({
              bufferView: normBV, componentType: 5126, count: vertCount, type: 'VEC3'
            });
            const uvAcc = gltf.accessors.length;
            gltf.accessors.push({
              bufferView: uvBV, componentType: 5126, count: vertCount, type: 'VEC2'
            });

            primitives.push({
              attributes: { POSITION: posAcc, NORMAL: normAcc, TEXCOORD_0: uvAcc },
              material: matIdx,
              mode: 4 // TRIANGLES
            });
          }

          if (!primitives.length) continue;
          const meshIdx = gltf.meshes.length;
          gltf.meshes.push({ name: obj.name, primitives });

          const euler = new THREE.Euler(obj.rotation.x, obj.rotation.y, obj.rotation.z, 'XYZ');
          const quat = new THREE.Quaternion().setFromEuler(euler);

          const nodeIdx = gltf.nodes.length;
          gltf.nodes.push({
            name: obj.name,
            mesh: meshIdx,
            translation: [obj.position.x * unitScale, obj.position.y * unitScale, obj.position.z * unitScale],
            rotation: [quat.x, quat.y, quat.z, quat.w],
            scale: [obj.scale.x, obj.scale.y, obj.scale.z]
          });
          gltf.scenes[0].nodes.push(nodeIdx);
        }

        // Pad binary buffer to 4-byte boundary
        const binPad = (4 - (binByteLength % 4)) % 4;
        if (binPad > 0) {
          binChunks.push(new Uint8Array(binPad));
          binByteLength += binPad;
        }
        gltf.buffers.push({ byteLength: binByteLength });

        const jsonStr = JSON.stringify(gltf);
        const encoder = new TextEncoder();
        const jsonRaw = encoder.encode(jsonStr);
        const jsonPad = (4 - (jsonRaw.byteLength % 4)) % 4;
        const jsonLength = jsonRaw.byteLength + jsonPad;

        const totalLength = 12 + 8 + jsonLength + 8 + binByteLength;
        const out = new ArrayBuffer(totalLength);
        const dv = new DataView(out);
        const u8 = new Uint8Array(out);

        // GLB Header
        dv.setUint32(0, 0x46546C67, true); // 'glTF'
        dv.setUint32(4, 2, true);          // version 2
        dv.setUint32(8, totalLength, true);

        // JSON Chunk
        dv.setUint32(12, jsonLength, true);
        dv.setUint32(16, 0x4E4F534A, true); // 'JSON'
        u8.set(jsonRaw, 20);
        for (let i = 0; i < jsonPad; i++) u8[20 + jsonRaw.byteLength + i] = 0x20;

        // BIN Chunk
        const binStart = 20 + jsonLength;
        dv.setUint32(binStart, binByteLength, true);
        dv.setUint32(binStart + 4, 0x004E4942, true); // 'BIN\0'
        let cursor = binStart + 8;
        for (const chunk of binChunks) {
          u8.set(chunk, cursor);
          cursor += chunk.byteLength;
        }

        return new Uint8Array(out);
      },

      importGLB(arrayBuffer) {
        const dv = new DataView(arrayBuffer);
        if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('Invalid GLB file header.');
        const jsonLen = dv.getUint32(12, true);
        const jsonBytes = new Uint8Array(arrayBuffer, 20, jsonLen);
        const gltf = JSON.parse(new TextDecoder().decode(jsonBytes));
        const binOffset = 20 + jsonLen + 8;

        const imported = [];
        const nodes = gltf.nodes || [];
        for (const node of nodes) {
          if (node.mesh === undefined) continue;
          const gMesh = gltf.meshes[node.mesh];
          const editable = new EditableMesh();

          for (const prim of gMesh.primitives || []) {
            if (prim.attributes.POSITION === undefined) continue;
            const posAcc = gltf.accessors[prim.attributes.POSITION];
            const posBV = gltf.bufferViews[posAcc.bufferView];
            const posStart = binOffset + (posBV.byteOffset || 0) + (posAcc.byteOffset || 0);
            const posArr = new Float32Array(arrayBuffer, posStart, posAcc.count * 3);

            // Color from material if available
            let hex = '#8b7e96';
            if (prim.material !== undefined && gltf.materials && gltf.materials[prim.material]) {
              const bcf = gltf.materials[prim.material].pbrMetallicRoughness?.baseColorFactor;
              if (bcf) {
                const toSrgb = c => Math.round(Math.min(1, Math.max(0, Math.pow(c, 1 / 2.2))) * 255);
                hex = '#' + [toSrgb(bcf[0]), toSrgb(bcf[1]), toSrgb(bcf[2])].map(x => x.toString(16).padStart(2, '0')).join('');
              }
            }

            const baseV = editable.vertices.length;
            for (let i = 0; i < posAcc.count; i++) {
              editable.vertices.push({ x: posArr[i * 3], y: posArr[i * 3 + 1], z: posArr[i * 3 + 2] });
            }

            if (prim.indices !== undefined) {
              const idxAcc = gltf.accessors[prim.indices];
              const idxBV = gltf.bufferViews[idxAcc.bufferView];
              const idxStart = binOffset + (idxBV.byteOffset || 0) + (idxAcc.byteOffset || 0);
              const idxArr = idxAcc.componentType === 5125
                ? new Uint32Array(arrayBuffer, idxStart, idxAcc.count)
                : new Uint16Array(arrayBuffer, idxStart, idxAcc.count);
              for (let i = 0; i < idxArr.length; i += 3) {
                editable.faces.push({
                  verts: [baseV + idxArr[i], baseV + idxArr[i + 1], baseV + idxArr[i + 2]],
                  color: hex, materialId: 'aged_wood'
                });
              }
            } else {
              for (let i = 0; i < posAcc.count; i += 3) {
                editable.faces.push({
                  verts: [baseV + i, baseV + i + 1, baseV + i + 2],
                  color: hex, materialId: 'aged_wood'
                });
              }
            }
          }

          editable.weldVertices([], 0.0005);
          const t = node.translation || [0, 0, 0];
          const s = node.scale || [1, 1, 1];
          let rot = { x: 0, y: 0, z: 0 };
          if (node.rotation) {
            const q = new THREE.Quaternion(...node.rotation);
            const e = new THREE.Euler().setFromQuaternion(q, 'XYZ');
            rot = { x: e.x, y: e.y, z: e.z };
          }
          imported.push({
            name: node.name || gMesh.name || 'Imported Asset',
            mesh: editable,
            position: { x: t[0], y: t[1], z: t[2] },
            rotation: rot,
            scale: { x: s[0], y: s[1], z: s[2] }
          });
        }
        return imported;
      }
    };

    // =========================================================================
    // 7. VIEWPORT ENGINE (Three.js + Touch/Pen/Mouse Gestures + Retro Preview)
    // =========================================================================
    class ViewportEngine {
      constructor(canvas, app) {
        this.canvas = canvas;
        this.app = app;

        this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.outputEncoding = THREE.sRGBEncoding;

        this.scene = new THREE.Scene();

        // Cameras (Perspective + Orthographic)
        this.perspCam = new THREE.PerspectiveCamera(45, 1, 0.05, 150);
        this.orthoCam = new THREE.OrthographicCamera(-4, 4, 4, -4, -50, 100);
        this.isOrtho = false;
        this.camera = this.perspCam;

        // Orbit Camera State
        this.camTarget = new THREE.Vector3(0, 1.05, 0);
        this.camSpherical = { radius: 5.2, theta: 0.62, phi: 1.18 };
        this.updateCameraTransform();

        // Lighting
        this.setupLights();
        this.setupGrid();

        // Containers
        this.objectGroup = new THREE.Group();
        this.scene.add(this.objectGroup);
        this.overlayGroup = new THREE.Group();
        this.scene.add(this.overlayGroup);
        this.gizmoGroup = new THREE.Group();
        this.scene.add(this.gizmoGroup);
        this.buildGizmo();

        // Mesh map: objectId -> { group, mesh, wire, outline }
        this.meshEntries = new Map();
        this.raycaster = new THREE.Raycaster();
        this.raycaster.params.Points.threshold = 0.14;
        this.raycaster.params.Line.threshold = 0.12;

        // Gesture / Pointer State
        this.pointers = new Map();
        this.gesture = null;
        this.bindPointerEvents();

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate();
      }

      setupLights() {
        this.hemiLight = new THREE.HemisphereLight(0xd8c8ff, 0x2d2438, 0.72);
        this.scene.add(this.hemiLight);

        this.keyLight = new THREE.DirectionalLight(0xffdfb8, 1.15);
        this.keyLight.position.set(5, 8, 6);
        this.keyLight.castShadow = true;
        this.keyLight.shadow.mapSize.set(1024, 1024);
        this.keyLight.shadow.bias = -0.0005;
        this.scene.add(this.keyLight);

        this.rimLight = new THREE.DirectionalLight(0x4de0cb, 0.55);
        this.rimLight.position.set(-5, 4, -5);
        this.scene.add(this.rimLight);

        // Ground shadow catcher
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(40, 40),
          new THREE.ShadowMaterial({ opacity: 0.28 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        this.scene.add(ground);
      }

      setupGrid() {
        this.grid = new THREE.GridHelper(16, 32, 0x6b5b95, 0x2d2542);
        this.grid.material.transparent = true;
        this.grid.material.opacity = 0.55;
        this.scene.add(this.grid);

        // Subtle X-symmetry plane indicator
        const symGeom = new THREE.PlaneGeometry(0.02, 6);
        const symMat = new THREE.MeshBasicMaterial({ color: 0x38d9c0, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
        this.symPlane = new THREE.Mesh(symGeom, symMat);
        this.symPlane.rotation.x = -Math.PI / 2;
        this.symPlane.position.y = 0.005;
        this.symPlane.visible = false;
        this.scene.add(this.symPlane);
      }

      buildGizmo() {
        // Tactile 3-axis handle gizmo for 1-finger touch dragging
        const axes = [
          { name: 'x', dir: new THREE.Vector3(1, 0, 0), color: 0xff5f7e, rot: [0, 0, -Math.PI / 2] },
          { name: 'y', dir: new THREE.Vector3(0, 1, 0), color: 0x4be39a, rot: [0, 0, 0] },
          { name: 'z', dir: new THREE.Vector3(0, 0, 1), color: 0x56b4ff, rot: [Math.PI / 2, 0, 0] },
        ];
        this.gizmoHandles = [];
        for (const a of axes) {
          const holder = new THREE.Group();
          const mat = new THREE.MeshBasicMaterial({ color: a.color, depthTest: false, transparent: true, opacity: 0.92 });
          const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.78, 8), mat);
          shaft.position.y = 0.39;
          const tip = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 10), mat);
          tip.position.y = 0.86;
          // Invisible larger touch collider for comfortable iPhone finger grabbing
          const hit = new THREE.Mesh(
            new THREE.CylinderGeometry(0.14, 0.14, 1.05, 6),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          hit.position.y = 0.52;
          hit.userData.gizmoAxis = a.name;

          holder.add(shaft, tip, hit);
          holder.rotation.set(...a.rot);
          this.gizmoGroup.add(holder);
          this.gizmoHandles.push(hit);
        }
        const centerBall = new THREE.Mesh(
          new THREE.SphereGeometry(0.085, 10, 10),
          new THREE.MeshBasicMaterial({ color: 0xf5a623, depthTest: false })
        );
        centerBall.userData.gizmoAxis = 'free';
        this.gizmoGroup.add(centerBall);
        this.gizmoHandles.push(centerBall);
        this.gizmoGroup.renderOrder = 999;
        this.gizmoGroup.visible = false;
      }

      resize() {
        const w = this.canvas.parentElement.clientWidth || window.innerWidth;
        const h = this.canvas.parentElement.clientHeight || window.innerHeight;
        const scale = this.app.state.preview.retro ? 0.45 : Math.min(window.devicePixelRatio || 1, 2);
        this.renderer.setPixelRatio(scale);
        this.renderer.setSize(w, h, false);
        this.perspCam.aspect = w / h;
        this.perspCam.updateProjectionMatrix();
        this.updateOrthoFrustum(w, h);
      }

      updateOrthoFrustum(w, h) {
        const aspect = (w || window.innerWidth) / (h || window.innerHeight);
        const halfH = this.camSpherical.radius * 0.45;
        this.orthoCam.left = -halfH * aspect;
        this.orthoCam.right = halfH * aspect;
        this.orthoCam.top = halfH;
        this.orthoCam.bottom = -halfH;
        this.orthoCam.updateProjectionMatrix();
      }

      setProjection(isOrtho) {
        this.isOrtho = isOrtho;
        this.camera = isOrtho ? this.orthoCam : this.perspCam;
        this.updateCameraTransform();
      }

      setStandardView(view) {
        if (view === 'front') { this.camSpherical.theta = 0; this.camSpherical.phi = Math.PI / 2; }
        else if (view === 'back') { this.camSpherical.theta = Math.PI; this.camSpherical.phi = Math.PI / 2; }
        else if (view === 'side') { this.camSpherical.theta = Math.PI / 2; this.camSpherical.phi = Math.PI / 2; }
        else if (view === 'top') { this.camSpherical.theta = 0; this.camSpherical.phi = 0.05; }
        this.updateCameraTransform();
      }

      focusSelected() {
        const obj = this.app.getSelectedObject();
        if (obj) {
          const b = obj.mesh.getBounds();
          this.camTarget.set(
            obj.position.x + b.center.x * obj.scale.x,
            obj.position.y + b.center.y * obj.scale.y,
            obj.position.z + b.center.z * obj.scale.z
          );
          const diag = Math.max(1.5, b.size.length() * Math.max(obj.scale.x, obj.scale.y, obj.scale.z));
          this.camSpherical.radius = diag * 1.9;
        } else {
          this.camTarget.set(0, 1.0, 0);
          this.camSpherical.radius = 5.2;
        }
        this.updateCameraTransform();
      }

      updateCameraTransform() {
        const { radius, theta, phi } = this.camSpherical;
        const clampedPhi = Math.max(0.05, Math.min(Math.PI - 0.05, phi));
        this.camSpherical.phi = clampedPhi;
        const x = this.camTarget.x + radius * Math.sin(clampedPhi) * Math.sin(theta);
        const y = this.camTarget.y + radius * Math.cos(clampedPhi);
        const z = this.camTarget.z + radius * Math.sin(clampedPhi) * Math.cos(theta);
        this.perspCam.position.set(x, y, z);
        this.perspCam.lookAt(this.camTarget);
        this.orthoCam.position.set(x, y, z);
        this.orthoCam.lookAt(this.camTarget);
        this.updateOrthoFrustum(this.canvas.clientWidth, this.canvas.clientHeight);
      }

      applyPreviewSettings() {
        const p = this.app.state.preview;
        this.resize();
        document.getElementById('retro-dither-overlay').classList.toggle('active', p.retro);
        this.scene.fog = p.retro ? new THREE.FogExp2(0x161224, 0.068) : null;

        if (p.mood === 'studio') {
          this.hemiLight.color.setHex(0xffffff);
          this.hemiLight.groundColor.setHex(0x4b4757);
          this.keyLight.color.setHex(0xffffff);
          this.keyLight.intensity = 1.05;
          this.rimLight.color.setHex(0xcbd5e1);
          this.rimLight.intensity = 0.4;
        } else {
          this.hemiLight.color.setHex(0xd8c8ff);
          this.hemiLight.groundColor.setHex(0x2d2438);
          this.keyLight.color.setHex(0xffdfb8);
          this.keyLight.intensity = 1.15;
          this.rimLight.color.setHex(0x4de0cb);
          this.rimLight.intensity = 0.6;
        }

        for (const entry of this.meshEntries.values()) {
          entry.wire.visible = p.wireframe;
          entry.outline.visible = p.outlines || p.retro;
        }
        this.symPlane.visible = this.app.state.symmetryX;
      }

      syncScene() {
        // Rebuild Three.js meshes cleanly from EditableMesh objects
        const activeIds = new Set(this.app.state.objects.map(o => o.id));
        for (const [id, entry] of this.meshEntries.entries()) {
          if (!activeIds.has(id)) {
            this.objectGroup.remove(entry.group);
            entry.mesh.geometry.dispose();
            entry.wire.geometry.dispose();
            entry.outline.geometry.dispose();
            this.meshEntries.delete(id);
          }
        }

        const selObjId = this.app.state.selectedObjectId;
        const mode = this.app.state.mode;

        for (const obj of this.app.state.objects) {
          let entry = this.meshEntries.get(obj.id);
          if (!entry) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({
              vertexColors: true,
              roughness: 0.82,
              metalness: 0.08,
              flatShading: obj.flatShading,
              polygonOffset: true,
              polygonOffsetFactor: 1,
              polygonOffsetUnits: 1
            });
            const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.objectId = obj.id;

            const wireMat = new THREE.LineBasicMaterial({ color: 0xffe4b5, transparent: true, opacity: 0.35 });
            const wire = new THREE.LineSegments(new THREE.BufferGeometry(), wireMat);

            const outMat = new THREE.MeshBasicMaterial({ color: 0x0b0812, side: THREE.BackSide });
            const outline = new THREE.Mesh(new THREE.BufferGeometry(), outMat);
            outline.scale.setScalar(1.03);

            group.add(mesh, wire, outline);
            this.objectGroup.add(group);
            entry = { group, mesh, wire, outline };
            this.meshEntries.set(obj.id, entry);
          }

          entry.group.visible = obj.visible;
          entry.group.position.set(obj.position.x, obj.position.y, obj.position.z);
          entry.group.rotation.set(obj.rotation.x, obj.rotation.y, obj.rotation.z);
          entry.group.scale.set(obj.scale.x, obj.scale.y, obj.scale.z);

          const selFaces = (obj.id === selObjId && mode === 'face') ? this.app.state.selectedFaces : null;
          const geom = obj.mesh.toThreeBufferGeometry(obj.flatShading, selFaces);
          entry.mesh.geometry.dispose();
          entry.mesh.geometry = geom;
          entry.mesh.material.flatShading = obj.flatShading;
          entry.mesh.material.emissive.setHex(obj.id === selObjId && mode === 'object' ? 0x2b1d0b : 0x000000);
          entry.mesh.material.needsUpdate = true;

          // Wireframe edges from true polygon topology
          const edges = obj.mesh.getEdges();
          const linePos = [];
          for (const e of edges) {
            const a = obj.mesh.vertices[e.a], b = obj.mesh.vertices[e.b];
            if (!a || !b) continue;
            linePos.push(a.x, a.y, a.z, b.x, b.y, b.z);
          }
          const wireGeom = new THREE.BufferGeometry();
          wireGeom.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
          entry.wire.geometry.dispose();
          entry.wire.geometry = wireGeom;
          entry.wire.visible = this.app.state.preview.wireframe || (obj.id === selObjId && mode !== 'object');

          // Outline mesh (non-destructive retro silhouette)
          entry.outline.geometry.dispose();
          entry.outline.geometry = geom.clone();
          entry.outline.visible = this.app.state.preview.outlines || this.app.state.preview.retro;
        }

        this.syncSubObjectOverlays();
        this.syncGizmoPosition();
        this.applyPreviewSettings();
      }

      syncSubObjectOverlays() {
        while (this.overlayGroup.children.length) {
          const c = this.overlayGroup.children.pop();
          if (c.geometry) c.geometry.dispose();
          if (c.material) c.material.dispose();
        }

        const obj = this.app.getSelectedObject();
        if (!obj || !obj.visible) return;
        const mode = this.app.state.mode;

        const container = new THREE.Group();
        container.position.set(obj.position.x, obj.position.y, obj.position.z);
        container.rotation.set(obj.rotation.x, obj.rotation.y, obj.rotation.z);
        container.scale.set(obj.scale.x, obj.scale.y, obj.scale.z);

        if (mode === 'vertex') {
          const selSet = new Set(this.app.state.selectedVerts);
          const pos = [], col = [];
          for (let i = 0; i < obj.mesh.vertices.length; i++) {
            const v = obj.mesh.vertices[i];
            pos.push(v.x, v.y, v.z);
            if (selSet.has(i)) col.push(1.0, 0.72, 0.18);
            else col.push(0.28, 0.88, 0.78);
          }
          const pGeom = new THREE.BufferGeometry();
          pGeom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
          pGeom.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
          const pts = new THREE.Points(
            pGeom,
            new THREE.PointsMaterial({ size: 11, sizeAttenuation: false, vertexColors: true, depthTest: false })
          );
          pts.renderOrder = 500;
          container.add(pts);
        } else if (mode === 'edge') {
          const selKeys = new Set(this.app.state.selectedEdges);
          const edges = obj.mesh.getEdges();
          const selPos = [];
          for (const e of edges) {
            if (selKeys.has(e.key)) {
              const a = obj.mesh.vertices[e.a], b = obj.mesh.vertices[e.b];
              selPos.push(a.x, a.y, a.z, b.x, b.y, b.z);
            }
          }
          if (selPos.length) {
            const eGeom = new THREE.BufferGeometry();
            eGeom.setAttribute('position', new THREE.Float32BufferAttribute(selPos, 3));
            const lines = new THREE.LineSegments(
              eGeom,
              new THREE.LineBasicMaterial({ color: 0xffb84d, depthTest: false })
            );
            lines.renderOrder = 500;
            container.add(lines);
          }
        }
        this.overlayGroup.add(container);
      }

      getSelectionPivotWorld() {
        const obj = this.app.getSelectedObject();
        if (!obj) return null;
        const entry = this.meshEntries.get(obj.id);
        if (!entry) return null;
        entry.group.updateMatrixWorld(true);

        const mode = this.app.state.mode;
        if (mode === 'object') {
          const b = obj.mesh.getBounds();
          return b.center.clone().applyMatrix4(entry.group.matrixWorld);
        }
        const indices = this.app.getActiveVertexIndices();
        if (!indices.length) return null;
        const avg = new THREE.Vector3();
        for (const vi of indices) {
          const v = obj.mesh.vertices[vi];
          if (v) avg.add(new THREE.Vector3(v.x, v.y, v.z));
        }
        avg.divideScalar(indices.length);
        return avg.applyMatrix4(entry.group.matrixWorld);
      }

      syncGizmoPosition() {
        const pivot = this.getSelectionPivotWorld();
        if (!pivot) {
          this.gizmoGroup.visible = false;
          return;
        }
        this.gizmoGroup.visible = true;
        this.gizmoGroup.position.copy(pivot);
        // Keep gizmo screen-size comfortable regardless of zoom
        const dist = this.camera.position.distanceTo(pivot);
        const s = Math.max(0.45, Math.min(2.2, dist * 0.16));
        this.gizmoGroup.scale.setScalar(s);
      }

      // ---- Pointer & Multi-Touch Gesture Engine (iPhone Safari + Apple Pencil + Desktop) ----
      getNDC(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        return new THREE.Vector2(
          ((clientX - rect.left) / rect.width) * 2 - 1,
          -((clientY - rect.top) / rect.height) * 2 + 1
        );
      }

      bindPointerEvents() {
        this.canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.canvas.setPointerCapture(e.pointerId);
          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, type: e.pointerType, button: e.button });

          // Two fingers => ALWAYS Camera Orbit + Pan + Pinch Zoom (strict separation!)
          if (this.pointers.size === 2) {
            if (this.gesture && this.gesture.kind === 'transform' && this.gesture.moved) {
              this.app.commitTransformGesture(this.gesture.beforeState);
            }
            const pts = Array.from(this.pointers.values());
            const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
            this.gesture = {
              kind: 'two_finger',
              midX: (pts[0].x + pts[1].x) * 0.5,
              midY: (pts[0].y + pts[1].y) * 0.5,
              dist: Math.hypot(dx, dy)
            };
            return;
          }

          if (this.pointers.size === 1) {
            // Desktop right-click or middle-click => Camera orbit / pan
            if (e.button === 2 || (e.button === 0 && e.altKey)) {
              this.gesture = { kind: e.shiftKey ? 'pan' : 'orbit', lastX: e.clientX, lastY: e.clientY };
              return;
            }
            if (e.button === 1) {
              this.gesture = { kind: 'pan', lastX: e.clientX, lastY: e.clientY };
              return;
            }

            // Check Gizmo hit first for immediate 1-finger manipulation
            const ndc = this.getNDC(e.clientX, e.clientY);
            this.raycaster.setFromCamera(ndc, this.camera);
            if (this.gizmoGroup.visible) {
              const gHits = this.raycaster.intersectObjects(this.gizmoHandles, false);
              if (gHits.length) {
                const axis = gHits[0].object.userData.gizmoAxis;
                this.startTransformGesture(e, axis);
                return;
              }
            }

            // Otherwise record pending tap vs 1-finger orbit
            this.gesture = {
              kind: 'tap_or_orbit',
              startX: e.clientX,
              startY: e.clientY,
              lastX: e.clientX,
              lastY: e.clientY,
              moved: false,
              pointerType: e.pointerType
            };
          }
        }, { passive: false });

        this.canvas.addEventListener('pointermove', (e) => {
          if (!this.pointers.has(e.pointerId)) return;
          e.preventDefault();
          const p = this.pointers.get(e.pointerId);
          p.x = e.clientX;
          p.y = e.clientY;

          if (!this.gesture) return;

          if (this.gesture.kind === 'two_finger' && this.pointers.size >= 2) {
            const pts = Array.from(this.pointers.values());
            const midX = (pts[0].x + pts[1].x) * 0.5;
            const midY = (pts[0].y + pts[1].y) * 0.5;
            const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);

            const dMidX = midX - this.gesture.midX;
            const dMidY = midY - this.gesture.midY;
            const dDist = dist - this.gesture.dist;

            // Pinch zoom
            if (Math.abs(dDist) > 1.2) {
              this.camSpherical.radius = Math.max(1.0, Math.min(28, this.camSpherical.radius * (1 - dDist * 0.0045)));
            }
            // Two-finger pan
            this.panCamera(dMidX, dMidY);

            this.gesture.midX = midX;
            this.gesture.midY = midY;
            this.gesture.dist = dist;
            this.updateCameraTransform();
            this.syncGizmoPosition();
            return;
          }

          if (this.gesture.kind === 'orbit') {
            this.camSpherical.theta -= (e.clientX - this.gesture.lastX) * 0.0085;
            this.camSpherical.phi -= (e.clientY - this.gesture.lastY) * 0.0085;
            this.gesture.lastX = e.clientX;
            this.gesture.lastY = e.clientY;
            this.updateCameraTransform();
            this.syncGizmoPosition();
            return;
          }

          if (this.gesture.kind === 'pan') {
            this.panCamera(e.clientX - this.gesture.lastX, e.clientY - this.gesture.lastY);
            this.gesture.lastX = e.clientX;
            this.gesture.lastY = e.clientY;
            this.updateCameraTransform();
            this.syncGizmoPosition();
            return;
          }

          if (this.gesture.kind === 'transform') {
            this.updateTransformGesture(e);
            return;
          }

          if (this.gesture.kind === 'tap_or_orbit') {
            const dist = Math.hypot(e.clientX - this.gesture.startX, e.clientY - this.gesture.startY);
            if (dist > 7) this.gesture.moved = true;
            if (this.gesture.moved) {
              this.camSpherical.theta -= (e.clientX - this.gesture.lastX) * 0.008;
              this.camSpherical.phi -= (e.clientY - this.gesture.lastY) * 0.008;
              this.gesture.lastX = e.clientX;
              this.gesture.lastY = e.clientY;
              this.updateCameraTransform();
              this.syncGizmoPosition();
            }
          }
        }, { passive: false });

        const endPointer = (e) => {
          if (!this.pointers.has(e.pointerId)) return;
          this.pointers.delete(e.pointerId);

          if (this.gesture) {
            if (this.gesture.kind === 'tap_or_orbit' && !this.gesture.moved) {
              this.handleTapSelect(e.clientX, e.clientY, this.gesture.pointerType);
            } else if (this.gesture.kind === 'transform') {
              document.getElementById('drag-hud').classList.add('hidden');
              if (this.gesture.moved) {
                this.app.commitTransformGesture(this.gesture.beforeState);
              }
            }
          }
          if (this.pointers.size === 0) this.gesture = null;
        };

        this.canvas.addEventListener('pointerup', endPointer);
        this.canvas.addEventListener('pointercancel', endPointer);
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        this.canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const factor = 1 + Math.sign(e.deltaY) * 0.1;
          this.camSpherical.radius = Math.max(1.0, Math.min(28, this.camSpherical.radius * factor));
          this.updateCameraTransform();
          this.syncGizmoPosition();
        }, { passive: false });
      }

      panCamera(dx, dy) {
        const panSpeed = this.camSpherical.radius * 0.0018;
        const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 1);
        this.camTarget.addScaledVector(right, -dx * panSpeed);
        this.camTarget.addScaledVector(up, dy * panSpeed);
      }

      startTransformGesture(e, hitAxis) {
        const obj = this.app.getSelectedObject();
        if (!obj) return;
        const axis = hitAxis === 'free' ? this.app.state.axisLock : hitAxis;
        const beforeState = this.app.serializeScene();
        const vertIndices = this.app.getActiveVertexIndices();

        // Symmetry partner lookup if X symmetry enabled in edit mode
        const symPairs = new Map();
        if (this.app.state.symmetryX && this.app.state.mode !== 'object') {
          const selSet = new Set(vertIndices);
          for (const vi of vertIndices) {
            const v = obj.mesh.vertices[vi];
            if (Math.abs(v.x) < 0.02) continue;
            let bestIdx = -1, bestDist = 0.08;
            for (let j = 0; j < obj.mesh.vertices.length; j++) {
              if (selSet.has(j)) continue;
              const o = obj.mesh.vertices[j];
              const d = Math.hypot(o.x + v.x, o.y - v.y, o.z - v.z);
              if (d < bestDist) { bestDist = d; bestIdx = j; }
            }
            if (bestIdx !== -1) symPairs.set(vi, { partner: bestIdx, orig: { ...obj.mesh.vertices[bestIdx] } });
          }
        }

        const origVerts = new Map();
        for (const vi of vertIndices) origVerts.set(vi, { ...obj.mesh.vertices[vi] });

        this.gesture = {
          kind: 'transform',
          axis,
          gizmoMode: this.app.state.gizmoMode,
          startX: e.clientX,
          startY: e.clientY,
          moved: false,
          beforeState,
          origObj: {
            pos: { ...obj.position },
            rot: { ...obj.rotation },
            scale: { ...obj.scale }
          },
          vertIndices,
          origVerts,
          symPairs,
          pivotLocal: (() => {
            const p = new THREE.Vector3();
            for (const vi of vertIndices) {
              const v = obj.mesh.vertices[vi];
              p.add(new THREE.Vector3(v.x, v.y, v.z));
            }
            return vertIndices.length ? p.divideScalar(vertIndices.length) : p;
          })()
        };
      }

      updateTransformGesture(e) {
        const obj = this.app.getSelectedObject();
        if (!obj || !this.gesture) return;
        const dx = e.clientX - this.gesture.startX;
        const dy = e.clientY - this.gesture.startY;
        if (Math.hypot(dx, dy) > 3) this.gesture.moved = true;

        const snap = this.app.state.snap;
        const sensitivity = this.camSpherical.radius * 0.004;
        const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 1);

        let worldDelta = new THREE.Vector3()
          .addScaledVector(right, dx * sensitivity)
          .addScaledVector(up, -dy * sensitivity);

        const axis = this.gesture.axis;
        if (axis === 'x') worldDelta.set(worldDelta.x, 0, 0);
        else if (axis === 'y') worldDelta.set(0, worldDelta.y, 0);
        else if (axis === 'z') worldDelta.set(0, 0, worldDelta.z);

        const snapVal = (v, step) => snap ? Math.round(v / step) * step : v;
        const hud = document.getElementById('drag-hud');
        hud.classList.remove('hidden');

        const gMode = this.gesture.gizmoMode;
        if (this.app.state.mode === 'object') {
          if (gMode === 'translate') {
            obj.position.x = snapVal(this.gesture.origObj.pos.x + worldDelta.x, 0.25);
            obj.position.y = snapVal(this.gesture.origObj.pos.y + worldDelta.y, 0.25);
            obj.position.z = snapVal(this.gesture.origObj.pos.z + worldDelta.z, 0.25);
            hud.textContent = `Move (${axis.toUpperCase()}): ${obj.position.x.toFixed(2)}, ${obj.position.y.toFixed(2)}, ${obj.position.z.toFixed(2)}`;
          } else if (gMode === 'rotate') {
            const angle = snapVal((dx - dy) * 0.012, Math.PI / 12);
            obj.rotation.x = this.gesture.origObj.rot.x + (axis === 'x' ? angle : 0);
            obj.rotation.y = this.gesture.origObj.rot.y + (axis === 'y' || axis === 'free' ? angle : 0);
            obj.rotation.z = this.gesture.origObj.rot.z + (axis === 'z' ? angle : 0);
            hud.textContent = `Rotate (${axis.toUpperCase()}): ${(angle * 180 / Math.PI).toFixed(0)}°`;
          } else if (gMode === 'scale') {
            const factor = Math.max(0.15, 1 + (dx - dy) * 0.006);
            obj.scale.x = snapVal(this.gesture.origObj.scale.x * (axis === 'x' || axis === 'free' ? factor : 1), 0.1);
            obj.scale.y = snapVal(this.gesture.origObj.scale.y * (axis === 'y' || axis === 'free' ? factor : 1), 0.1);
            obj.scale.z = snapVal(this.gesture.origObj.scale.z * (axis === 'z' || axis === 'free' ? factor : 1), 0.1);
            hud.textContent = `Scale (${axis.toUpperCase()}): ${factor.toFixed(2)}x`;
          }
        } else {
          // Sub-object manipulation (Vertex / Edge / Face)
          const piv = this.gesture.pivotLocal;
          const factor = Math.max(0.1, 1 + (dx - dy) * 0.006);
          const angle = snapVal((dx - dy) * 0.012, Math.PI / 12);

          for (const vi of this.gesture.vertIndices) {
            const o = this.gesture.origVerts.get(vi);
            const v = obj.mesh.vertices[vi];
            if (gMode === 'translate') {
              v.x = snapVal(o.x + worldDelta.x / obj.scale.x, 0.125);
              v.y = snapVal(o.y + worldDelta.y / obj.scale.y, 0.125);
              v.z = snapVal(o.z + worldDelta.z / obj.scale.z, 0.125);
            } else if (gMode === 'scale') {
              v.x = piv.x + (o.x - piv.x) * (axis === 'x' || axis === 'free' ? factor : 1);
              v.y = piv.y + (o.y - piv.y) * (axis === 'y' || axis === 'free' ? factor : 1);
              v.z = piv.z + (o.z - piv.z) * (axis === 'z' || axis === 'free' ? factor : 1);
            } else if (gMode === 'rotate') {
              const rel = new THREE.Vector3(o.x - piv.x, o.y - piv.y, o.z - piv.z);
              const rotAxis = axis === 'x' ? new THREE.Vector3(1, 0, 0) : axis === 'z' ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
              rel.applyAxisAngle(rotAxis, angle);
              v.x = piv.x + rel.x; v.y = piv.y + rel.y; v.z = piv.z + rel.z;
            }

            // Mirror X symmetry partner automatically
            if (this.gesture.symPairs.has(vi)) {
              const sp = this.gesture.symPairs.get(vi);
              const pv = obj.mesh.vertices[sp.partner];
              pv.x = -v.x;
              pv.y = v.y;
              pv.z = v.z;
            }
          }
          hud.textContent = gMode === 'translate'
            ? `Offset: ${worldDelta.x.toFixed(2)}, ${worldDelta.y.toFixed(2)}, ${worldDelta.z.toFixed(2)}`
            : gMode === 'scale' ? `Scale: ${factor.toFixed(2)}x` : `Rotate: ${(angle * 180 / Math.PI).toFixed(0)}°`;
        }

        this.syncScene();
      }

      handleTapSelect(clientX, clientY, pointerType) {
        const ndc = this.getNDC(clientX, clientY);
        this.raycaster.setFromCamera(ndc, this.camera);
        const mode = this.app.state.mode;

        if (mode === 'object') {
          const meshes = [];
          for (const entry of this.meshEntries.values()) {
            if (entry.group.visible) meshes.push(entry.mesh);
          }
          const hits = this.raycaster.intersectObjects(meshes, false);
          if (hits.length) {
            this.app.selectObject(hits[0].object.userData.objectId);
          } else {
            this.app.selectObject(null);
          }
          return;
        }

        const obj = this.app.getSelectedObject();
        if (!obj) return;
        const entry = this.meshEntries.get(obj.id);
        if (!entry) return;
        entry.group.updateMatrixWorld(true);

        // Generous touch pick radius on iPhone, finer for Apple Pencil / Mouse
        const pickPx = pointerType === 'touch' ? 28 : 16;
        const rect = this.canvas.getBoundingClientRect();
        const projectToScreen = (v) => {
          const w = new THREE.Vector3(v.x, v.y, v.z).applyMatrix4(entry.group.matrixWorld).project(this.camera);
          return { x: (w.x * 0.5 + 0.5) * rect.width + rect.left, y: (-w.y * 0.5 + 0.5) * rect.height + rect.top, z: w.z };
        };

        if (mode === 'face') {
          const hits = this.raycaster.intersectObject(entry.mesh, false);
          if (hits.length) {
            const triIdx = hits[0].faceIndex;
            const faceIdx = entry.mesh.geometry.userData.faceMap[triIdx];
            if (faceIdx !== undefined) this.app.toggleFaceSelection(faceIdx);
          } else {
            this.app.clearSubSelection();
          }
        } else if (mode === 'vertex') {
          let bestIdx = -1, bestD = pickPx;
          for (let i = 0; i < obj.mesh.vertices.length; i++) {
            const s = projectToScreen(obj.mesh.vertices[i]);
            if (s.z < -1 || s.z > 1) continue;
            const d = Math.hypot(s.x - clientX, s.y - clientY);
            if (d < bestD) { bestD = d; bestIdx = i; }
          }
          if (bestIdx !== -1) this.app.toggleVertexSelection(bestIdx);
          else this.app.clearSubSelection();
        } else if (mode === 'edge') {
          const edges = obj.mesh.getEdges();
          let bestKey = null, bestD = pickPx;
          for (const e of edges) {
            const sa = projectToScreen(obj.mesh.vertices[e.a]);
            const sb = projectToScreen(obj.mesh.vertices[e.b]);
            const d = this._distToSegment(clientX, clientY, sa.x, sa.y, sb.x, sb.y);
            if (d < bestD) { bestD = d; bestKey = e.key; }
          }
          if (bestKey) this.app.toggleEdgeSelection(bestKey);
          else this.app.clearSubSelection();
        }
      }

      _distToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1;
        const l2 = dx * dx + dy * dy;
        if (l2 === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * dx + (py - y1) * dy) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      animate() {
        requestAnimationFrame(() => this.animate());
        this.renderer.render(this.scene, this.camera);
      }
    }

    // =========================================================================
    // 8. STUDIO APPLICATION CONTROLLER
    // =========================================================================
    class StudioApp {
      constructor() {
        this.history = new HistoryManager(60);
        this.nextId = 1;
        this.activeSheet = null;
        this.autosaveTimer = null;

        this.state = {
          projectId: 'default_mansion_workshop',
          projectName: 'Haunted Mansion Props',
          mode: 'object',      // 'object' | 'vertex' | 'edge' | 'face'
          gizmoMode: 'translate',
          axisLock: 'free',
          symmetryX: false,
          snap: false,
          activeColor: '#6b442a',
          activeMaterialId: 'aged_wood',
          unitScale: 1.0,
          preview: {
            retro: false,
            wireframe: false,
            outlines: false,
            mood: 'mansion' // 'mansion' | 'studio'
          },
          objects: [],
          selectedObjectId: null,
          selectedVerts: [],
          selectedEdges: [],
          selectedFaces: []
        };

        this.viewport = new ViewportEngine(document.getElementById('viewport-canvas'), this);
        this.bindUI();
        this.loadDemoAsset('bookshelf', true);
        lucide.createIcons();
      }

      createSceneObject(name, mesh, pos = { x: 0, y: 0, z: 0 }) {
        return {
          id: 'obj_' + (this.nextId++),
          name,
          mesh,
          position: { x: pos.x || 0, y: pos.y || 0, z: pos.z || 0 },
          rotation: { x: 0, y: 0, z: 0 },
          scale: { x: 1, y: 1, z: 1 },
          visible: true,
          flatShading: true
        };
      }

      getSelectedObject() {
        return this.state.objects.find(o => o.id === this.state.selectedObjectId) || null;
      }

      getActiveVertexIndices() {
        const obj = this.getSelectedObject();
        if (!obj) return [];
        const mode = this.state.mode;
        if (mode === 'vertex') return [...this.state.selectedVerts];
        if (mode === 'edge') {
          const set = new Set();
          for (const key of this.state.selectedEdges) {
            const [a, b] = key.split('_').map(Number);
            if (!isNaN(a)) set.add(a);
            if (!isNaN(b)) set.add(b);
          }
          return Array.from(set);
        }
        if (mode === 'face') {
          const set = new Set();
          for (const fi of this.state.selectedFaces) {
            const f = obj.mesh.faces[fi];
            if (f) f.verts.forEach(vi => set.add(vi));
          }
          return Array.from(set);
        }
        return [];
      }

      serializeScene() {
        return {
          id: this.state.projectId,
          name: this.state.projectName,
          unitScale: this.state.unitScale,
          selectedObjectId: this.state.selectedObjectId,
          objects: this.state.objects.map(o => ({
            id: o.id,
            name: o.name,
            position: { ...o.position },
            rotation: { ...o.rotation },
            scale: { ...o.scale },
            visible: o.visible,
            flatShading: o.flatShading,
            mesh: o.mesh.toJSON()
          }))
        };
      }

      restoreScene(data, recordHistory = false) {
        this.state.projectId = data.id || this.state.projectId;
        this.state.projectName = data.name || 'Polycraft Project';
        this.state.unitScale = data.unitScale || 1.0;
        this.state.objects = (data.objects || []).map(o => ({
          id: o.id,
          name: o.name,
          position: { ...o.position },
          rotation: { ...o.rotation },
          scale: { ...o.scale },
          visible: o.visible !== false,
          flatShading: o.flatShading !== false,
          mesh: EditableMesh.fromJSON(o.mesh)
        }));
        this.nextId = Math.max(this.nextId, this.state.objects.length + 10);
        this.state.selectedObjectId = this.state.objects.some(o => o.id === data.selectedObjectId)
          ? data.selectedObjectId
          : (this.state.objects[0]?.id || null);
        this.clearSubSelection(true);
        if (recordHistory) this.pushHistory('Load Scene');
        this.refreshAll();
      }

      pushHistory(label = 'Edit') {
        this.history.push(this.serializeScene(), label);
        this.updateUndoRedoButtons();
        this.scheduleAutosave();
      }

      commitTransformGesture(beforeState) {
        // Ensure beforeState is on stack if needed, then push after state
        this.pushHistory('Transform');
      }

      scheduleAutosave() {
        clearTimeout(this.autosaveTimer);
        const statusEl = document.getElementById('project-status');
        statusEl.textContent = 'Saving...';
        this.autosaveTimer = setTimeout(async () => {
          const ok = await StorageManager.saveProject(this.serializeScene());
          statusEl.textContent = ok ? 'Autosaved' : 'In Memory';
        }, 650);
      }

      toast(msg) {
        const wrap = document.getElementById('toast-wrap');
        const el = document.createElement('div');
        el.className = 'toast-pill';
        el.textContent = msg;
        wrap.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.2s'; }, 2000);
        setTimeout(() => el.remove(), 2250);
      }

      // ---- Selection & Mode Control ----
      setMode(mode) {
        if (mode !== 'object' && !this.getSelectedObject()) {
          if (this.state.objects.length) this.state.selectedObjectId = this.state.objects[0].id;
          else { this.toast('Add an object first to edit geometry'); return; }
        }
        this.state.mode = mode;
        this.clearSubSelection(true);
        document.querySelectorAll('.seg-pill button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        this.refreshAll();
      }

      selectObject(id) {
        this.state.selectedObjectId = id;
        this.clearSubSelection(true);
        this.refreshAll();
      }

      toggleVertexSelection(vi) {
        const idx = this.state.selectedVerts.indexOf(vi);
        if (idx >= 0) this.state.selectedVerts.splice(idx, 1);
        else this.state.selectedVerts.push(vi);
        this.refreshAll();
      }

      toggleEdgeSelection(key) {
        const idx = this.state.selectedEdges.indexOf(key);
        if (idx >= 0) this.state.selectedEdges.splice(idx, 1);
        else this.state.selectedEdges.push(key);
        this.refreshAll();
      }

      toggleFaceSelection(fi) {
        const idx = this.state.selectedFaces.indexOf(fi);
        if (idx >= 0) this.state.selectedFaces.splice(idx, 1);
        else this.state.selectedFaces.push(fi);
        this.refreshAll();
      }

      clearSubSelection(silent = false) {
        this.state.selectedVerts = [];
        this.state.selectedEdges = [];
        this.state.selectedFaces = [];
        if (!silent) this.refreshAll();
      }

      // ---- Modeling Actions ----
      addPrimitive(type) {
        let mesh, name;
        const c = this.state.activeColor, m = this.state.activeMaterialId;
        if (type === 'box') { mesh = EditableMesh.createBox(1, 1, 1, c, m, 0, 0.5, 0); name = 'Low-Poly Box'; }
        else if (type === 'cylinder') { mesh = EditableMesh.createCylinder(0.45, 0.45, 1.2, 8, c, m, 0, 0.6, 0); name = 'Cylinder'; }
        else if (type === 'cone') { mesh = EditableMesh.createCone(0.6, 1.3, 7, c, m, 0, 0.65, 0); name = 'Cone Spire'; }
        else if (type === 'sphere') { mesh = EditableMesh.createLowPolySphere(0.6, 5, 8, c, m, 0, 0.6, 0); name = 'Clay Sphere'; }
        else if (type === 'roof') { mesh = EditableMesh.createRoofPrism(1.4, 0.9, 1.4, c, m); mesh.vertices.forEach(v => v.y += 0.45); name = 'Roof Prism'; }

        const offset = (this.state.objects.length % 4) * 0.45;
        const obj = this.createSceneObject(name, mesh, { x: offset, y: 0, z: 0 });
        this.state.objects.push(obj);
        this.state.selectedObjectId = obj.id;
        this.setMode('object');
        this.pushHistory(`Add ${name}`);
        this.viewport.focusSelected();
        this.toast(`Added ${name}`);
      }

      loadDemoAsset(which, replaceScene = false) {
        if (replaceScene) this.state.objects = [];
        if (which === 'bookshelf') {
          const obj = this.createSceneObject('Crooked Bookshelf', DemoWorkshop.buildCrookedBookshelf(), { x: replaceScene ? 0 : 1.9, y: 0, z: 0 });
          this.state.objects.push(obj);
          this.state.selectedObjectId = obj.id;
        } else if (which === 'door') {
          const obj = this.createSceneObject('Spooky Mansion Door', DemoWorkshop.buildSpookyMansionDoor(), { x: replaceScene ? 0 : -1.9, y: 0, z: 0 });
          this.state.objects.push(obj);
          this.state.selectedObjectId = obj.id;
        } else if (which === 'tree') {
          const obj = this.createSceneObject('Stylized Spooky Tree', DemoWorkshop.buildStylizedTree(), { x: replaceScene ? 0 : 2.1, y: 0, z: -0.8 });
          this.state.objects.push(obj);
          this.state.selectedObjectId = obj.id;
        } else if (which === 'vignette') {
          this.state.objects = [
            this.createSceneObject('Spooky Mansion Door', DemoWorkshop.buildSpookyMansionDoor(), { x: 0, y: 0, z: -0.6 }),
            this.createSceneObject('Crooked Bookshelf', DemoWorkshop.buildCrookedBookshelf(), { x: -2.1, y: 0, z: 0.2 }),
            this.createSceneObject('Stylized Spooky Tree', DemoWorkshop.buildStylizedTree(), { x: 2.2, y: 0, z: 0.2 }),
          ];
          this.state.selectedObjectId = this.state.objects[0].id;
        }
        this.clearSubSelection(true);
        this.pushHistory(`Load ${which}`);
        this.refreshAll();
        this.viewport.focusSelected();
        if (!replaceScene) this.toast('Spawned editable demo asset');
      }

      runFaceOp(op) {
        const obj = this.getSelectedObject();
        if (!obj || !this.state.selectedFaces.length) { this.toast('Tap one or more faces first'); return; }
        if (op === 'extrude') {
          this.state.selectedFaces = obj.mesh.extrudeFaces(this.state.selectedFaces, 0.35);
          this.toast('Extruded faces (+0.35m)');
        } else if (op === 'inset') {
          this.state.selectedFaces = obj.mesh.insetFaces(this.state.selectedFaces, 0.25);
          this.toast('Inset faces');
        } else if (op === 'bevel') {
          this.state.selectedFaces = obj.mesh.bevelFaces(this.state.selectedFaces, 0.14);
          this.toast('Beveled faces');
        } else if (op === 'subdivide') {
          this.state.selectedFaces = obj.mesh.subdivideFaces(this.state.selectedFaces);
          this.toast('Subdivided faces');
        } else if (op === 'paint') {
          for (const fi of this.state.selectedFaces) {
            obj.mesh.faces[fi].color = this.state.activeColor;
            obj.mesh.faces[fi].materialId = this.state.activeMaterialId;
          }
          this.toast('Painted selected faces');
        } else if (op === 'delete') {
          obj.mesh.deleteFaces(this.state.selectedFaces);
          this.state.selectedFaces = [];
          this.toast('Deleted faces');
        }
        this.pushHistory(`Face ${op}`);
        this.refreshAll();
      }

      runVertexOp(op) {
        const obj = this.getSelectedObject();
        if (!obj || !this.state.selectedVerts.length) { this.toast('Tap vertices first'); return; }
        if (op === 'weld') {
          if (this.state.selectedVerts.length < 2) { this.toast('Select at least 2 vertices to weld'); return; }
          obj.mesh.weldVertices(this.state.selectedVerts, 0);
          this.state.selectedVerts = [];
          this.toast('Welded vertices to center');
        } else if (op === 'delete') {
          obj.mesh.deleteVertices(this.state.selectedVerts);
          this.state.selectedVerts = [];
          this.toast('Deleted vertices');
        }
        this.pushHistory(`Vertex ${op}`);
        this.refreshAll();
      }

      runEdgeOp(op) {
        const obj = this.getSelectedObject();
        if (!obj || !this.state.selectedEdges.length) { this.toast('Tap edges first'); return; }
        if (op === 'subdivide') {
          // Subdivide faces adjacent to selected edges
          const edges = obj.mesh.getEdges().filter(e => this.state.selectedEdges.includes(e.key));
          const adjFaces = [...new Set(edges.flatMap(e => e.faces))];
          obj.mesh.subdivideFaces(adjFaces);
          this.state.selectedEdges = [];
          this.toast('Subdivided along selected edges');
          this.pushHistory('Edge Subdivide');
          this.refreshAll();
        }
      }

      runObjectOp(op) {
        const obj = this.getSelectedObject();
        if (!obj) { this.toast('Select an object first'); return; }
        if (op === 'duplicate') {
          const copy = this.createSceneObject(obj.name + ' Copy', obj.mesh.clone(), {
            x: obj.position.x + 0.8, y: obj.position.y, z: obj.position.z
          });
          copy.rotation = { ...obj.rotation };
          copy.scale = { ...obj.scale };
          copy.flatShading = obj.flatShading;
          this.state.objects.push(copy);
          this.state.selectedObjectId = copy.id;
          this.toast('Duplicated object');
        } else if (op === 'mirror') {
          obj.mesh.mirrorX(true);
          this.toast('Mirrored across X axis');
        } else if (op === 'shading') {
          obj.flatShading = !obj.flatShading;
          this.toast(obj.flatShading ? 'Flat PS2 shading enabled' : 'Smooth shading enabled');
        } else if (op === 'normals') {
          obj.mesh.recalculateNormals();
          this.toast('Recalculated outward normals');
        } else if (op === 'origin_bottom') {
          const b = obj.mesh.getBounds();
          const dx = b.center.x, dy = b.min.y, dz = b.center.z;
          for (const v of obj.mesh.vertices) { v.x -= dx; v.y -= dy; v.z -= dz; }
          obj.position.x += dx; obj.position.y += dy; obj.position.z += dz;
          this.toast('Origin snapped to base center (Godot ready)');
        } else if (op === 'crooked_quick') {
          obj.mesh.applyDeform('crooked', 0.25);
          this.toast('Added whimsical crookedness!');
        } else if (op === 'delete') {
          this.state.objects = this.state.objects.filter(o => o.id !== obj.id);
          this.state.selectedObjectId = this.state.objects[0]?.id || null;
          this.toast('Deleted object');
        }
        this.pushHistory(`Object ${op}`);
        this.refreshAll();
      }

      mergeAllVisible() {
        const vis = this.state.objects.filter(o => o.visible);
        if (vis.length < 2) { this.toast('Need at least 2 visible objects to merge'); return; }
        const combined = new EditableMesh();
        for (const o of vis) {
          const cloned = o.mesh.clone();
          const mat = new THREE.Matrix4().compose(
            new THREE.Vector3(o.position.x, o.position.y, o.position.z),
            new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rotation.x, o.rotation.y, o.rotation.z)),
            new THREE.Vector3(o.scale.x, o.scale.y, o.scale.z)
          );
          for (const v of cloned.vertices) {
            const tv = new THREE.Vector3(v.x, v.y, v.z).applyMatrix4(mat);
            v.x = tv.x; v.y = tv.y; v.z = tv.z;
          }
          combined.mergeWith(cloned);
        }
        const mergedObj = this.createSceneObject('Merged Asset', combined);
        this.state.objects = this.state.objects.filter(o => !o.visible);
        this.state.objects.push(mergedObj);
        this.state.selectedObjectId = mergedObj.id;
        this.pushHistory('Merge Visible');
        this.refreshAll();
        this.toast('Merged visible objects into 1 mesh');
      }

      // ---- UI Rendering & Wiring ----
      refreshAll() {
        this.viewport.syncScene();
        this.updateStats();
        this.updateContextBar();
        this.updateUndoRedoButtons();
        if (this.activeSheet) this.renderSheet(this.activeSheet);
        lucide.createIcons();
      }

      updateUndoRedoButtons() {
        document.getElementById('btn-undo').disabled = !this.history.canUndo();
        document.getElementById('btn-redo').disabled = !this.history.canRedo();
      }

      updateStats() {
        let tris = 0, faces = 0, verts = 0;
        for (const o of this.state.objects) {
          if (!o.visible) continue;
          tris += o.mesh.getTriangleCount();
          faces += o.mesh.faces.length;
          verts += o.mesh.vertices.length;
        }
        document.getElementById('stat-poly').textContent = `${tris} Tris · ${faces} Faces · ${verts} Verts`;
        const selEl = document.getElementById('stat-sel');
        const obj = this.getSelectedObject();
        if (!obj) selEl.textContent = '';
        else if (this.state.mode === 'object') selEl.textContent = obj.name;
        else if (this.state.mode === 'face') selEl.textContent = `${this.state.selectedFaces.length} face(s)`;
        else if (this.state.mode === 'edge') selEl.textContent = `${this.state.selectedEdges.length} edge(s)`;
        else selEl.textContent = `${this.state.selectedVerts.length} vert(s)`;
      }

      updateContextBar() {
        const bar = document.getElementById('context-bar');
        const obj = this.getSelectedObject();
        if (!obj || this.activeSheet) {
          bar.classList.add('hidden');
          return;
        }
        bar.classList.remove('hidden');

        let btns = [];
        if (this.state.mode === 'object') {
          btns = [
            { label: 'Duplicate', icon: 'copy', fn: () => this.runObjectOp('duplicate') },
            { label: 'Mirror X', icon: 'flip-horizontal', fn: () => this.runObjectOp('mirror') },
            { label: 'Crooked!', icon: 'sparkles', fn: () => this.runObjectOp('crooked_quick') },
            { label: obj.flatShading ? 'Flat' : 'Smooth', icon: 'sun', fn: () => this.runObjectOp('shading') },
            { label: 'Base Origin', icon: 'anchor', fn: () => this.runObjectOp('origin_bottom') },
            { label: 'Delete', icon: 'trash-2', danger: true, fn: () => this.runObjectOp('delete') },
          ];
        } else if (this.state.mode === 'face') {
          btns = [
            { label: 'Extrude', icon: 'arrow-up-from-line', accent: true, fn: () => this.runFaceOp('extrude') },
            { label: 'Inset', icon: 'minimize-2', fn: () => this.runFaceOp('inset') },
            { label: 'Bevel', icon: 'octagon', fn: () => this.runFaceOp('bevel') },
            { label: 'Subdivide', icon: 'grid-2x2', fn: () => this.runFaceOp('subdivide') },
            { label: 'Paint', icon: 'paintbrush', fn: () => this.runFaceOp('paint') },
            { label: 'Delete', icon: 'trash-2', danger: true, fn: () => this.runFaceOp('delete') },
          ];
        } else if (this.state.mode === 'edge') {
          btns = [
            { label: 'Subdivide Edge', icon: 'split', accent: true, fn: () => this.runEdgeOp('subdivide') },
            { label: 'Clear', icon: 'x', fn: () => this.clearSubSelection() },
          ];
        } else if (this.state.mode === 'vertex') {
          btns = [
            { label: 'Weld Selected', icon: 'git-merge', accent: true, fn: () => this.runVertexOp('weld') },
            { label: 'Delete Vert', icon: 'trash-2', danger: true, fn: () => this.runVertexOp('delete') },
            { label: 'Clear', icon: 'x', fn: () => this.clearSubSelection() },
          ];
        }

        bar.innerHTML = '';
        for (const b of btns) {
          const el = document.createElement('button');
          el.className = `touch-btn px-2.5 !min-h-9 whitespace-nowrap ${b.accent ? 'active' : ''} ${b.danger ? 'text-rose-300' : ''}`;
          el.innerHTML = `<i data-lucide="${b.icon}" class="w-3.5 h-3.5"></i><span>${b.label}</span>`;
          el.addEventListener('click', b.fn);
          bar.appendChild(el);
        }
      }

      openSheet(name) {
        if (this.activeSheet === name) { this.closeSheet(); return; }
        this.activeSheet = name;
        document.querySelectorAll('nav [data-sheet]').forEach(b => b.classList.toggle('active', b.dataset.sheet === name));
        const sheet = document.getElementById('studio-sheet');
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        this.updateContextBar();
        this.renderSheet(name);
        lucide.createIcons();
      }

      closeSheet() {
        this.activeSheet = null;
        document.querySelectorAll('nav [data-sheet]').forEach(b => b.classList.remove('active'));
        const sheet = document.getElementById('studio-sheet');
        sheet.classList.remove('open');
        sheet.setAttribute('aria-hidden', 'true');
        this.updateContextBar();
      }

        } else if (name === 'export') {
