              midY: (pts[0].y + pts[1].y) * 0.5,
              dist: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y)
            };
            return;
          }

          if (this.pointers.size === 1) {
            if (e.button === 2 || (e.button === 0 && e.altKey)) {
              this.gesture = { kind: e.shiftKey ? 'pan' : 'orbit', lastX: e.clientX, lastY: e.clientY };
              return;
            }
            if (e.button === 1) {
              this.gesture = { kind: 'pan', lastX: e.clientX, lastY: e.clientY };
              return;
            }

            // Phase 2: Direct Sculpt or 3D Texture Paint on 1-finger touch over mesh!
            if (this.app.state.mode === 'sculpt') {
              if (this.trySculptAt(e.clientX, e.clientY)) {
                this.gesture = { kind: 'sculpt', moved: true };
                return;
              }
            } else if (this.app.state.mode === 'paint') {
              if (this.tryPaintAt(e.clientX, e.clientY)) {
                this.gesture = { kind: 'paint', moved: true };
                return;
              }
            } else if (this.app.state.mode === 'rig' && this.ikHandles.length) {
              this.raycaster.setFromCamera(this.getNDC(e.clientX, e.clientY), this.camera);
              const ikHits = this.raycaster.intersectObjects(this.ikHandles, false);
              if (ikHits.length) {
                const hitObj = ikHits[0].object;
                const worldPt = new THREE.Vector3();
                hitObj.getWorldPosition(worldPt);
                const camDir = new THREE.Vector3();
                this.camera.getWorldDirection(camDir);
                const dragPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(camDir.negate(), worldPt);
                this.gesture = { kind: 'ik_drag', limb: hitObj.userData.ikLimb, label: hitObj.userData.ikLabel, plane: dragPlane, moved: false };
                return;
              }
            }

            // Gizmo hit test
            this.raycaster.setFromCamera(this.getNDC(e.clientX, e.clientY), this.camera);
            if (this.gizmoGroup.visible) {
              const gHits = this.raycaster.intersectObjects(this.gizmoHandles, false);
              if (gHits.length) {
                this.startTransformGesture(e, gHits[0].object.userData.gizmoAxis);
                return;
              }
            }

            this.gesture = { kind: 'tap_or_orbit', startX: e.clientX, startY: e.clientY, lastX: e.clientX, lastY: e.clientY, moved: false, pointerType: e.pointerType };
          }
        }, { passive: false });

        this.canvas.addEventListener('pointermove', (e) => {
          if (!this.pointers.has(e.pointerId)) return;
          e.preventDefault();
          const p = this.pointers.get(e.pointerId);
          p.x = e.clientX; p.y = e.clientY;
          if (!this.gesture) return;

          if (this.gesture.kind === 'two_finger' && this.pointers.size >= 2) {
            const pts = Array.from(this.pointers.values());
            const midX = (pts[0].x + pts[1].x) * 0.5, midY = (pts[0].y + pts[1].y) * 0.5;
            const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
            const dDist = dist - this.gesture.dist;
            if (Math.abs(dDist) > 1.2) this.camSpherical.radius = Math.max(1.0, Math.min(28, this.camSpherical.radius * (1 - dDist * 0.0045)));
            this.panCamera(midX - this.gesture.midX, midY - this.gesture.midY);
            this.gesture.midX = midX; this.gesture.midY = midY; this.gesture.dist = dist;
            this.updateCameraTransform(); this.syncGizmoPosition();
            return;
          }
          if (this.gesture.kind === 'sculpt') { this.trySculptAt(e.clientX, e.clientY); return; }
          if (this.gesture.kind === 'paint')  { this.tryPaintAt(e.clientX, e.clientY); return; }
          if (this.gesture.kind === 'ik_drag') {
            const obj = this.app.getSelectedObject();
            const entry = obj && this.meshEntries.get(obj.id);
            if (!obj || !obj.rig || !entry) return;
            this.raycaster.setFromCamera(this.getNDC(e.clientX, e.clientY), this.camera);
            const hitWorld = new THREE.Vector3();
            if (this.raycaster.ray.intersectPlane(this.gesture.plane, hitWorld)) {
              entry.group.updateMatrixWorld(true);
              const invMat = new THREE.Matrix4().copy(entry.group.matrixWorld).invert();
              const localTarget = hitWorld.clone().applyMatrix4(invMat);
              RigEngine.solveTwoBoneIK(obj.rig.bones, this.gesture.limb, localTarget);
              this.gesture.moved = true;
              const hud = document.getElementById('drag-hud');
              hud.classList.remove('hidden');
              hud.textContent = `Puppet IK: ${this.gesture.label}`;
              this.syncScene();
            }
            return;
          }
          if (this.gesture.kind === 'orbit') {
            this.camSpherical.theta -= (e.clientX - this.gesture.lastX) * 0.0085;
            this.camSpherical.phi -= (e.clientY - this.gesture.lastY) * 0.0085;
            this.gesture.lastX = e.clientX; this.gesture.lastY = e.clientY;
            this.updateCameraTransform(); this.syncGizmoPosition();
            return;
          }
          if (this.gesture.kind === 'pan') {
            this.panCamera(e.clientX - this.gesture.lastX, e.clientY - this.gesture.lastY);
            this.gesture.lastX = e.clientX; this.gesture.lastY = e.clientY;
            this.updateCameraTransform(); this.syncGizmoPosition();
            return;
          }
          if (this.gesture.kind === 'transform') { this.updateTransformGesture(e); return; }
          if (this.gesture.kind === 'tap_or_orbit') {
            if (Math.hypot(e.clientX - this.gesture.startX, e.clientY - this.gesture.startY) > 7) this.gesture.moved = true;
            if (this.gesture.moved) {
              this.camSpherical.theta -= (e.clientX - this.gesture.lastX) * 0.008;
              this.camSpherical.phi -= (e.clientY - this.gesture.lastY) * 0.008;
              this.gesture.lastX = e.clientX; this.gesture.lastY = e.clientY;
              this.updateCameraTransform(); this.syncGizmoPosition();
            }
          }
        }, { passive: false });

        const endPointer = (e) => {
          if (!this.pointers.has(e.pointerId)) return;
          this.pointers.delete(e.pointerId);
          if (this.gesture) {
            if (this.gesture.kind === 'tap_or_orbit' && !this.gesture.moved) {
              this.handleTapSelect(e.clientX, e.clientY, this.gesture.pointerType);
            } else if (this.gesture.kind === 'transform' || this.gesture.kind === 'sculpt' || this.gesture.kind === 'paint' || this.gesture.kind === 'ik_drag') {
              document.getElementById('drag-hud').classList.add('hidden');
              if (this.gesture.moved) this.app.commitGesture(this.gesture.kind);
            }
          }
          if (this.pointers.size === 0) this.gesture = null;
        };
        this.canvas.addEventListener('pointerup', endPointer);
        this.canvas.addEventListener('pointercancel', endPointer);
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        this.canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          this.camSpherical.radius = Math.max(1.0, Math.min(28, this.camSpherical.radius * (1 + Math.sign(e.deltaY) * 0.1)));
          this.updateCameraTransform(); this.syncGizmoPosition();
        }, { passive: false });
      }

      panCamera(dx, dy) {
        const panSpeed = this.camSpherical.radius * 0.0018;
        const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 1);
        this.camTarget.addScaledVector(right, -dx * panSpeed);
        this.camTarget.addScaledVector(up, dy * panSpeed);
      }

      startTransformGesture(e, hitAxis) {
        const obj = this.app.getSelectedObject();
        if (!obj) return;
        const axis = hitAxis === 'free' ? this.app.state.axisLock : hitAxis;
        const vertIndices = this.app.getActiveVertexIndices();
        const symPairs = new Map();
        if (this.app.state.symmetryX && this.app.state.mode !== 'object') {
          const selSet = new Set(vertIndices);
          for (const vi of vertIndices) {
            const v = obj.mesh.vertices[vi];
            if (Math.abs(v.x) < 0.02) continue;
            let bestIdx = -1, bestDist = 0.08;
            for (let j = 0; j < obj.mesh.vertices.length; j++) {
              if (selSet.has(j)) continue;
              const o = obj.mesh.vertices[j];
              const d = Math.hypot(o.x + v.x, o.y - v.y, o.z - v.z);
              if (d < bestDist) { bestDist = d; bestIdx = j; }
            }
            if (bestIdx !== -1) symPairs.set(vi, { partner: bestIdx });
          }
        }
        const origVerts = new Map();
        for (const vi of vertIndices) origVerts.set(vi, { ...obj.mesh.vertices[vi] });
        const piv = new THREE.Vector3();
        for (const vi of vertIndices) { const v = obj.mesh.vertices[vi]; piv.add(new THREE.Vector3(v.x, v.y, v.z)); }
        if (vertIndices.length) piv.divideScalar(vertIndices.length);

        this.gesture = {
          kind: 'transform', axis, gizmoMode: this.app.state.gizmoMode,
          startX: e.clientX, startY: e.clientY, moved: false,
          origObj: { pos: { ...obj.position }, rot: { ...obj.rotation }, scale: { ...obj.scale } },
          vertIndices, origVerts, symPairs, pivotLocal: piv
        };
      }

      updateTransformGesture(e) {
        const obj = this.app.getSelectedObject();
        if (!obj || !this.gesture) return;
        const dx = e.clientX - this.gesture.startX, dy = e.clientY - this.gesture.startY;
        if (Math.hypot(dx, dy) > 3) this.gesture.moved = true;

        const snap = this.app.state.snap;
        const sensitivity = this.camSpherical.radius * 0.004;
        const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 1);
        let worldDelta = new THREE.Vector3().addScaledVector(right, dx * sensitivity).addScaledVector(up, -dy * sensitivity);
        const axis = this.gesture.axis;
        if (axis === 'x') worldDelta.set(worldDelta.x, 0, 0);
        else if (axis === 'y') worldDelta.set(0, worldDelta.y, 0);
        else if (axis === 'z') worldDelta.set(0, 0, worldDelta.z);

        const snapVal = (v, step) => snap ? Math.round(v / step) * step : v;
        const hud = document.getElementById('drag-hud');
        hud.classList.remove('hidden');
        const gMode = this.gesture.gizmoMode;

        if (this.app.state.mode === 'object') {
          if (gMode === 'translate') {
            obj.position.x = snapVal(this.gesture.origObj.pos.x + worldDelta.x, 0.25);
            obj.position.y = snapVal(this.gesture.origObj.pos.y + worldDelta.y, 0.25);
            obj.position.z = snapVal(this.gesture.origObj.pos.z + worldDelta.z, 0.25);
            hud.textContent = `Move (${axis.toUpperCase()}): ${obj.position.x.toFixed(2)}, ${obj.position.y.toFixed(2)}, ${obj.position.z.toFixed(2)}`;
          } else if (gMode === 'rotate') {
            const angle = snapVal((dx - dy) * 0.012, Math.PI / 12);
            obj.rotation.x = this.gesture.origObj.rot.x + (axis === 'x' ? angle : 0);
            obj.rotation.y = this.gesture.origObj.rot.y + (axis === 'y' || axis === 'free' ? angle : 0);
            obj.rotation.z = this.gesture.origObj.rot.z + (axis === 'z' ? angle : 0);
            hud.textContent = `Rotate (${axis.toUpperCase()}): ${(angle * 180 / Math.PI).toFixed(0)}°`;
          } else if (gMode === 'scale') {
            const factor = Math.max(0.15, 1 + (dx - dy) * 0.006);
            obj.scale.x = snapVal(this.gesture.origObj.scale.x * (axis === 'x' || axis === 'free' ? factor : 1), 0.1);
            obj.scale.y = snapVal(this.gesture.origObj.scale.y * (axis === 'y' || axis === 'free' ? factor : 1), 0.1);
            obj.scale.z = snapVal(this.gesture.origObj.scale.z * (axis === 'z' || axis === 'free' ? factor : 1), 0.1);
            hud.textContent = `Scale (${axis.toUpperCase()}): ${factor.toFixed(2)}x`;
          }
        } else {
          const piv = this.gesture.pivotLocal;
          const factor = Math.max(0.1, 1 + (dx - dy) * 0.006);
          const angle = snapVal((dx - dy) * 0.012, Math.PI / 12);
          for (const vi of this.gesture.vertIndices) {
            const o = this.gesture.origVerts.get(vi), v = obj.mesh.vertices[vi];
            if (gMode === 'translate') {
              v.x = snapVal(o.x + worldDelta.x / obj.scale.x, 0.125);
              v.y = snapVal(o.y + worldDelta.y / obj.scale.y, 0.125);
              v.z = snapVal(o.z + worldDelta.z / obj.scale.z, 0.125);
            } else if (gMode === 'scale') {
              v.x = piv.x + (o.x - piv.x) * (axis === 'x' || axis === 'free' ? factor : 1);
              v.y = piv.y + (o.y - piv.y) * (axis === 'y' || axis === 'free' ? factor : 1);
              v.z = piv.z + (o.z - piv.z) * (axis === 'z' || axis === 'free' ? factor : 1);
            } else if (gMode === 'rotate') {
              const rel = new THREE.Vector3(o.x - piv.x, o.y - piv.y, o.z - piv.z);
              const rotAxis = axis === 'x' ? new THREE.Vector3(1, 0, 0) : axis === 'z' ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
              rel.applyAxisAngle(rotAxis, angle);
              v.x = piv.x + rel.x; v.y = piv.y + rel.y; v.z = piv.z + rel.z;
            }
            if (this.gesture.symPairs.has(vi)) {
              const pv = obj.mesh.vertices[this.gesture.symPairs.get(vi).partner];
              pv.x = -v.x; pv.y = v.y; pv.z = v.z;
            }
          }
          hud.textContent = gMode === 'translate' ? `Offset: ${worldDelta.x.toFixed(2)}, ${worldDelta.y.toFixed(2)}, ${worldDelta.z.toFixed(2)}`
            : gMode === 'scale' ? `Scale: ${factor.toFixed(2)}x` : `Rotate: ${(angle * 180 / Math.PI).toFixed(0)}°`;
        }
        this.syncScene();
      }

      handleTapSelect(clientX, clientY, pointerType) {
        const ndc = this.getNDC(clientX, clientY);
        this.raycaster.setFromCamera(ndc, this.camera);
        const mode = this.app.state.mode;

        if (mode === 'object' || mode === 'sculpt' || mode === 'paint') {
          const meshes = [];
          for (const entry of this.meshEntries.values()) if (entry.group.visible) meshes.push(entry.mesh);
          const hits = this.raycaster.intersectObjects(meshes, false);
          if (hits.length) this.app.selectObject(hits[0].object.userData.objectId);
          else if (mode === 'object') this.app.selectObject(null);
          return;
        }

        const obj = this.app.getSelectedObject();
        if (!obj) return;
        const entry = this.meshEntries.get(obj.id);
        if (!entry) return;
        entry.group.updateMatrixWorld(true);
        const pickPx = pointerType === 'touch' ? 28 : 16;
        const rect = this.canvas.getBoundingClientRect();
        const projectToScreen = (v) => {
          const w = new THREE.Vector3(v.x, v.y, v.z).applyMatrix4(entry.group.matrixWorld).project(this.camera);
          return { x: (w.x * 0.5 + 0.5) * rect.width + rect.left, y: (-w.y * 0.5 + 0.5) * rect.height + rect.top, z: w.z };
        };

        if (mode === 'face') {
          const hits = this.raycaster.intersectObject(entry.mesh, false);
          if (hits.length) {
            const faceIdx = entry.mesh.geometry.userData.faceMap[hits[0].faceIndex];
            if (faceIdx !== undefined) this.app.toggleFaceSelection(faceIdx);
          } else this.app.clearSubSelection();
        } else if (mode === 'vertex') {
          let bestIdx = -1, bestD = pickPx;
          for (let i = 0; i < obj.mesh.vertices.length; i++) {
            const s = projectToScreen(obj.mesh.vertices[i]);
            if (s.z < -1 || s.z > 1) continue;
            const d = Math.hypot(s.x - clientX, s.y - clientY);
            if (d < bestD) { bestD = d; bestIdx = i; }
          }
          if (bestIdx !== -1) this.app.toggleVertexSelection(bestIdx);
          else this.app.clearSubSelection();
        } else if (mode === 'edge') {
          let bestKey = null, bestD = pickPx;
          for (const e of obj.mesh.getEdges()) {
            const sa = projectToScreen(obj.mesh.vertices[e.a]), sb = projectToScreen(obj.mesh.vertices[e.b]);
            const d = this._distToSegment(clientX, clientY, sa.x, sa.y, sb.x, sb.y);
            if (d < bestD) { bestD = d; bestKey = e.key; }
          }
          if (bestKey) this.app.toggleEdgeSelection(bestKey);
          else this.app.clearSubSelection();
        }
      }

      _distToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
        if (l2 === 0) return Math.hypot(px - x1, py - y1);
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      animate() {
        requestAnimationFrame(() => this.animate());
        const now = performance.now();
        const dt = Math.min(0.05, (now - this.lastFrameTime) / 1000);
        this.lastFrameTime = now;
        if (this.app && this.app.state.anim.playing) {
          this.app.stepAnimation(dt);
        }
        this.renderer.render(this.scene, this.camera);
      }
    }

    // =========================================================================
    // 9. STUDIO APPLICATION CONTROLLER
    // =========================================================================
    class StudioApp {
      constructor() {
        this.history = new HistoryManager(60);
        this.nextId = 1;
        this.activeSheet = null;
        this.addTab = 'workshop';
        this.paintTab = 'brush';
        this.autosaveTimer = null;

        this.state = {
          projectId: 'default_mansion_workshop',
          projectName: 'Haunted Mansion Props',
          mode: 'object',
          gizmoMode: 'translate',
          axisLock: 'free',
          symmetryX: false,
          snap: false,
          activeColor: '#6b442a',
          activeMaterialId: 'aged_wood',
          unitScale: 1.0,
          sculpt: { brush: 'pull', radius: 0.55, strength: 0.08 },
          paint:  { tool: 'brush', size: 22, opacity: 0.9, res: 128, procType: 'wood', wear: 0.45 },
          workshop: { type: 'bookshelf', height: 1.0, width: 1.0, chunkiness: 1.0, crookedness: 0.34, detail: 1.0 },
          charBuilder: { archetype: 'sleuth', head: 1.0, torso: 0.85, shoulders: 0.92, limbs: 1.2, chunk: 0.94, hair: 'shaggy', outfit: 'sweater', acc: 'none', expr: 'smirk', shirt: '#4ea363', pants: '#6b3e2e', hairCol: '#8a552c', skin: '#f0c49b' },
          anim: { playing: false, time: 0, speed: 1.0, clipIndex: 0, showGhost: false, copiedPose: null },
          draw: { active: false, kind: 'silhouette', points: [], depth: 0.45, radius: 0.14, styleFlag: true },
          preview: { retro: false, wireframe: false, outlines: false, mood: 'mansion' },
          objects: [],
          selectedObjectId: null,
          selectedVerts: [],
          selectedEdges: [],
          selectedFaces: []
        };

        this.viewport = new ViewportEngine(document.getElementById('viewport-canvas'), this);
        this.bindUI();
        this.bindDrawOverlay();
        this.bindTexturePad();
        this.loadDemoAsset('bookshelf', true);
        const heroChar = CharacterWorkshop.buildCharacter(this.state.charBuilder);
        const cObj = this.createSceneObject('Shaggy Sleuth', heroChar.mesh, { x: -1.35, y: 0, z: 0.35 });
        cObj.flatShading = false;
        const cTex = this.ensureObjectTexture(cObj, 512);
        MaterialLib.renderPS2CharacterAtlas(cTex, this.state.charBuilder);
        cObj.textureDataUrl = cTex.toDataURL('image/png');
        cObj.rig = { bones: heroChar.bones, selectedBone: 4, showHeatmap: false };
        cObj.animations = AnimEngine.createDefaultClips();
        RigEngine.applyPresetPose(cObj.rig.bones, 'idle');
        this.state.objects.push(cObj);
        this.state.selectedObjectId = cObj.id;
        this.pushHistory('Starter PS2 Scene');
        this.refreshAll();
        this.viewport.focusSelected();
        lucide.createIcons();
      }

      createSceneObject(name, mesh, pos = { x: 0, y: 0, z: 0 }) {
        return {
          id: 'obj_' + (this.nextId++),
          name,
          mesh,
          position: { x: pos.x || 0, y: pos.y || 0, z: pos.z || 0 },
          rotation: { x: 0, y: 0, z: 0 },
          scale: { x: 1, y: 1, z: 1 },
          visible: true,
          flatShading: true,
          textureCanvas: null,
          textureDataUrl: null,
          rig: null,
          animations: []
        };
      }

      ensureObjectTexture(obj, forceRes = null) {
        const res = forceRes || this.state.paint.res || 128;
        if (obj.textureCanvas && (!forceRes || obj.textureCanvas.width === res)) return obj.textureCanvas;
        const c = document.createElement('canvas');
        c.width = res; c.height = res;
        const ctx = c.getContext('2d');
        if (obj.textureCanvas) {
          ctx.drawImage(obj.textureCanvas, 0, 0, res, res);
        } else {
          ctx.fillStyle = obj.mesh.faces[0]?.color || this.state.activeColor;
          ctx.fillRect(0, 0, res, res);
        }
        obj.textureCanvas = c;
        obj.textureDataUrl = c.toDataURL('image/png');
        return c;
      }

      getSelectedObject() { return this.state.objects.find(o => o.id === this.state.selectedObjectId) || null; }

      getActiveVertexIndices() {
        const obj = this.getSelectedObject();
        if (!obj) return [];
        if (this.state.mode === 'vertex') return [...this.state.selectedVerts];
        if (this.state.mode === 'edge') {
          const set = new Set();
          for (const key of this.state.selectedEdges) {
            const [a, b] = key.split('_').map(Number);
            if (!isNaN(a)) set.add(a);
            if (!isNaN(b)) set.add(b);
          }
          return Array.from(set);
        }
        if (this.state.mode === 'face') {
          const set = new Set();
          for (const fi of this.state.selectedFaces) obj.mesh.faces[fi]?.verts.forEach(vi => set.add(vi));
          return Array.from(set);
        }
        return [];
      }

      serializeScene() {
        return {
          id: this.state.projectId,
          name: this.state.projectName,
          unitScale: this.state.unitScale,
          selectedObjectId: this.state.selectedObjectId,
          objects: this.state.objects.map(o => ({
            id: o.id, name: o.name,
            position: { ...o.position }, rotation: { ...o.rotation }, scale: { ...o.scale },
            visible: o.visible, flatShading: o.flatShading,
            textureDataUrl: o.textureCanvas ? o.textureCanvas.toDataURL('image/png') : o.textureDataUrl,
            rig: o.rig ? JSON.parse(JSON.stringify(o.rig)) : null,
            animations: o.animations ? JSON.parse(JSON.stringify(o.animations)) : [],
            mesh: o.mesh.toJSON()
          }))
        };
      }

      appendSceneObjects(data) {
        const list = Array.isArray(data.objects) ? data.objects : (data.mesh ? [data] : []);
        if (!list.length) return 0;
        let lastId = null;
        for (const o of list) {
          const obj = {
            id: 'obj_' + (this.nextId++),
            name: o.name || 'Imported Asset',
            position: { x: o.position?.x || 0, y: o.position?.y || 0, z: o.position?.z || 0 },
            rotation: { x: o.rotation?.x || 0, y: o.rotation?.y || 0, z: o.rotation?.z || 0 },
            scale: { x: o.scale?.x || 1, y: o.scale?.y || 1, z: o.scale?.z || 1 },
            visible: o.visible !== false,
            flatShading: o.flatShading !== false,
            mesh: EditableMesh.fromJSON(o.mesh),
            textureCanvas: null,
            textureDataUrl: o.textureDataUrl || null,
            rig: o.rig ? JSON.parse(JSON.stringify(o.rig)) : null,
            animations: o.animations ? JSON.parse(JSON.stringify(o.animations)) : []
          };
          if (obj.textureDataUrl) {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement('canvas');
              c.width = img.width || 256; c.height = img.height || 256;
              c.getContext('2d').drawImage(img, 0, 0);
              obj.textureCanvas = c;
              this.viewport.syncScene();
            };
            img.src = obj.textureDataUrl;
          }
          this.state.objects.push(obj);
          lastId = obj.id;
        }
        if (lastId) this.state.selectedObjectId = lastId;
        this.clearSubSelection(true);
        this.pushHistory('Append Asset');
        this.refreshAll();
        this.viewport.focusSelected();
        return list.length;
      }

      restoreScene(data, recordHistory = false) {
        this.state.projectId = data.id || this.state.projectId;
        this.state.projectName = data.name || 'Polycraft Project';
        this.state.unitScale = data.unitScale || 1.0;
        this.state.objects = (data.objects || []).map(o => {
          const obj = {
            id: o.id, name: o.name,
            position: { ...o.position }, rotation: { ...o.rotation }, scale: { ...o.scale },
            visible: o.visible !== false, flatShading: o.flatShading !== false,
            mesh: EditableMesh.fromJSON(o.mesh),
            textureCanvas: null,
            textureDataUrl: o.textureDataUrl || null,
            rig: o.rig ? JSON.parse(JSON.stringify(o.rig)) : null,
            animations: o.animations ? JSON.parse(JSON.stringify(o.animations)) : []
          };
          if (obj.textureDataUrl) {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement('canvas');
              c.width = img.width || 128; c.height = img.height || 128;
              c.getContext('2d').drawImage(img, 0, 0);
              obj.textureCanvas = c;
              this.viewport.syncScene();
            };
            img.src = obj.textureDataUrl;
          }
          return obj;
        });
        this.nextId = Math.max(this.nextId, this.state.objects.length + 10);
        this.state.selectedObjectId = this.state.objects.some(o => o.id === data.selectedObjectId)
          ? data.selectedObjectId : (this.state.objects[0]?.id || null);
        this.clearSubSelection(true);
        if (recordHistory) this.pushHistory('Load Scene');
        this.refreshAll();
      }

      pushHistory(label = 'Edit') {
        this.history.push(this.serializeScene(), label);
        this.updateUndoRedoButtons();
        this.scheduleAutosave();
      }

      stepAnimation(dt) {
        const obj = this.getSelectedObject();
        if (!obj || !obj.rig || !obj.animations || !obj.animations.length) {
          this.state.anim.playing = false;
          return;
        }
        const clip = obj.animations[this.state.anim.clipIndex] || obj.animations[0];
        let nextT = this.state.anim.time + dt * this.state.anim.speed;
        if (nextT >= clip.duration) {
          if (clip.loop) nextT = nextT % Math.max(0.05, clip.duration);
          else { nextT = clip.duration; this.state.anim.playing = false; }
        }
        this.state.anim.time = nextT;
        const pose = AnimEngine.sampleClip(clip, nextT);
        if (pose) {
          AnimEngine.applyPose(obj.rig.bones, pose);
          this.viewport.syncScene();
        }
        const scrub = document.getElementById('anim-scrubber');
        const tLabel = document.getElementById('anim-time-label');
        if (scrub) scrub.value = nextT.toFixed(2);
        if (tLabel) tLabel.textContent = `${nextT.toFixed(2)}s / ${clip.duration.toFixed(2)}s`;
      }

      commitGesture(kind) {
        const obj = this.getSelectedObject();
        if (kind === 'paint' && obj && obj.textureCanvas) {
          obj.textureDataUrl = obj.textureCanvas.toDataURL('image/png');
        }
        this.pushHistory(kind === 'sculpt' ? 'Sculpt' : kind === 'paint' ? 'Paint Texture' : 'Transform');
      }

      scheduleAutosave() {
        clearTimeout(this.autosaveTimer);
        const statusEl = document.getElementById('project-status');
        statusEl.textContent = 'Saving...';
        this.autosaveTimer = setTimeout(async () => {
          const ok = await StorageManager.saveProject(this.serializeScene());
          statusEl.textContent = ok ? 'Autosaved' : 'In Memory';
        }, 650);
      }

      toast(msg) {
        const wrap = document.getElementById('toast-wrap');
        const el = document.createElement('div');
        el.className = 'toast-pill';
        el.textContent = msg;
        wrap.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.2s'; }, 2000);
        setTimeout(() => el.remove(), 2250);
      }

      setMode(mode) {
        if (mode !== 'object' && !this.getSelectedObject()) {
          if (this.state.objects.length) this.state.selectedObjectId = this.state.objects[0].id;
          else { this.toast('Add an object first'); return; }
        }
        this.state.mode = mode;
        this.clearSubSelection(true);
        document.querySelectorAll('.seg-pill button[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        document.getElementById('transform-rail').classList.toggle('hidden', mode === 'sculpt' || mode === 'paint' || mode === 'rig');
        if (mode === 'rig') {
          const obj = this.getSelectedObject();
          if (obj && !obj.rig) this.autoRigSelected();
          this.toast('Drag coral Hand/Foot spheres for Puppet IK · Tap any joint for FK');
        }
        if (mode === 'sculpt') this.toast('Drag on mesh to sculpt · 2 fingers to orbit');
        else if (mode === 'paint') this.toast('Drag on mesh to paint · 2 fingers to orbit');
        this.refreshAll();
      }

      selectObject(id) { this.state.selectedObjectId = id; this.clearSubSelection(true); this.refreshAll(); }
      toggleVertexSelection(vi) { const i = this.state.selectedVerts.indexOf(vi); if (i >= 0) this.state.selectedVerts.splice(i, 1); else this.state.selectedVerts.push(vi); this.refreshAll(); }
      toggleEdgeSelection(k) { const i = this.state.selectedEdges.indexOf(k); if (i >= 0) this.state.selectedEdges.splice(i, 1); else this.state.selectedEdges.push(k); this.refreshAll(); }
      toggleFaceSelection(fi) { const i = this.state.selectedFaces.indexOf(fi); if (i >= 0) this.state.selectedFaces.splice(i, 1); else this.state.selectedFaces.push(fi); this.refreshAll(); }
      clearSubSelection(silent = false) { this.state.selectedVerts = []; this.state.selectedEdges = []; this.state.selectedFaces = []; if (!silent) this.refreshAll(); }

      // ---- Modelling & Environment Actions ----
      addPrimitive(type) {
        let mesh, name;
        const c = this.state.activeColor, m = this.state.activeMaterialId;
        if (type === 'box') { mesh = EditableMesh.createBox(1, 1, 1, c, m, 0, 0.5, 0); name = 'Low-Poly Box'; }
        else if (type === 'cylinder') { mesh = EditableMesh.createCylinder(0.45, 0.45, 1.2, 8, c, m, 0, 0.6, 0); name = 'Cylinder'; }
        else if (type === 'cone') { mesh = EditableMesh.createCone(0.6, 1.3, 7, c, m, 0, 0.65, 0); name = 'Cone Spire'; }
        else if (type === 'sphere') { mesh = EditableMesh.createLowPolySphere(0.6, 5, 8, c, m, 0, 0.6, 0); name = 'Clay Sphere'; }
        else if (type === 'roof') { mesh = EditableMesh.createRoofPrism(1.4, 0.9, 1.4, c, m); mesh.vertices.forEach(v => v.y += 0.45); name = 'Roof Prism'; }

        const offset = (this.state.objects.length % 4) * 0.45;
        const obj = this.createSceneObject(name, mesh, { x: offset, y: 0, z: 0 });
        this.state.objects.push(obj);
        this.state.selectedObjectId = obj.id;
        this.setMode('object');
        this.pushHistory(`Add ${name}`);
        this.viewport.focusSelected();
        this.toast(`Added ${name}`);
      }

      autoRigSelected() {
        const obj = this.getSelectedObject();
        if (!obj) { this.toast('Select a character mesh first'); return; }
        const bones = RigEngine.createHumanoidSkeleton(obj.mesh.getBounds());
        RigEngine.autoSkinMesh(obj.mesh, bones, 4.2);
        obj.rig = { bones, selectedBone: 4, showHeatmap: false };
        if (!obj.animations || !obj.animations.length) obj.animations = AnimEngine.createDefaultClips();
        this.pushHistory('Auto-Rig Character');
        this.refreshAll();
        this.toast(`Auto-rigged ${obj.name} (17 bones, normalized weights)`);
      }

      spawnCharacter() {
        const cb = this.state.charBuilder;
        const arch = CharacterWorkshop.archetypes[cb.archetype] || CharacterWorkshop.archetypes.sleuth;
        const { mesh, bones } = CharacterWorkshop.buildCharacter(cb);
        const offset = (this.state.objects.length % 3) * 1.15;
        const obj = this.createSceneObject(arch.name, mesh, { x: offset, y: 0, z: 0 });
        obj.flatShading = false; // Authentic PS2 smooth Gouraud shading!
        const texC = this.ensureObjectTexture(obj, 512);
        MaterialLib.renderPS2CharacterAtlas(texC, cb);
        obj.textureDataUrl = texC.toDataURL('image/png');
        obj.rig = { bones, selectedBone: 4, showHeatmap: false };
        if (!obj.animations || !obj.animations.length) obj.animations = AnimEngine.createDefaultClips();
        this.state.objects.push(obj);
        this.state.selectedObjectId = obj.id;
        this.setMode('rig');
        this.pushHistory(`Create ${arch.name}`);
        this.viewport.focusSelected();
        this.toast(`Created rigged ${arch.name} (${mesh.getTriangleCount()} tris, 17 bones)`);
      }

      spawnWorkshopAsset() {
        const w = this.state.workshop;
        const meta = DemoWorkshop.generators.find(g => g.id === w.type);
        const mesh = DemoWorkshop.build(w.type, w);
        const offset = w.type === 'room' ? 0 : ((this.state.objects.length % 4) - 1) * 0.9;
        const obj = this.createSceneObject(meta ? meta.name : 'Procedural Prop', mesh, { x: offset, y: 0, z: 0 });
        this.state.objects.push(obj);
        this.state.selectedObjectId = obj.id;
        this.setMode('object');
        this.pushHistory(`Spawn ${obj.name}`);
        this.viewport.focusSelected();
        this.toast(`Spawned editable ${obj.name}`);
      }

      scatterClutter() {
        const colors = [['#6d7570', 'mossy_stone'], ['#2f6d65', 'autumn_leaf'], ['#397d72', 'autumn_leaf'], ['#5c635f', 'mossy_stone']];
        for (let i = 0; i < 5; i++) {
          const ang = (i / 5) * Math.PI * 2 + Math.random() * 0.4;
          const dist = 2.0 + Math.random() * 1.8;
          const isRock = i % 2 === 0;
          const [c, m] = colors[i % colors.length];
          const mesh = EditableMesh.createLowPolySphere(isRock ? 0.34 : 0.48, 3, 6, c, m, 0, isRock ? 0.2 : 0.32, 0);
          mesh.applyDeform('squash', isRock ? 0.42 : 0.25);
          mesh.applyDeform('crooked', 0.45);
          const obj = this.createSceneObject(isRock ? `Mansion Rock ${i + 1}` : `Spooky Bush ${i + 1}`, mesh, {
            x: Math.cos(ang) * dist, y: 0, z: Math.sin(ang) * dist
          });
          this.state.objects.push(obj);
        }
        this.pushHistory('Scatter Clutter');
        this.refreshAll();
        this.toast('Scattered 5 editable rocks & bushes');
      }

      createGodotCollisionBox() {
        const obj = this.getSelectedObject();
        if (!obj) { this.toast('Select an object first'); return; }
        const b = obj.mesh.getBounds();
        const colMesh = EditableMesh.createBox(
          Math.max(0.2, b.size.x * obj.scale.x),
          Math.max(0.2, b.size.y * obj.scale.y),
          Math.max(0.2, b.size.z * obj.scale.z),
          '#5ce0b8', 'ghost_mint', 0, 0, 0
        );
        const colObj = this.createSceneObject(`${obj.name}-colonly`, colMesh, {
          x: obj.position.x + b.center.x * obj.scale.x,
          y: obj.position.y + b.center.y * obj.scale.y,
          z: obj.position.z + b.center.z * obj.scale.z
        });
        this.state.objects.push(colObj);
        this.state.selectedObjectId = colObj.id;
        this.pushHistory('Add Godot Collision');
        this.refreshAll();
        this.toast(`Created ${colObj.name} (auto-collision in Godot 4)`);
      }

      loadDemoAsset(which, replaceScene = false) {
        if (replaceScene) this.state.objects = [];
        if (which === 'bookshelf') {
          const obj = this.createSceneObject('Crooked Bookshelf', DemoWorkshop.buildCrookedBookshelf(), { x: replaceScene ? 0 : 1.9, y: 0, z: 0 });
          const sc = this.ensureObjectTexture(obj, 256);
          MaterialLib.renderPS2BookshelfAtlas(sc);
          obj.textureDataUrl = sc.toDataURL('image/png');
          this.state.objects.push(obj); this.state.selectedObjectId = obj.id;
        } else if (which === 'door') {
          const obj = this.createSceneObject('Spooky Mansion Door', DemoWorkshop.buildSpookyMansionDoor(), { x: replaceScene ? 0 : -1.9, y: 0, z: 0 });
          this.state.objects.push(obj); this.state.selectedObjectId = obj.id;
        } else if (which === 'tree') {
          const obj = this.createSceneObject('Stylized Spooky Tree', DemoWorkshop.buildStylizedTree(), { x: replaceScene ? 0 : 2.1, y: 0, z: -0.8 });
          this.state.objects.push(obj); this.state.selectedObjectId = obj.id;
        } else if (which === 'vignette') {
          this.state.objects = [
            this.createSceneObject('Spooky Mansion Door', DemoWorkshop.buildSpookyMansionDoor(), { x: 0, y: 0, z: -0.6 }),
            this.createSceneObject('Crooked Bookshelf', DemoWorkshop.buildCrookedBookshelf(), { x: -2.1, y: 0, z: 0.2 }),
            this.createSceneObject('Stylized Spooky Tree', DemoWorkshop.buildStylizedTree(), { x: 2.2, y: 0, z: 0.2 }),
          ];
          this.state.selectedObjectId = this.state.objects[0].id;
        }
        this.clearSubSelection(true);
        this.pushHistory(`Load ${which}`);
        this.refreshAll();
        this.viewport.focusSelected();
        if (!replaceScene) this.toast('Spawned editable demo asset');
      }

      runFaceOp(op) {
        const obj = this.getSelectedObject();
        if (!obj || !this.state.selectedFaces.length) { this.toast('Tap one or more faces first'); return; }
        if (op === 'extrude') { this.state.selectedFaces = obj.mesh.extrudeFaces(this.state.selectedFaces, 0.35); this.toast('Extruded faces (+0.35m)'); }
        else if (op === 'inset') { this.state.selectedFaces = obj.mesh.insetFaces(this.state.selectedFaces, 0.25); this.toast('Inset faces'); }
        else if (op === 'bevel') { this.state.selectedFaces = obj.mesh.bevelFaces(this.state.selectedFaces, 0.14); this.toast('Beveled faces'); }
        else if (op === 'subdivide') { this.state.selectedFaces = obj.mesh.subdivideFaces(this.state.selectedFaces); this.toast('Subdivided faces'); }
        else if (op === 'paint') {
          for (const fi of this.state.selectedFaces) { obj.mesh.faces[fi].color = this.state.activeColor; obj.mesh.faces[fi].materialId = this.state.activeMaterialId; }
          this.toast('Painted selected faces');
        } else if (op === 'delete') { obj.mesh.deleteFaces(this.state.selectedFaces); this.state.selectedFaces = []; this.toast('Deleted faces'); }
        this.pushHistory(`Face ${op}`);
        this.refreshAll();
      }

      runVertexOp(op) {
        const obj = this.getSelectedObject();
        if (!obj || !this.state.selectedVerts.length) { this.toast('Tap vertices first'); return; }
        if (op === 'weld') {
          if (this.state.selectedVerts.length < 2) { this.toast('Select at least 2 vertices to weld'); return; }
          obj.mesh.weldVertices(this.state.selectedVerts, 0); this.state.selectedVerts = []; this.toast('Welded vertices');
        } else if (op === 'delete') { obj.mesh.deleteVertices(this.state.selectedVerts); this.state.selectedVerts = []; this.toast('Deleted vertices'); }
        this.pushHistory(`Vertex ${op}`);
        this.refreshAll();
      }

      runEdgeOp(op) {
        const obj = this.getSelectedObject();
        if (!obj || !this.state.selectedEdges.length) { this.toast('Tap edges first'); return; }
        if (op === 'subdivide') {
          const edges = obj.mesh.getEdges().filter(e => this.state.selectedEdges.includes(e.key));
          obj.mesh.subdivideFaces([...new Set(edges.flatMap(e => e.faces))]);
          this.state.selectedEdges = [];
          this.toast('Subdivided along edges');
          this.pushHistory('Edge Subdivide');
          this.refreshAll();
        }
      }

      runObjectOp(op) {
        const obj = this.getSelectedObject();
        if (!obj) { this.toast('Select an object first'); return; }
        if (op === 'duplicate') {
          const copy = this.createSceneObject(obj.name + ' Copy', obj.mesh.clone(), { x: obj.position.x + 0.8, y: obj.position.y, z: obj.position.z });
          copy.rotation = { ...obj.rotation }; copy.scale = { ...obj.scale }; copy.flatShading = obj.flatShading;
          if (obj.textureCanvas) {
            const c = document.createElement('canvas'); c.width = obj.textureCanvas.width; c.height = obj.textureCanvas.height;
            c.getContext('2d').drawImage(obj.textureCanvas, 0, 0); copy.textureCanvas = c; copy.textureDataUrl = c.toDataURL('image/png');
          }
          this.state.objects.push(copy); this.state.selectedObjectId = copy.id; this.toast('Duplicated object');
        } else if (op === 'mirror') { obj.mesh.mirrorX(true); this.toast('Mirrored across X axis'); }
        else if (op === 'shading') { obj.flatShading = !obj.flatShading; this.toast(obj.flatShading ? 'Flat PS2 shading' : 'Smooth shading'); }
        else if (op === 'normals') { obj.mesh.recalculateNormals(); this.toast('Recalculated outward normals'); }
        else if (op === 'origin_bottom') {
          const b = obj.mesh.getBounds();
          const dx = b.center.x, dy = b.min.y, dz = b.center.z;
          for (const v of obj.mesh.vertices) { v.x -= dx; v.y -= dy; v.z -= dz; }
          obj.position.x += dx; obj.position.y = 0; obj.position.z += dz;
          this.toast('Grounded & centered origin (Godot ready)');
        } else if (op === 'crooked_quick') { obj.mesh.applyDeform('crooked', 0.25); this.toast('Added whimsical crookedness!'); }
        else if (op === 'delete') {
          this.state.objects = this.state.objects.filter(o => o.id !== obj.id);
          this.state.selectedObjectId = this.state.objects[0]?.id || null;
          this.toast('Deleted object');
        }
        this.pushHistory(`Object ${op}`);
        this.refreshAll();
      }

      mergeAllVisible() {
        const vis = this.state.objects.filter(o => o.visible);
        if (vis.length < 2) { this.toast('Need at least 2 visible objects to merge'); return; }
        const combined = new EditableMesh();
        for (const o of vis) {
          const cloned = o.mesh.clone();
          const mat = new THREE.Matrix4().compose(
            new THREE.Vector3(o.position.x, o.position.y, o.position.z),
            new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rotation.x, o.rotation.y, o.rotation.z)),
            new THREE.Vector3(o.scale.x, o.scale.y, o.scale.z)
          );
          for (const v of cloned.vertices) {
            const tv = new THREE.Vector3(v.x, v.y, v.z).applyMatrix4(mat);
            v.x = tv.x; v.y = tv.y; v.z = tv.z;
          }
          combined.mergeWith(cloned);
        }
        const mergedObj = this.createSceneObject('Merged Asset', combined);
        this.state.objects = this.state.objects.filter(o => !o.visible);
        this.state.objects.push(mergedObj);
        this.state.selectedObjectId = mergedObj.id;
        this.pushHistory('Merge Visible');
        this.refreshAll();
        this.toast('Merged visible objects into 1 mesh');
      }

      // ---- Phase 2: Silhouette & Stroke 2D Overlay ----
      openDrawOverlay(kind = 'silhouette') {
        this.closeSheet();
        this.state.draw.active = true;
        this.state.draw.kind = kind;
        this.state.draw.points = [];
        document.getElementById('draw-overlay-wrap').classList.remove('hidden');
        this.updateDrawOverlayUI();
        this.resizeDrawCanvas();
      }

      closeDrawOverlay() {
        this.state.draw.active = false;
        this.state.draw.points = [];
        document.getElementById('draw-overlay-wrap').classList.add('hidden');
      }

      resizeDrawCanvas() {
        const c = document.getElementById('draw-overlay-canvas');
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        this.redrawOverlayPath();
      }

      updateDrawOverlayUI() {
        const isSil = this.state.draw.kind === 'silhouette';
        document.getElementById('draw-kind-silhouette').classList.toggle('active', isSil);
        document.getElementById('draw-kind-stroke').classList.toggle('active', !isSil);
        document.getElementById('draw-hint').textContent = isSil ? 'Draw a closed silhouette with your finger' : 'Draw a branch, pipe, or vine path';
        const p1 = document.getElementById('draw-param1');
        document.getElementById('draw-param1-label').textContent = isSil ? 'Depth' : 'Radius';
        p1.min = isSil ? '0.1' : '0.05'; p1.max = isSil ? '1.4' : '0.45'; p1.step = isSil ? '0.05' : '0.02';
        p1.value = isSil ? this.state.draw.depth : this.state.draw.radius;
        document.getElementById('draw-param1-val').textContent = parseFloat(p1.value).toFixed(2);
        document.getElementById('draw-style-toggle').textContent = isSil
          ? (this.state.draw.styleFlag ? 'Pillow 3D' : 'Flat Extrude')
          : (this.state.draw.styleFlag ? 'Tapered Tip' : 'Even Tube');
      }

      redrawOverlayPath() {
        const c = document.getElementById('draw-overlay-canvas');
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        const pts = this.state.draw.points;
        if (pts.length < 2) return;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        if (this.state.draw.kind === 'silhouette') {
          ctx.closePath();
          ctx.fillStyle = 'rgba(245, 166, 35, 0.22)';
          ctx.fill();
        }
        ctx.strokeStyle = this.state.draw.kind === 'silhouette' ? '#f5a623' : '#38d9c0';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }

      bindDrawOverlay() {
        const c = document.getElementById('draw-overlay-canvas');
        let drawing = false;
        c.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          drawing = true;
          this.state.draw.points = [{ x: e.clientX, y: e.clientY }];
          this.redrawOverlayPath();
        }, { passive: false });
        c.addEventListener('pointermove', (e) => {
          if (!drawing) return;
          e.preventDefault();
          const pts = this.state.draw.points;
          const last = pts[pts.length - 1];
          if (!last || Math.hypot(e.clientX - last.x, e.clientY - last.y) > 6) {
            pts.push({ x: e.clientX, y: e.clientY });
            this.redrawOverlayPath();
          }
        }, { passive: false });
        const stop = () => { drawing = false; };
        c.addEventListener('pointerup', stop);
        c.addEventListener('pointercancel', stop);

        document.getElementById('draw-kind-silhouette').addEventListener('click', () => { this.state.draw.kind = 'silhouette'; this.state.draw.points = []; this.updateDrawOverlayUI(); this.redrawOverlayPath(); });
        document.getElementById('draw-kind-stroke').addEventListener('click', () => { this.state.draw.kind = 'stroke'; this.state.draw.points = []; this.updateDrawOverlayUI(); this.redrawOverlayPath(); });
        document.getElementById('draw-param1').addEventListener('input', (e) => {
          const v = parseFloat(e.target.value);
          if (this.state.draw.kind === 'silhouette') this.state.draw.depth = v;
          else this.state.draw.radius = v;
          document.getElementById('draw-param1-val').textContent = v.toFixed(2);
        });
        document.getElementById('draw-style-toggle').addEventListener('click', () => {
          this.state.draw.styleFlag = !this.state.draw.styleFlag;
          this.updateDrawOverlayUI();
        });
        document.getElementById('btn-draw-clear').addEventListener('click', () => { this.state.draw.points = []; this.redrawOverlayPath(); });
        document.getElementById('btn-draw-cancel').addEventListener('click', () => this.closeDrawOverlay());
        document.getElementById('btn-draw-build').addEventListener('click', () => {
          const pts = this.state.draw.points;
          if (pts.length < 3) { this.toast('Draw a shape or stroke on the canvas first'); return; }
          const scale = 3.2 / Math.min(window.innerWidth, window.innerHeight);
          const norm2D = pts.map(p => ({ x: (p.x - window.innerWidth * 0.5) * scale, y: -(p.y - window.innerHeight * 0.5) * scale }));
          const mesh = this.state.draw.kind === 'silhouette'
            ? DrawGeometry.buildSilhouetteMesh(norm2D, this.state.draw.depth, this.state.draw.styleFlag, this.state.activeColor, this.state.activeMaterialId)
            : DrawGeometry.buildStrokeMesh(norm2D, this.state.draw.radius, this.state.draw.styleFlag, 6, this.state.activeColor, this.state.activeMaterialId);
          if (!mesh) { this.toast('Shape too small—try a larger stroke'); return; }
          const label = this.state.draw.kind === 'silhouette' ? 'Drawn Silhouette' : 'Drawn Stroke';
          const obj = this.createSceneObject(label, mesh, { x: 0, y: 0, z: 0 });
          this.state.objects.push(obj);
          this.state.selectedObjectId = obj.id;
          this.closeDrawOverlay();
          this.setMode('object');
          this.pushHistory(`Create ${label}`);
          this.viewport.focusSelected();
          this.toast(`Created editable ${label} (${mesh.getTriangleCount()} tris)`);
        });
        window.addEventListener('resize', () => { if (this.state.draw.active) this.resizeDrawCanvas(); });
      }

      // ---- Built-In 2D Texture Pad Modal ----
      openTexturePad() {
        const obj = this.getSelectedObject();
        if (!obj) { this.toast('Select an object first'); return; }
        this.ensureObjectTexture(obj);
        this.texPadState = { tool: 'brush', size: 10, showUV: true, dirty: false };
        document.getElementById('tex-pad-sub').textContent = `${obj.name} · ${obj.textureCanvas.width}×${obj.textureCanvas.height}px`;
        document.getElementById('tp-color').value = this.state.activeColor;
        document.getElementById('tex-pad-modal').classList.remove('hidden');
        this.syncTexPadCanvases();
        this.renderTexPadSwatches();
        lucide.createIcons();
      }

      syncTexPadCanvases() {
        const obj = this.getSelectedObject();
        if (!obj || !obj.textureCanvas) return;
        const c = document.getElementById('tex-pad-canvas');
        c.width = obj.textureCanvas.width;
        c.height = obj.textureCanvas.height;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.drawImage(obj.textureCanvas, 0, 0);

        const uvC = document.getElementById('tex-pad-uv');
        uvC.width = 512; uvC.height = 512;
        const uctx = uvC.getContext('2d');
        uctx.clearRect(0, 0, 512, 512);
        if (this.texPadState && this.texPadState.showUV) {
          uctx.strokeStyle = 'rgba(56, 217, 192, 0.72)';
          uctx.lineWidth = 1;
          const { min, size } = obj.mesh.getBounds();
          const sx = Math.max(size.x, 0.01), sy = Math.max(size.y, 0.01), sz = Math.max(size.z, 0.01);
          for (let fi = 0; fi < obj.mesh.faces.length; fi++) {
            const f = obj.mesh.faces[fi];
            if (f.verts.length < 3) continue;
            const fn = obj.mesh.computeFaceNormal(fi);
            const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);
            uctx.beginPath();
            for (let ci = 0; ci < f.verts.length; ci++) {
              let u, vv;
              if (f.uvs && f.uvs[ci]) { u = f.uvs[ci][0]; vv = f.uvs[ci][1]; }
              else {
                const v = obj.mesh.vertices[f.verts[ci]];
                if (ay >= ax && ay >= az) { u = (v.x - min.x) / sx; vv = (v.z - min.z) / sz; }
                else if (ax >= ay && ax >= az) { u = (v.z - min.z) / sz; vv = (v.y - min.y) / sy; }
                else { u = (v.x - min.x) / sx; vv = (v.y - min.y) / sy; }
              }
              const px = u * 512, py = (1 - vv) * 512;
              if (ci === 0) uctx.moveTo(px, py); else uctx.lineTo(px, py);
            }
            uctx.closePath();
            uctx.stroke();
          }
        }
      }

      renderTexPadSwatches() {
        const wrap = document.getElementById('tp-swatches');
        wrap.innerHTML = '';
        for (const p of MaterialLib.presets) {
          const b = document.createElement('button');
          b.className = `swatch-btn !w-7 !h-7 ${this.state.activeColor === p.color ? 'active' : ''}`;
          b.style.background = p.color;
          b.addEventListener('click', () => {
            this.state.activeColor = p.color;
            document.getElementById('tp-color').value = p.color;
            this.renderTexPadSwatches();
          });
          wrap.appendChild(b);
        }
      }

      bindTexturePad() {
        const canvas = document.getElementById('tex-pad-canvas');
        let painting = false, lastPt = null;
        const paintAt = (clientX, clientY) => {
          const obj = this.getSelectedObject();
          if (!obj || !obj.textureCanvas) return;
          const rect = canvas.getBoundingClientRect();
          const x = ((clientX - rect.left) / rect.width) * obj.textureCanvas.width;
          const y = ((clientY - rect.top) / rect.height) * obj.textureCanvas.height;
          const ctx = obj.textureCanvas.getContext('2d');
          const st = this.texPadState;

          if (st.tool === 'pick') {
            const d = ctx.getImageData(Math.max(0, Math.min(obj.textureCanvas.width - 1, Math.floor(x))), Math.max(0, Math.min(obj.textureCanvas.height - 1, Math.floor(y))), 1, 1).data;
            this.state.activeColor = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
            document.getElementById('tp-color').value = this.state.activeColor;
            st.tool = 'brush';
            setToolUI('brush');
            this.renderTexPadSwatches();
            return;
          }

          const radius = (st.size / 100) * obj.textureCanvas.width * 0.22;
          ctx.save();
          ctx.strokeStyle = st.tool === 'eraser' ? (obj.mesh.faces[0]?.color || '#f2c49b') : this.state.activeColor;
          ctx.fillStyle = ctx.strokeStyle;
          ctx.lineWidth = Math.max(1.5, radius * 2);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (lastPt) {
            ctx.beginPath(); ctx.moveTo(lastPt.x, lastPt.y); ctx.lineTo(x, y); ctx.stroke();
          } else {
            ctx.beginPath(); ctx.arc(x, y, Math.max(1, radius), 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
          lastPt = { x, y };
          st.dirty = true;
          const viewCtx = canvas.getContext('2d');
          viewCtx.clearRect(0, 0, canvas.width, canvas.height);
          viewCtx.drawImage(obj.textureCanvas, 0, 0);
          const entry = this.viewport.meshEntries.get(obj.id);
          if (entry && entry.threeTex) entry.threeTex.needsUpdate = true;
        };

        canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); painting = true; lastPt = null; paintAt(e.clientX, e.clientY); }, { passive: false });
        canvas.addEventListener('pointermove', (e) => { if (!painting) return; e.preventDefault(); paintAt(e.clientX, e.clientY); }, { passive: false });
        const stop = () => { painting = false; lastPt = null; };
        canvas.addEventListener('pointerup', stop);
        canvas.addEventListener('pointercancel', stop);

        const setToolUI = (t) => {
          if (this.texPadState) this.texPadState.tool = t;
          ['brush', 'eraser', 'pick'].forEach(k => document.getElementById('tp-tool-' + k).classList.toggle('active', k === t));
        };
        document.getElementById('tp-tool-brush').addEventListener('click', () => setToolUI('brush'));
        document.getElementById('tp-tool-eraser').addEventListener('click', () => setToolUI('eraser'));
        document.getElementById('tp-tool-pick').addEventListener('click', () => setToolUI('pick'));
        document.getElementById('tp-color').addEventListener('input', (e) => { this.state.activeColor = e.target.value; this.renderTexPadSwatches(); });
        document.getElementById('tp-size').addEventListener('input', (e) => { if (this.texPadState) this.texPadState.size = +e.target.value; });
        document.getElementById('btn-tex-uv').addEventListener('click', (e) => {
          if (!this.texPadState) return;
          this.texPadState.showUV = !this.texPadState.showUV;
          e.currentTarget.classList.toggle('teal-active', this.texPadState.showUV);
          this.syncTexPadCanvases();
        });
        document.getElementById('btn-tex-done').addEventListener('click', () => {
          document.getElementById('tex-pad-modal').classList.add('hidden');
          const obj = this.getSelectedObject();
          if (obj && obj.textureCanvas && this.texPadState?.dirty) {
            obj.textureDataUrl = obj.textureCanvas.toDataURL('image/png');
            this.pushHistory('2D Texture Paint');
            this.refreshAll();
          }
        });
      }

      // ---- UI Refresh & Contextual Bar ----
      refreshAll() {
        this.viewport.syncScene();
        this.updateStats();
        this.updateContextBar();
        this.updateUndoRedoButtons();
        if (this.activeSheet) this.renderSheet(this.activeSheet);
        lucide.createIcons();
      }

      updateUndoRedoButtons() {
        document.getElementById('btn-undo').disabled = !this.history.canUndo();
        document.getElementById('btn-redo').disabled = !this.history.canRedo();
      }

      updateStats() {
        let tris = 0, faces = 0, verts = 0;
        for (const o of this.state.objects) {
          if (!o.visible) continue;
          tris += o.mesh.getTriangleCount(); faces += o.mesh.faces.length; verts += o.mesh.vertices.length;
        }
        document.getElementById('stat-poly').textContent = `${tris} Tris · ${faces} Faces · ${verts} Verts`;
        const selEl = document.getElementById('stat-sel');
        const obj = this.getSelectedObject();
        if (!obj) selEl.textContent = '';
        else if (this.state.mode === 'object') selEl.textContent = obj.name;
        else if (this.state.mode === 'sculpt') selEl.textContent = `Sculpt: ${this.state.sculpt.brush}`;
        else if (this.state.mode === 'paint') selEl.textContent = `Paint: ${this.state.paint.tool}`;
        else if (this.state.mode === 'rig') selEl.textContent = obj.rig ? `Bone: ${obj.rig.bones[obj.rig.selectedBone]?.name}` : 'No Rig';
        else if (this.state.mode === 'face') selEl.textContent = `${this.state.selectedFaces.length} face(s)`;
        else if (this.state.mode === 'edge') selEl.textContent = `${this.state.selectedEdges.length} edge(s)`;
        else selEl.textContent = `${this.state.selectedVerts.length} vert(s)`;
      }

      updateContextBar() {
        const bar = document.getElementById('context-bar');
        const obj = this.getSelectedObject();
        if (!obj || this.activeSheet) { bar.classList.add('hidden'); return; }
        bar.classList.remove('hidden');

        let btns = [];
        if (this.state.mode === 'object') {
          btns = [
            { label: 'Duplicate', icon: 'copy', fn: () => this.runObjectOp('duplicate') },
            { label: 'Mirror X', icon: 'flip-horizontal', fn: () => this.runObjectOp('mirror') },
            { label: 'Crooked!', icon: 'sparkles', fn: () => this.runObjectOp('crooked_quick') },
            { label: obj.flatShading ? 'Flat' : 'Smooth', icon: 'sun', fn: () => this.runObjectOp('shading') },
            { label: 'Ground Y=0', icon: 'anchor', fn: () => this.runObjectOp('origin_bottom') },
            { label: 'Delete', icon: 'trash-2', danger: true, fn: () => this.runObjectOp('delete') },
          ];
        } else if (this.state.mode === 'face') {
          btns = [
            { label: 'Extrude', icon: 'arrow-up-from-line', accent: true, fn: () => this.runFaceOp('extrude') },
            { label: 'Inset', icon: 'minimize-2', fn: () => this.runFaceOp('inset') },
            { label: 'Bevel', icon: 'octagon', fn: () => this.runFaceOp('bevel') },
            { label: 'Subdivide', icon: 'grid-2x2', fn: () => this.runFaceOp('subdivide') },
            { label: 'Paint', icon: 'paintbrush', fn: () => this.runFaceOp('paint') },
            { label: 'Delete', icon: 'trash-2', danger: true, fn: () => this.runFaceOp('delete') },
          ];
        } else if (this.state.mode === 'edge') {
          btns = [
            { label: 'Subdivide Edge', icon: 'split', accent: true, fn: () => this.runEdgeOp('subdivide') },
