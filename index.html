  <script>
    /* =========================================================================
     * POLYCRAFT STUDIO — PHASE 1 + PHASE 2 (ARTISTIC MODELLING)
     * Modules:
     *   1. MaterialLib        : Stylized PS2 palette & procedural texture synth
     *   2. EditableMesh       : Genuine B-Rep polygon mesh topology & deformers
     *   3. DrawGeometry       : 2D Silhouette (ear-clipping) & 3D Stroke tube
     *   4. ProceduralWorkshop : Customizable Mansion Generators + Environment
     *   5. HistoryManager     : Undo / Redo snapshot stack
     *   6. StorageManager     : IndexedDB autosave + JSON backups
     *   7. GodotGLB           : Binary GLB 2.0 exporter (with embedded PNG textures),
     *                           importer & Godot 4 validator
     *   8. ViewportEngine     : Three.js renderer, touch/pen gestures, Sculpt
     *                           brushes, Direct 3D Texture Paint & PS2 Preview
     *   9. StudioApp          : State, UI sheets, Draw overlay & wiring
     * ========================================================================= */

    // =========================================================================
    // 1. MATERIAL LIBRARY & PROCEDURAL STYLIZED TEXTURE GENERATOR
    // =========================================================================
    const MaterialLib = {
      presets: [
        { id: 'aged_wood',       name: 'Aged Oak',     color: '#6b442a', roughness: 0.85, metalness: 0.05 },
        { id: 'dark_timber',     name: 'Dark Timber',  color: '#42281c', roughness: 0.88, metalness: 0.05 },
        { id: 'mossy_stone',     name: 'Mossy Stone',  color: '#6d7570', roughness: 0.92, metalness: 0.04 },
        { id: 'mansion_plaster', name: 'Old Plaster',  color: '#cfc2a8', roughness: 0.90, metalness: 0.02 },
        { id: 'wrought_iron',    name: 'Wrought Iron', color: '#2e313b', roughness: 0.55, metalness: 0.65 },
        { id: 'tarnished_brass', name: 'Old Brass',    color: '#c9973e', roughness: 0.42, metalness: 0.72 },
        { id: 'velvet_plum',     name: 'Mystery Plum', color: '#6d315c', roughness: 0.86, metalness: 0.04 },
        { id: 'autumn_leaf',     name: 'Spooky Teal',  color: '#2f6d65', roughness: 0.84, metalness: 0.02 },
        { id: 'pumpkin',         name: 'Amber Glow',   color: '#d97828', roughness: 0.72, metalness: 0.05 },
        { id: 'book_crimson',    name: 'Tome Red',     color: '#9e2f38', roughness: 0.82, metalness: 0.04 },
        { id: 'book_cobalt',     name: 'Tome Blue',    color: '#34588a', roughness: 0.82, metalness: 0.04 },
        { id: 'ghost_mint',      name: 'Ecto Mint',    color: '#5ce0b8', roughness: 0.45, metalness: 0.05 },
      ],
      proceduralTypes: [
        { id: 'wood',    name: 'Wood Planks',  base: '#6b442a' },
        { id: 'stone',   name: 'Mossy Stone',  base: '#6b736e' },
        { id: 'bricks',  name: 'Old Bricks',   base: '#84463c' },
        { id: 'plaster', name: 'Aged Plaster', base: '#cfc2a8' },
        { id: 'fabric',  name: 'Velvet Cloth', base: '#6d315c' },
        { id: 'metal',   name: 'Wrought Iron', base: '#3d4250' },
        { id: 'dirt',    name: 'Mansion Dirt', base: '#574231' },
        { id: 'foliage', name: 'Spooky Leaves',base: '#2f6d65' },
      ],
      hexToRgb01(hex) {
        const clean = (hex || '#888888').replace('#', '');
        const n = parseInt(clean, 16);
        return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
      },
      renderProceduralTexture(canvas, type, baseColor = '#6b442a', wear = 0.45) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        const rng = (() => { let s = 1337; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();

        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, w, h);

        // Subtle painterly color variation mottling
        for (let i = 0; i < 90; i++) {
          ctx.fillStyle = rng() > 0.5 ? `rgba(255,244,215,${0.05 + wear * 0.08})` : `rgba(18,10,28,${0.07 + wear * 0.1})`;
          ctx.beginPath();
          ctx.ellipse(rng() * w, rng() * h, w * (0.04 + rng() * 0.12), h * (0.03 + rng() * 0.09), rng() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }

        if (type === 'wood') {
          const planks = 5;
          const ph = h / planks;
          for (let p = 0; p < planks; p++) {
            const y0 = p * ph;
            ctx.fillStyle = p % 2 ? 'rgba(0,0,0,0.08)' : 'rgba(255,235,200,0.06)';
            ctx.fillRect(0, y0, w, ph);
            // Wood grain strokes
            ctx.strokeStyle = 'rgba(28,14,6,0.28)';
            ctx.lineWidth = Math.max(1, w / 128);
            for (let g = 0; g < 6; g++) {
              ctx.beginPath();
              const gy = y0 + (g + 0.5) * (ph / 6);
              ctx.moveTo(0, gy);
              ctx.bezierCurveTo(w * 0.33, gy + (rng() - 0.5) * ph * 0.3, w * 0.66, gy + (rng() - 0.5) * ph * 0.3, w, gy);
              ctx.stroke();
            }
            // Plank seam + hand-painted edge highlight
            ctx.fillStyle = 'rgba(18,10,5,0.65)';
            ctx.fillRect(0, y0, w, Math.max(1.5, h * 0.015));
            ctx.fillStyle = `rgba(255,228,185,${0.12 + wear * 0.25})`;
            ctx.fillRect(0, y0 + Math.max(1.5, h * 0.015), w, Math.max(1, h * 0.012));
          }
        } else if (type === 'bricks' || type === 'stone') {
          const rows = type === 'bricks' ? 6 : 4;
          const cols = type === 'bricks' ? 4 : 3;
          const rh = h / rows, cw = w / cols;
          for (let r = 0; r < rows; r++) {
            const off = (r % 2) * cw * 0.5;
            for (let c = -1; c <= cols; c++) {
              const bx = c * cw + off;
              const by = r * rh;
              const shade = (rng() - 0.5) * 30;
              ctx.fillStyle = shade > 0 ? `rgba(255,245,220,${shade / 220})` : `rgba(15,12,24,${-shade / 170})`;
              ctx.fillRect(bx + 2, by + 2, cw - 4, rh - 4);
              // Stylized hand-painted top highlight
              ctx.fillStyle = `rgba(255,248,230,${0.1 + wear * 0.22})`;
              ctx.fillRect(bx + 2, by + 2, cw - 4, Math.max(1.5, rh * 0.08));
              // Mortar outline
              ctx.strokeStyle = 'rgba(20,18,28,0.68)';
              ctx.lineWidth = Math.max(1.5, w * 0.015);
              ctx.strokeRect(bx + 1, by + 1, cw - 2, rh - 2);
              if (type === 'stone' && rng() < 0.35 + wear * 0.3) {
                ctx.fillStyle = 'rgba(65,135,96,0.38)';
                ctx.beginPath();
                ctx.arc(bx + rng() * cw, by + rh * 0.85, cw * 0.18, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        } else if (type === 'plaster') {
          // Cracks & damp patches
          ctx.strokeStyle = `rgba(40,32,26,${0.25 + wear * 0.35})`;
          ctx.lineWidth = Math.max(1, w / 160);
          for (let i = 0; i < 7; i++) {
            let cx = rng() * w, cy = rng() * h;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            for (let s = 0; s < 5; s++) {
              cx += (rng() - 0.5) * w * 0.18;
              cy += (rng() - 0.5) * h * 0.18;
              ctx.lineTo(cx, cy);
            }
            ctx.stroke();
          }
        } else if (type === 'fabric') {
          ctx.strokeStyle = 'rgba(255,220,245,0.12)';
          ctx.lineWidth = Math.max(1, w / 96);
          const step = Math.max(4, w / 22);
          for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
          for (let y = 0; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
        } else if (type === 'metal') {
          // Brushed streaks + rivets + edge wear
          for (let i = 0; i < 65; i++) {
            ctx.strokeStyle = rng() > 0.5 ? `rgba(215,230,255,${0.08 + wear * 0.16})` : 'rgba(10,12,20,0.22)';
            ctx.lineWidth = Math.max(1, w / 140);
            const y = rng() * h;
            ctx.beginPath(); ctx.moveTo(rng() * w * 0.3, y); ctx.lineTo(w * (0.5 + rng() * 0.5), y + (rng() - 0.5) * 4); ctx.stroke();
          }
          ctx.strokeStyle = `rgba(255,240,210,${0.15 + wear * 0.3})`;
          ctx.lineWidth = Math.max(2, w * 0.025);
          ctx.strokeRect(2, 2, w - 4, h - 4);
        } else if (type === 'dirt' || type === 'foliage') {
          const count = type === 'foliage' ? 110 : 140;
          for (let i = 0; i < count; i++) {
            ctx.fillStyle = type === 'foliage'
              ? (rng() > 0.45 ? 'rgba(92,205,172,0.32)' : 'rgba(20,56,52,0.42)')
              : (rng() > 0.5 ? 'rgba(145,115,82,0.28)' : 'rgba(38,26,18,0.35)');
            ctx.beginPath();
            ctx.ellipse(rng() * w, rng() * h, w * (0.03 + rng() * 0.06), h * (0.02 + rng() * 0.045), rng() * Math.PI, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      },

      // Genuine Early-2000s PS2 Hand-Painted Character Texture Atlas (512x512)
      // Quadrants (Canvas Y-down -> UV Y-up):
      //   Top-Left    (x:0..256,   y:0..256)   => UV u:0..0.5,   v:0.5..1.0 : FACE & SKIN
      //   Top-Right   (x:256..512, y:0..256)   => UV u:0.5..1.0, v:0.5..1.0 : HAIR LOCKS
      //   Bottom-Left (x:0..256,   y:256..512) => UV u:0..0.5,   v:0..0.5   : SHIRT / JACKET
      //   Bottom-Right(x:256..512, y:256..512) => UV u:0.5..1.0, v:0..0.5   : PANTS & SHOES
      renderPS2CharacterAtlas(canvas, params) {
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height, hw = W / 2, hh = H / 2;
        const skin = params.skin || '#f2c49b';
        const shirt = params.shirt || '#3f8a5e';
        const pants = params.pants || '#6b3e2e';
        const hair = params.hairCol || '#7a4924';
        const expr = params.expr || 'smirk';

        // === Q1: FACE & SKIN (Top-Left) ===
        const skinGrad = ctx.createLinearGradient(0, 0, 0, hh);
        skinGrad.addColorStop(0, skin);
        skinGrad.addColorStop(0.75, skin);
        skinGrad.addColorStop(1, '#c48b66'); // warm chin/neck AO gradient
        ctx.fillStyle = skinGrad;
        ctx.fillRect(0, 0, hw, hh);

        // Soft painterly cheek blush + warm forehead highlight
        ctx.fillStyle = 'rgba(255, 245, 225, 0.28)';
        ctx.beginPath(); ctx.ellipse(hw * 0.5, hh * 0.24, hw * 0.26, hh * 0.12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(225, 105, 95, 0.24)';
        ctx.beginPath(); ctx.ellipse(hw * 0.30, hh * 0.59, hw * 0.085, hh * 0.05, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hw * 0.70, hh * 0.59, hw * 0.085, hh * 0.05, 0, 0, Math.PI * 2); ctx.fill();

        // Big Expressive Early-2000s Cartoon Eyes (centered around u=0.25 -> x=hw*0.5)
        const drawEye = (ex, ey, side) => {
          const rx = hw * (expr === 'spooked' ? 0.085 : 0.072);
          const ry = hh * (expr === 'spooked' ? 0.115 : expr === 'suspicious' ? 0.062 : 0.095);
          // Soft socket shadow
          ctx.fillStyle = 'rgba(95, 52, 48, 0.22)';
          ctx.beginPath(); ctx.ellipse(ex, ey + 3, rx * 1.25, ry * 1.2, 0, 0, Math.PI * 2); ctx.fill();
          // Sclera white
          ctx.fillStyle = '#fcfaf2';
          ctx.strokeStyle = '#24181e';
          ctx.lineWidth = Math.max(2.5, W * 0.007);
          ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          // Iris & Pupil
          const pOff = expr === 'suspicious' ? side * 3 : 0;
          ctx.fillStyle = '#3b241c';
          ctx.beginPath(); ctx.ellipse(ex + pOff, ey + 1, rx * (expr === 'spooked' ? 0.32 : 0.46), ry * (expr === 'spooked' ? 0.32 : 0.52), 0, 0, Math.PI * 2); ctx.fill();
          // Shiny cartoon catchlight
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(ex + pOff - rx * 0.18, ey - ry * 0.22, rx * 0.2, 0, Math.PI * 2); ctx.fill();
          // Upper eyelid crease
          ctx.strokeStyle = '#24181e';
          ctx.lineWidth = Math.max(3.5, W * 0.009);
          ctx.beginPath(); ctx.arc(ex, ey + ry * 0.1, rx * 1.05, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();

          // Expressive Cartoon Eyebrows
          ctx.strokeStyle = hair;
          ctx.lineWidth = Math.max(5, W * 0.014);
          ctx.lineCap = 'round';
          ctx.beginPath();
          if (expr === 'spooked') {
            ctx.moveTo(ex - rx, ey - ry * 1.45);
            ctx.quadraticCurveTo(ex, ey - ry * 2.05, ex + rx, ey - ry * 1.45);
          } else if (expr === 'suspicious') {
            ctx.moveTo(ex - rx, ey - ry * (side < 0 ? 1.55 : 1.05));
            ctx.lineTo(ex + rx, ey - ry * (side < 0 ? 1.05 : 1.55));
          } else {
            ctx.moveTo(ex - rx * 0.95, ey - ry * 1.25);
            ctx.quadraticCurveTo(ex, ey - ry * 1.65, ex + rx * 0.95, ey - ry * 1.25);
          }
          ctx.stroke();
        };
        drawEye(hw * 0.37, hh * 0.46, -1);
        drawEye(hw * 0.63, hh * 0.46,  1);

        // Cartoon Mouth
        ctx.strokeStyle = '#381c1e';
        ctx.lineWidth = Math.max(3.5, W * 0.0085);
        ctx.lineCap = 'round';
        if (expr === 'spooked') {
          ctx.fillStyle = '#4a1b24';
          ctx.beginPath(); ctx.ellipse(hw * 0.5, hh * 0.72, hw * 0.075, hh * 0.095, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#e06c75';
          ctx.beginPath(); ctx.ellipse(hw * 0.5, hh * 0.77, hw * 0.045, hh * 0.032, 0, 0, Math.PI * 2); ctx.fill();
        } else if (expr === 'cheerful') {
          ctx.fillStyle = '#fcfaf2';
          ctx.beginPath();
          ctx.moveTo(hw * 0.37, hh * 0.68);
          ctx.quadraticCurveTo(hw * 0.5, hh * 0.83, hw * 0.63, hh * 0.68);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if (expr === 'suspicious') {
          ctx.beginPath();
          ctx.moveTo(hw * 0.41, hh * 0.72);
          ctx.quadraticCurveTo(hw * 0.52, hh * 0.69, hw * 0.61, hh * 0.73);
          ctx.stroke();
        } else {
          // Classic Scooby-Doo mystery smirk!
          ctx.beginPath();
          ctx.moveTo(hw * 0.38, hh * 0.70);
          ctx.quadraticCurveTo(hw * 0.52, hh * 0.79, hw * 0.64, hh * 0.67);
          ctx.stroke();
        }

        // Optional painted glasses rim on face texture when glasses selected
        if (params.acc === 'glasses') {
          ctx.strokeStyle = '#1b1824';
          ctx.lineWidth = Math.max(4, W * 0.01);
          ctx.strokeRect(hw * 0.26, hh * 0.35, hw * 0.21, hh * 0.21);
          ctx.strokeRect(hw * 0.53, hh * 0.35, hw * 0.21, hh * 0.21);
          ctx.beginPath(); ctx.moveTo(hw * 0.47, hh * 0.45); ctx.lineTo(hw * 0.53, hh * 0.45); ctx.stroke();
        }

        // === Q2: HAND-PAINTED HAIR (Top-Right) ===
        const hairGrad = ctx.createLinearGradient(hw, 0, hw, hh);
        hairGrad.addColorStop(0, '#ffe4b5');
        hairGrad.addColorStop(0.18, hair);
        hairGrad.addColorStop(1, '#26140d');
        ctx.fillStyle = hairGrad;
        ctx.fillRect(hw, 0, hw, hh);
        for (let i = 0; i < 28; i++) {
          const sx = hw + (i / 28) * hw;
          ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,235,195,0.22)' : 'rgba(20,10,15,0.32)';
          ctx.lineWidth = Math.max(3, W * 0.012);
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.quadraticCurveTo(sx + (i % 2 ? 10 : -10), hh * 0.5, sx, hh);
          ctx.stroke();
        }

        // === Q3: HAND-PAINTED OUTFIT / SHIRT (Bottom-Left) ===
        const shGrad = ctx.createLinearGradient(0, hh, 0, H);
        shGrad.addColorStop(0, shirt);
        shGrad.addColorStop(0.86, shirt);
        shGrad.addColorStop(1, 'rgba(28, 18, 32, 0.45)'); // soft hem shadow
        ctx.fillStyle = shGrad;
        ctx.fillRect(0, hh, hw, hh);
        // Painted shoulder highlight + stylized V-neck collar + fabric crease lines
        ctx.fillStyle = 'rgba(255, 245, 220, 0.16)';
        ctx.fillRect(0, hh, hw, hh * 0.14);
        ctx.strokeStyle = 'rgba(18, 12, 24, 0.35)';
        ctx.lineWidth = Math.max(3, W * 0.008);
        // Collar V
        ctx.fillStyle = params.outfit === 'varsity' ? '#f5a623' : 'rgba(20,12,24,0.28)';
        ctx.beginPath(); ctx.moveTo(hw * 0.34, hh); ctx.lineTo(hw * 0.5, hh + hh * 0.22); ctx.lineTo(hw * 0.66, hh); ctx.closePath(); ctx.fill(); ctx.stroke();
        // Shirt folds
        for (let f = 0; f < 4; f++) {
          ctx.beginPath();
          ctx.moveTo(hw * (0.18 + f * 0.2), hh + hh * 0.45);
          ctx.quadraticCurveTo(hw * (0.22 + f * 0.2), hh + hh * 0.7, hw * (0.16 + f * 0.2), H - 10);
          ctx.stroke();
        }
        if (params.outfit === 'trench') {
          // Painted buttons & belt
          ctx.fillStyle = '#241a18';
          ctx.fillRect(0, hh + hh * 0.64, hw, hh * 0.10);
          ctx.fillStyle = '#d4a043';
          ctx.fillRect(hw * 0.44, hh + hh * 0.63, hw * 0.12, hh * 0.12);
        }

        // === Q4: PANTS & CHUNKY SNEAKERS (Bottom-Right) ===
        const ptGrad = ctx.createLinearGradient(hw, hh, hw, H);
        ptGrad.addColorStop(0, '#1e1418'); // waist AO
        ptGrad.addColorStop(0.18, pants);
        ptGrad.addColorStop(0.70, pants);
        ptGrad.addColorStop(0.72, '#2a2d3a'); // sneaker upper
        ptGrad.addColorStop(0.90, '#2a2d3a');
        ptGrad.addColorStop(0.91, '#ebe4d5'); // chunky white rubber sole!
        ptGrad.addColorStop(1.0, '#c8bfa8');
        ctx.fillStyle = ptGrad;
        ctx.fillRect(hw, hh, hw, hh);
        // Denim seam + sneaker stripe
        ctx.strokeStyle = 'rgba(255,235,205,0.22)';
        ctx.lineWidth = Math.max(2.5, W * 0.007);
        ctx.beginPath(); ctx.moveTo(hw + hw * 0.5, hh + 12); ctx.lineTo(hw + hw * 0.5, hh + hh * 0.68); ctx.stroke();
        ctx.fillStyle = '#f5a623';
        ctx.fillRect(hw, hh + hh * 0.79, hw, hh * 0.06);
      },

      // Hand-Painted PS2 Bookshelf Atlas (Left half = Aged Oak Planks, Right half = Gold-Banded Book Spines)
      renderPS2BookshelfAtlas(canvas) {
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height, hw = W / 2;
        // Left half: Warm hand-painted oak wood planks
        const tmp = document.createElement('canvas');
        tmp.width = hw; tmp.height = H;
        this.renderProceduralTexture(tmp, 'wood', '#6e452a', 0.65);
        ctx.drawImage(tmp, 0, 0);
        // Right half: Vintage Mystery Book Spines with gold filigree bands
        const spineCols = ['#9e2f38', '#34588a', '#6d315c', '#2f6d65', '#c97a2b', '#523466'];
        const sh = H / spineCols.length;
        spineCols.forEach((col, i) => {
          const y0 = i * sh;
          ctx.fillStyle = col;
          ctx.fillRect(hw, y0, hw, sh);
          // Baked side shadow + warm spine highlight
          const g = ctx.createLinearGradient(hw, y0, W, y0);
          g.addColorStop(0, 'rgba(15,8,20,0.45)');
          g.addColorStop(0.35, 'rgba(255,245,215,0.2)');
          g.addColorStop(1, 'rgba(15,8,20,0.45)');
          ctx.fillStyle = g;
          ctx.fillRect(hw, y0, hw, sh);
          // Gold bands
          ctx.fillStyle = '#e0b152';
          ctx.fillRect(hw + 4, y0 + sh * 0.18, hw - 8, Math.max(2, sh * 0.09));
          ctx.fillRect(hw + 4, y0 + sh * 0.72, hw - 8, Math.max(2, sh * 0.09));
          ctx.strokeStyle = 'rgba(20,10,18,0.6)';
          ctx.strokeRect(hw + 1, y0 + 1, hw - 2, sh - 2);
        });
      }
    };

    // =========================================================================
    // 2. GEOMETRY CORE: GENUINE EDITABLE MESH (B-Rep Topology)
    // =========================================================================
    class EditableMesh {
      constructor(vertices = [], faces = [], skinJoints = null, skinWeights = null) {
        this.vertices = vertices.map(v => ({ x: +v.x, y: +v.y, z: +v.z }));
        this.faces = faces.map(f => ({
          verts: [...f.verts],
          color: f.color || '#6b442a',
          materialId: f.materialId || 'aged_wood',
          uvs: f.uvs ? f.uvs.map(u => [u[0], u[1]]) : null
        }));
        this.skinJoints = skinJoints ? skinJoints.map(j => [...j]) : null;
        this.skinWeights = skinWeights ? skinWeights.map(w => [...w]) : null;
      }

      clone() {
        return new EditableMesh(this.vertices, this.faces, this.skinJoints, this.skinWeights);
      }

      toJSON() {
        const out = {
          vertices: this.vertices.map(v => [+v.x.toFixed(5), +v.y.toFixed(5), +v.z.toFixed(5)]),
          faces: this.faces.map(f => (f.uvs ? { v: [...f.verts], c: f.color, m: f.materialId, u: f.uvs } : { v: [...f.verts], c: f.color, m: f.materialId }))
        };
        if (this.skinJoints && this.skinWeights) {
          out.sj = this.skinJoints;
          out.sw = this.skinWeights.map(w => w.map(x => +x.toFixed(4)));
        }
        return out;
      }

      static fromJSON(data) {
        const verts = (data.vertices || []).map(v =>
          Array.isArray(v) ? { x: v[0], y: v[1], z: v[2] } : { x: v.x, y: v.y, z: v.z }
        );
        const faces = (data.faces || []).map(f => ({
          verts: f.v || f.verts,
          color: f.c || f.color || '#6b442a',
          materialId: f.m || f.materialId || 'aged_wood',
          uvs: f.u || f.uvs || null
        }));
        return new EditableMesh(verts, faces, data.sj || null, data.sw || null);
      }

      getTriangleCount() {
        let tris = 0;
        for (const f of this.faces) if (f.verts.length >= 3) tris += f.verts.length - 2;
        return tris;
      }

      getEdges() {
        const map = new Map();
        for (let fi = 0; fi < this.faces.length; fi++) {
          const vs = this.faces[fi].verts;
          for (let i = 0; i < vs.length; i++) {
            const v0 = vs[i], v1 = vs[(i + 1) % vs.length];
            const a = Math.min(v0, v1), b = Math.max(v0, v1);
            const key = `${a}_${b}`;
            if (!map.has(key)) map.set(key, { a, b, key, faces: [] });
            map.get(key).faces.push(fi);
          }
        }
        return Array.from(map.values());
      }

      getVertexNeighbors() {
        const adj = this.vertices.map(() => new Set());
        for (const f of this.faces) {
          const vs = f.verts;
          for (let i = 0; i < vs.length; i++) {
            const a = vs[i], b = vs[(i + 1) % vs.length];
            if (adj[a] && adj[b]) { adj[a].add(b); adj[b].add(a); }
          }
        }
        return adj.map(s => Array.from(s));
      }

      computeFaceNormal(faceIdx) {
        const f = this.faces[faceIdx];
        if (!f || f.verts.length < 3) return new THREE.Vector3(0, 1, 0);
        let nx = 0, ny = 0, nz = 0;
        const n = f.verts.length;
        for (let i = 0; i < n; i++) {
          const c = this.vertices[f.verts[i]];
          const next = this.vertices[f.verts[(i + 1) % n]];
          if (!c || !next) continue;
          nx += (c.y - next.y) * (c.z + next.z);
          ny += (c.z - next.z) * (c.x + next.x);
          nz += (c.x - next.x) * (c.y + next.y);
        }
        const vec = new THREE.Vector3(nx, ny, nz);
        return vec.lengthSq() < 1e-10 ? new THREE.Vector3(0, 1, 0) : vec.normalize();
      }

      computeVertexNormals() {
        const normals = this.vertices.map(() => new THREE.Vector3());
        for (let fi = 0; fi < this.faces.length; fi++) {
          const fn = this.computeFaceNormal(fi);
          for (const vi of this.faces[fi].verts) {
            if (normals[vi]) normals[vi].add(fn);
          }
        }
        for (const sn of normals) {
          if (sn.lengthSq() > 1e-8) sn.normalize();
          else sn.set(0, 1, 0);
        }
        return normals;
      }

      computeFaceCenter(faceIdx) {
        const f = this.faces[faceIdx];
        const c = new THREE.Vector3();
        if (!f || !f.verts.length) return c;
        for (const vi of f.verts) {
          const v = this.vertices[vi];
          if (v) c.add(new THREE.Vector3(v.x, v.y, v.z));
        }
        return c.divideScalar(f.verts.length);
      }

      getBounds() {
        const min = new THREE.Vector3(Infinity, Infinity, Infinity);
        const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
        for (const v of this.vertices) {
          if (v.x < min.x) min.x = v.x;
          if (v.y < min.y) min.y = v.y;
          if (v.z < min.z) min.z = v.z;
          if (v.x > max.x) max.x = v.x;
          if (v.y > max.y) max.y = v.y;
          if (v.z > max.z) max.z = v.z;
        }
        if (!this.vertices.length) { min.set(0, 0, 0); max.set(0, 0, 0); }
        return { min, max, center: min.clone().add(max).multiplyScalar(0.5), size: max.clone().sub(min) };
      }

      // ---- Topology Operations ----
      extrudeFaces(faceIndices, distance = 0.35) {
        const valid = [...new Set(faceIndices)].filter(fi => fi >= 0 && fi < this.faces.length);
        if (!valid.length) return [];
        const avgNormal = new THREE.Vector3();
        for (const fi of valid) avgNormal.add(this.computeFaceNormal(fi));
        if (avgNormal.lengthSq() < 1e-8) avgNormal.set(0, 1, 0);
        else avgNormal.normalize();

        const edgeCount = new Map();
        const boundaryDirected = [];
        for (const fi of valid) {
          const vs = this.faces[fi].verts;
          for (let i = 0; i < vs.length; i++) {
            const a = vs[i], b = vs[(i + 1) % vs.length];
            const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
            edgeCount.set(key, (edgeCount.get(key) || 0) + 1);
          }
        }
        for (const fi of valid) {
          const vs = this.faces[fi].verts;
          const faceColor = this.faces[fi].color;
          const faceMat = this.faces[fi].materialId;
          for (let i = 0; i < vs.length; i++) {
            const a = vs[i], b = vs[(i + 1) % vs.length];
            const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
            if (edgeCount.get(key) === 1) boundaryDirected.push({ a, b, color: faceColor, materialId: faceMat });
          }
        }

        const oldToNew = new Map();
        for (const fi of valid) {
          for (const vi of this.faces[fi].verts) {
            if (!oldToNew.has(vi)) {
              const orig = this.vertices[vi];
              const newIdx = this.vertices.length;
              this.vertices.push({
                x: orig.x + avgNormal.x * distance,
                y: orig.y + avgNormal.y * distance,
                z: orig.z + avgNormal.z * distance
              });
              oldToNew.set(vi, newIdx);
            }
          }
        }
        for (const fi of valid) this.faces[fi].verts = this.faces[fi].verts.map(vi => oldToNew.get(vi));
        for (const edge of boundaryDirected) {
          this.faces.push({
            verts: [edge.a, edge.b, oldToNew.get(edge.b), oldToNew.get(edge.a)],
            color: edge.color,
            materialId: edge.materialId
          });
        }
        return valid;
      }

      insetFaces(faceIndices, factor = 0.25) {
        const valid = [...new Set(faceIndices)].filter(fi => fi >= 0 && fi < this.faces.length);
        if (!valid.length) return [];
        const t = Math.max(0.05, Math.min(0.85, factor));
        for (const fi of valid) {
          const f = this.faces[fi];
          const center = this.computeFaceCenter(fi);
          const origVerts = [...f.verts];
          const innerVerts = [];
          for (const vi of origVerts) {
            const v = this.vertices[vi];
            const idx = this.vertices.length;
            this.vertices.push({
              x: v.x + (center.x - v.x) * t,
              y: v.y + (center.y - v.y) * t,
              z: v.z + (center.z - v.z) * t
            });
            innerVerts.push(idx);
          }
          f.verts = innerVerts;
          for (let i = 0; i < origVerts.length; i++) {
            const next = (i + 1) % origVerts.length;
            this.faces.push({
              verts: [origVerts[i], origVerts[next], innerVerts[next], innerVerts[i]],
              color: f.color,
              materialId: f.materialId
            });
          }
        }
        return valid;
      }

      bevelFaces(faceIndices, amount = 0.14) {
        const valid = this.insetFaces(faceIndices, Math.min(0.45, Math.max(0.08, amount * 1.4)));
        for (const fi of valid) {
          const n = this.computeFaceNormal(fi);
          for (const vi of this.faces[fi].verts) {
            this.vertices[vi].x += n.x * amount * 0.55;
            this.vertices[vi].y += n.y * amount * 0.55;
            this.vertices[vi].z += n.z * amount * 0.55;
          }
        }
        return valid;
      }

      subdivideFaces(faceIndices) {
        const targets = faceIndices && faceIndices.length
          ? [...new Set(faceIndices)].filter(fi => fi >= 0 && fi < this.faces.length)
          : this.faces.map((_, i) => i);
        if (!targets.length) return [];
        const targetSet = new Set(targets);
        const edgeMidMap = new Map();
        const getEdgeMid = (a, b) => {
          const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
          if (edgeMidMap.has(key)) return edgeMidMap.get(key);
          const va = this.vertices[a], vb = this.vertices[b];
          const idx = this.vertices.length;
          this.vertices.push({ x: (va.x + vb.x) * 0.5, y: (va.y + vb.y) * 0.5, z: (va.z + vb.z) * 0.5 });
          edgeMidMap.set(key, idx);
          return idx;
        };
        const newFaces = [], newTargetIndices = [];
        for (let fi = 0; fi < this.faces.length; fi++) {
          const f = this.faces[fi];
          if (!targetSet.has(fi)) {
            const vs = f.verts, rebuilt = [];
            for (let i = 0; i < vs.length; i++) {
              const a = vs[i], b = vs[(i + 1) % vs.length];
              rebuilt.push(a);
              const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
              if (edgeMidMap.has(key)) rebuilt.push(edgeMidMap.get(key));
            }
            newFaces.push({ verts: rebuilt, color: f.color, materialId: f.materialId });
            continue;
          }
          const c = this.computeFaceCenter(fi);
          const cIdx = this.vertices.length;
          this.vertices.push({ x: c.x, y: c.y, z: c.z });
          const vs = f.verts;
          const mids = vs.map((v, i) => getEdgeMid(v, vs[(i + 1) % vs.length]));
          for (let i = 0; i < vs.length; i++) {
            const prevMid = mids[(i - 1 + vs.length) % vs.length];
            const currMid = mids[i];
            newTargetIndices.push(newFaces.length);
            newFaces.push({ verts: [vs[i], currMid, cIdx, prevMid], color: f.color, materialId: f.materialId });
          }
        }
        this.faces = newFaces;
        return newTargetIndices;
      }

      deleteFaces(faceIndices) {
        const delSet = new Set(faceIndices);
        this.faces = this.faces.filter((_, i) => !delSet.has(i));
        this.pruneUnusedVertices();
      }

      deleteVertices(vertIndices) {
        const delSet = new Set(vertIndices);
        this.faces = this.faces.filter(f => !f.verts.some(vi => delSet.has(vi)));
        this.pruneUnusedVertices();
      }

      weldVertices(vertIndices, threshold = 0.0) {
        if (threshold > 0) {
          const remap = this.vertices.map((_, i) => i);
          const th2 = threshold * threshold;
          for (let i = 0; i < this.vertices.length; i++) {
            if (remap[i] !== i) continue;
            const vi = this.vertices[i];
            for (let j = i + 1; j < this.vertices.length; j++) {
              if (remap[j] !== j) continue;
              const vj = this.vertices[j];
              const dx = vi.x - vj.x, dy = vi.y - vj.y, dz = vi.z - vj.z;
              if (dx * dx + dy * dy + dz * dz <= th2) remap[j] = i;
            }
          }
          this._remapAndClean(remap);
          return;
        }
        const unique = [...new Set(vertIndices)].filter(i => i >= 0 && i < this.vertices.length);
        if (unique.length < 2) return;
        let cx = 0, cy = 0, cz = 0;
        for (const vi of unique) { cx += this.vertices[vi].x; cy += this.vertices[vi].y; cz += this.vertices[vi].z; }
        cx /= unique.length; cy /= unique.length; cz /= unique.length;
        const target = unique[0];
        this.vertices[target] = { x: cx, y: cy, z: cz };
        const remap = this.vertices.map((_, i) => i);
        for (let k = 1; k < unique.length; k++) remap[unique[k]] = target;
        this._remapAndClean(remap);
      }

      _remapAndClean(remap) {
        const cleanedFaces = [];
        for (const f of this.faces) {
          const nv = [];
          for (const vi of f.verts) {
            const m = remap[vi];
            if (nv.length === 0 || nv[nv.length - 1] !== m) nv.push(m);
          }
          if (nv.length > 1 && nv[0] === nv[nv.length - 1]) nv.pop();
          if (nv.length >= 3 && new Set(nv).size >= 3) cleanedFaces.push({ verts: nv, color: f.color, materialId: f.materialId });
        }
        this.faces = cleanedFaces;
        this.pruneUnusedVertices();
      }

      pruneUnusedVertices() {
        const used = new Set();
        for (const f of this.faces) for (const vi of f.verts) used.add(vi);
        const newVerts = [], remap = new Map();
        for (let i = 0; i < this.vertices.length; i++) {
          if (used.has(i)) { remap.set(i, newVerts.length); newVerts.push(this.vertices[i]); }
        }
        this.vertices = newVerts;
        for (const f of this.faces) f.verts = f.verts.map(vi => remap.get(vi));
      }

      mirrorX(mergeWithOriginal = true) {
        const origVertCount = this.vertices.length;
        const origFaces = this.faces.map(f => ({ verts: [...f.verts], color: f.color, materialId: f.materialId }));
        if (!mergeWithOriginal) {
          for (const v of this.vertices) v.x = -v.x;
          for (const f of this.faces) f.verts.reverse();
          return;
        }
        for (let i = 0; i < origVertCount; i++) {
          const v = this.vertices[i];
          this.vertices.push({ x: -v.x, y: v.y, z: v.z });
        }
        for (const f of origFaces) {
          this.faces.push({ verts: f.verts.map(vi => vi + origVertCount).reverse(), color: f.color, materialId: f.materialId });
        }
        this.weldVertices([], 0.001);
      }

      recalculateNormals() {
        const { center } = this.getBounds();
        let dotSum = 0;
        for (let fi = 0; fi < this.faces.length; fi++) {
          const n = this.computeFaceNormal(fi);
          const fc = this.computeFaceCenter(fi).sub(center);
          dotSum += n.dot(fc);
        }
        if (dotSum < 0) for (const f of this.faces) f.verts.reverse();
      }

      mergeWith(otherMesh, offsetPos = { x: 0, y: 0, z: 0 }) {
        const base = this.vertices.length;
        for (const v of otherMesh.vertices) {
          this.vertices.push({ x: v.x + offsetPos.x, y: v.y + offsetPos.y, z: v.z + offsetPos.z });
        }
        for (const f of otherMesh.faces) {
          this.faces.push({ verts: f.verts.map(vi => vi + base), color: f.color, materialId: f.materialId, uvs: f.uvs ? f.uvs.map(u => [u[0], u[1]]) : null });
        }
      }

      // ---- Phase 2: Low-Poly Clay Sculpt Brush ----
      applySculptBrush(localPoint, localNormal, brushType = 'pull', radius = 0.55, strength = 0.09, symmetryX = false) {
        const r2 = radius * radius;
        const vNormals = brushType === 'inflate' ? this.computeVertexNormals() : null;
        const neighbors = brushType === 'smooth' ? this.getVertexNeighbors() : null;
        const origSnap = brushType === 'smooth' ? this.vertices.map(v => ({ ...v })) : null;

        const applyAt = (pt, norm) => {
          let touched = false;
          for (let i = 0; i < this.vertices.length; i++) {
            const v = this.vertices[i];
            const dx = v.x - pt.x, dy = v.y - pt.y, dz = v.z - pt.z;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 >= r2) continue;
            touched = true;
            const d = Math.sqrt(d2);
            const falloff = 0.5 * (1 + Math.cos(Math.PI * (d / radius)));
            const w = falloff * strength;

            if (brushType === 'pull') {
              v.x += norm.x * w; v.y += norm.y * w; v.z += norm.z * w;
            } else if (brushType === 'push') {
              v.x -= norm.x * w; v.y -= norm.y * w; v.z -= norm.z * w;
            } else if (brushType === 'inflate') {
              const vn = vNormals[i];
              v.x += vn.x * w; v.y += vn.y * w; v.z += vn.z * w;
            } else if (brushType === 'smooth') {
              const nbs = neighbors[i];
              if (nbs && nbs.length) {
                let ax = 0, ay = 0, az = 0;
                for (const ni of nbs) { ax += origSnap[ni].x; ay += origSnap[ni].y; az += origSnap[ni].z; }
                ax /= nbs.length; ay /= nbs.length; az /= nbs.length;
                const sw = Math.min(0.65, w * 2.8);
                v.x += (ax - v.x) * sw; v.y += (ay - v.y) * sw; v.z += (az - v.z) * sw;
              }
            } else if (brushType === 'flatten') {
              const planeDist = dx * norm.x + dy * norm.y + dz * norm.z;
              const fw = Math.min(0.85, w * 3.0);
              v.x -= norm.x * planeDist * fw;
              v.y -= norm.y * planeDist * fw;
              v.z -= norm.z * planeDist * fw;
            }
          }
          return touched;
        };

        let hit = applyAt(localPoint, localNormal);
        if (symmetryX && Math.abs(localPoint.x) > 0.02) {
          const symPt = new THREE.Vector3(-localPoint.x, localPoint.y, localPoint.z);
          const symNorm = new THREE.Vector3(-localNormal.x, localNormal.y, localNormal.z);
          hit = applyAt(symPt, symNorm) || hit;
        }
        return hit;
      }

      // ---- Artistic Shape Deformers ----
      applyDeform(type, amount) {
        if (Math.abs(amount) < 1e-4) return;
        const { min, center, size } = this.getBounds();
        const h = Math.max(size.y, 0.001);
        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          const ty = (v.y - min.y) / h;
          if (type === 'crooked') {
            const hash = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
            const jitter = (hash - Math.floor(hash) - 0.5) * 0.14 * amount;
            v.x += Math.pow(ty, 1.4) * amount * 0.48 + jitter;
            v.z += Math.sin(ty * Math.PI) * amount * 0.18 + jitter * 0.7;
            v.y += Math.sin((v.x - center.x) * 2.1) * amount * 0.08;
          } else if (type === 'taper') {
            const scale = Math.max(0.15, 1 + (ty - 0.5) * amount * 1.1);
            v.x = center.x + (v.x - center.x) * scale;
            v.z = center.z + (v.z - center.z) * scale;
          } else if (type === 'bend') {
            const angle = ty * amount * 0.9;
            const dx = v.x - center.x, dy = v.y - min.y;
            const cos = Math.cos(angle), sin = Math.sin(angle);
            v.x = center.x + dx * cos + dy * sin * 0.45;
            v.y = min.y + dy * cos - dx * sin * 0.25;
          } else if (type === 'twist') {
            const angle = (ty - 0.5) * amount * Math.PI * 0.85;
            const dx = v.x - center.x, dz = v.z - center.z;
            const cos = Math.cos(angle), sin = Math.sin(angle);
            v.x = center.x + dx * cos - dz * sin;
            v.z = center.z + dx * sin + dz * cos;
          } else if (type === 'bulge') {
            const bf = 1 + Math.sin(ty * Math.PI) * amount * 0.65;
            v.x = center.x + (v.x - center.x) * bf;
            v.z = center.z + (v.z - center.z) * bf;
          } else if (type === 'squash') {
            const sy = Math.max(0.25, 1 - amount * 0.45);
            const sxz = 1 / Math.sqrt(sy);
            v.y = min.y + (v.y - min.y) * sy;
            v.x = center.x + (v.x - center.x) * sxz;
            v.z = center.z + (v.z - center.z) * sxz;
          }
        }
      }

      // ---- Convert to Three.js BufferGeometry with Normalized Box UVs ----
      toThreeBufferGeometry(flatShading = true, selectedFaces = null, hasTexture = false, posedVerts = null, heatmapBoneIdx = -1) {
        const positions = [], normals = [], uvs = [], colors = [], faceMap = [];
        const srcVerts = posedVerts || this.vertices;
        const smoothNormals = flatShading ? null : this.computeVertexNormals();
        const selSet = selectedFaces ? new Set(selectedFaces) : null;
        const { min, size } = this.getBounds();
        const sx = Math.max(size.x, 0.01), sy = Math.max(size.y, 0.01), sz = Math.max(size.z, 0.01);

        for (let fi = 0; fi < this.faces.length; fi++) {
          const f = this.faces[fi];
          if (f.verts.length < 3) continue;
          // Recompute face normal from posed vertices when posed
          let fn;
          if (posedVerts) {
            const va = srcVerts[f.verts[0]], vb = srcVerts[f.verts[1]], vc = srcVerts[f.verts[2]];
            const e1 = new THREE.Vector3(vb.x - va.x, vb.y - va.y, vb.z - va.z);
            const e2 = new THREE.Vector3(vc.x - va.x, vc.y - va.y, vc.z - va.z);
            fn = e1.cross(e2);
            if (fn.lengthSq() < 1e-10) fn.set(0, 1, 0); else fn.normalize();
          } else {
            fn = this.computeFaceNormal(fi);
          }
          const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);

          let [br, bg, bb] = (hasTexture && heatmapBoneIdx < 0) ? [1, 1, 1] : MaterialLib.hexToRgb01(f.color || '#6b442a');
          if (selSet && selSet.has(fi)) {
            br = Math.min(1, br * 0.55 + 0.45);
            bg = Math.min(1, bg * 0.55 + 0.32);
            bb = Math.min(1, bb * 0.55 + 0.08);
          }

          for (let i = 1; i < f.verts.length - 1; i++) {
            const triIdx = [0, i, i + 1];
            for (const ci of triIdx) {
              const vi = f.verts[ci];
              const v = srcVerts[vi];
              const rv = this.vertices[vi];
              positions.push(v.x, v.y, v.z);
              const n = flatShading ? fn : smoothNormals[vi];
              normals.push(n.x, n.y, n.z);

              if (f.uvs && f.uvs[ci]) {
                uvs.push(f.uvs[ci][0], f.uvs[ci][1]);
              } else {
                let u = 0, vv = 0;
                if (ay >= ax && ay >= az) { u = (rv.x - min.x) / sx; vv = (rv.z - min.z) / sz; }
                else if (ax >= ay && ax >= az) { u = (rv.z - min.z) / sz; vv = (rv.y - min.y) / sy; }
                else { u = (rv.x - min.x) / sx; vv = (rv.y - min.y) / sy; }
                uvs.push(Math.max(0, Math.min(1, u)), Math.max(0, Math.min(1, vv)));
              }

              if (heatmapBoneIdx >= 0 && this.skinJoints && this.skinWeights && this.skinJoints[vi]) {
                let w = 0;
                const sj = this.skinJoints[vi], sw = this.skinWeights[vi];
                for (let k = 0; k < 4; k++) if (sj[k] === heatmapBoneIdx) w += sw[k];
                // Blue (0) -> Teal (0.5) -> Amber Gold (1.0)
                const r = Math.min(1, w * 1.4);
                const g = w < 0.5 ? 0.18 + w * 1.4 : 0.88 - (w - 0.5) * 0.35;
                const b = Math.max(0.1, 0.72 - w * 0.65);
                colors.push(r, g, b);
              } else {
                colors.push(br, bg, bb);
              }
            }
            faceMap.push(fi);
          }
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geom.userData.faceMap = faceMap;
        geom.computeBoundingSphere();
        geom.computeBoundingBox();
        return geom;
      }

      // ---- Primitive Generators ----
      static createBox(w = 1, h = 1, d = 1, color = '#6b442a', materialId = 'aged_wood', ox = 0, oy = 0, oz = 0) {
        const hw = w / 2, hh = h / 2, hd = d / 2;
        const verts = [
          { x: ox - hw, y: oy - hh, z: oz + hd }, { x: ox + hw, y: oy - hh, z: oz + hd },
          { x: ox + hw, y: oy + hh, z: oz + hd }, { x: ox - hw, y: oy + hh, z: oz + hd },
          { x: ox - hw, y: oy - hh, z: oz - hd }, { x: ox + hw, y: oy - hh, z: oz - hd },
          { x: ox + hw, y: oy + hh, z: oz - hd }, { x: ox - hw, y: oy + hh, z: oz - hd },
        ];
        const faces = [
          { verts: [0, 1, 2, 3], color, materialId }, { verts: [5, 4, 7, 6], color, materialId },
          { verts: [4, 0, 3, 7], color, materialId }, { verts: [1, 5, 6, 2], color, materialId },
          { verts: [3, 2, 6, 7], color, materialId }, { verts: [4, 5, 1, 0], color, materialId },
        ];
        return new EditableMesh(verts, faces);
      }

      static createCylinder(rTop = 0.5, rBot = 0.5, h = 1.2, segs = 8, color = '#6d7570', materialId = 'mossy_stone', ox = 0, oy = 0, oz = 0) {
        const verts = [], faces = [], hh = h / 2;
        for (let i = 0; i < segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          verts.push({ x: ox + Math.cos(a) * rBot, y: oy - hh, z: oz + Math.sin(a) * rBot });
        }
        for (let i = 0; i < segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          verts.push({ x: ox + Math.cos(a) * rTop, y: oy + hh, z: oz + Math.sin(a) * rTop });
        }
        for (let i = 0; i < segs; i++) {
          const n = (i + 1) % segs;
          faces.push({ verts: [i, n, segs + n, segs + i], color, materialId });
        }
        const botCap = [], topCap = [];
        for (let i = 0; i < segs; i++) { botCap.push(segs - 1 - i); topCap.push(segs + i); }
        if (rBot > 0.001) faces.push({ verts: botCap, color, materialId });
        if (rTop > 0.001) faces.push({ verts: topCap, color, materialId });
        return new EditableMesh(verts, faces);
      }

      static createCone(r = 0.65, h = 1.4, segs = 7, color = '#2f6d65', materialId = 'autumn_leaf', ox = 0, oy = 0, oz = 0) {
        const verts = [], faces = [], hh = h / 2;
        for (let i = 0; i < segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          verts.push({ x: ox + Math.cos(a) * r, y: oy - hh, z: oz + Math.sin(a) * r });
        }
        const apex = verts.length;
        verts.push({ x: ox, y: oy + hh, z: oz });
        for (let i = 0; i < segs; i++) faces.push({ verts: [i, (i + 1) % segs, apex], color, materialId });
        const bot = [];
        for (let i = segs - 1; i >= 0; i--) bot.push(i);
        faces.push({ verts: bot, color, materialId });
        return new EditableMesh(verts, faces);
      }

      static createLowPolySphere(r = 0.65, rings = 5, segs = 8, color = '#d97828', materialId = 'pumpkin', ox = 0, oy = 0, oz = 0) {
        const verts = [], faces = [];
        verts.push({ x: ox, y: oy + r, z: oz });
        for (let y = 1; y < rings; y++) {
          const phi = (y / rings) * Math.PI;
          const ry = Math.cos(phi) * r, rr = Math.sin(phi) * r;
          for (let x = 0; x < segs; x++) {
            const theta = (x / segs) * Math.PI * 2;
            verts.push({ x: ox + Math.cos(theta) * rr, y: oy + ry, z: oz + Math.sin(theta) * rr });
          }
        }
        const botIdx = verts.length;
        verts.push({ x: ox, y: oy - r, z: oz });
        for (let x = 0; x < segs; x++) faces.push({ verts: [0, 1 + ((x + 1) % segs), 1 + x], color, materialId });
        for (let y = 0; y < rings - 2; y++) {
          const r0 = 1 + y * segs, r1 = 1 + (y + 1) * segs;
          for (let x = 0; x < segs; x++) {
            const n = (x + 1) % segs;
            faces.push({ verts: [r0 + x, r0 + n, r1 + n, r1 + x], color, materialId });
          }
        }
        const lastRow = 1 + (rings - 2) * segs;
        for (let x = 0; x < segs; x++) faces.push({ verts: [botIdx, lastRow + x, lastRow + ((x + 1) % segs)], color, materialId });
        return new EditableMesh(verts, faces);
      }

      assignRegionUVs(uMin, uMax, vMin, vMax) {
        const { min, size } = this.getBounds();
        const sx = Math.max(size.x, 0.01), sy = Math.max(size.y, 0.01), sz = Math.max(size.z, 0.01);
        for (let fi = 0; fi < this.faces.length; fi++) {
          const f = this.faces[fi];
          const fn = this.computeFaceNormal(fi);
          const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);
          f.uvs = f.verts.map(vi => {
            const v = this.vertices[vi];
            let lu = 0.5, lv = 0.5;
            if (ay >= ax && ay >= az) { lu = (v.x - min.x) / sx; lv = (v.z - min.z) / sz; }
            else if (ax >= ay && ax >= az) { lu = (v.z - min.z) / sz; lv = (v.y - min.y) / sy; }
            else { lu = (v.x - min.x) / sx; lv = (v.y - min.y) / sy; }
            return [uMin + Math.max(0, Math.min(1, lu)) * (uMax - uMin), vMin + Math.max(0, Math.min(1, lv)) * (vMax - vMin)];
          });
        }
        return this;
      }

      // Continuous smooth-lofted multi-ring cartoon tube (zero limb gaps!)
      static createLoftedShape(rings, segs = 8, color = '#6b442a', materialId = 'fabric', uvBox = [0, 1, 0, 1], capEnds = true) {
        // rings: [{ cx, cy, cz, rx, rz }]
        const verts = [], faces = [];
        const [u0, u1, v0, v1] = uvBox;
        for (let r = 0; r < rings.length; r++) {
          const rg = rings[r];
          for (let s = 0; s < segs; s++) {
            const a = (s / segs) * Math.PI * 2;
            verts.push({
              x: rg.cx + Math.cos(a) * rg.rx,
              y: rg.cy,
              z: rg.cz + Math.sin(a) * (rg.rz ?? rg.rx)
            });
          }
        }
        for (let r = 0; r < rings.length - 1; r++) {
          const tv0 = v0 + (r / (rings.length - 1)) * (v1 - v0);
          const tv1 = v0 + ((r + 1) / (rings.length - 1)) * (v1 - v0);
          for (let s = 0; s < segs; s++) {
            const n = (s + 1) % segs;
            const tu0 = u0 + (s / segs) * (u1 - u0);
            const tu1 = u0 + ((s + 1) / segs) * (u1 - u0);
            faces.push({
              verts: [r * segs + s, r * segs + n, (r + 1) * segs + n, (r + 1) * segs + s],
              color, materialId,
              uvs: [[tu0, tv0], [tu1, tv0], [tu1, tv1], [tu0, tv1]]
            });
          }
        }
        if (capEnds) {
          const bot = [], top = [], last = (rings.length - 1) * segs;
          for (let s = 0; s < segs; s++) { bot.push(segs - 1 - s); top.push(last + s); }
          const uc = (u0 + u1) * 0.5;
          faces.push({ verts: bot, color, materialId, uvs: bot.map(() => [uc, v0]) });
          faces.push({ verts: top, color, materialId, uvs: top.map(() => [uc, v1]) });
        }
        return new EditableMesh(verts, faces);
      }

      static createRoofPrism(w = 1.4, h = 0.9, d = 1.4, color = '#6d315c', materialId = 'velvet_plum') {
        const hw = w / 2, hh = h / 2, hd = d / 2;
        const verts = [
          { x: -hw, y: -hh, z: hd }, { x: hw, y: -hh, z: hd }, { x: 0, y: hh, z: hd },
          { x: -hw, y: -hh, z: -hd }, { x: hw, y: -hh, z: -hd }, { x: 0, y: hh, z: -hd },
        ];
        const faces = [
          { verts: [0, 1, 2], color, materialId }, { verts: [4, 3, 5], color, materialId },
          { verts: [1, 4, 5, 2], color, materialId }, { verts: [3, 0, 2, 5], color, materialId },
          { verts: [3, 4, 1, 0], color, materialId },
        ];
        return new EditableMesh(verts, faces);
      }
    }

    // =========================================================================
    // 3. PHASE 2: SILHOUETTE & STROKE 3D GEOMETRY ENGINE
    // =========================================================================
    const DrawGeometry = {
      simplifyPath(points, epsilon = 0.06) {
        if (points.length <= 3) return points;
        let maxD = 0, idx = 0;
        const a = points[0], b = points[points.length - 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const l2 = dx * dx + dy * dy || 1e-8;
        for (let i = 1; i < points.length - 1; i++) {
          const t = Math.max(0, Math.min(1, ((points[i].x - a.x) * dx + (points[i].y - a.y) * dy) / l2));
          const d = Math.hypot(points[i].x - (a.x + t * dx), points[i].y - (a.y + t * dy));
          if (d > maxD) { maxD = d; idx = i; }
        }
        if (maxD > epsilon) {
          const left = this.simplifyPath(points.slice(0, idx + 1), epsilon);
          const right = this.simplifyPath(points.slice(idx), epsilon);
          return left.slice(0, -1).concat(right);
        }
        return [a, b];
      },

      polygonArea2D(pts) {
        let area = 0;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          area += (a.x * b.y - b.x * a.y);
        }
        return area * 0.5;
      },

      earClip2D(pts) {
        // Expects CCW 2D polygon [{x, y}] -> returns array of [i0, i1, i2]
        const n = pts.length;
        if (n < 3) return [];
        const indices = pts.map((_, i) => i);
        const tris = [];
        const cross = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
        const ptInTri = (p, a, b, c) => {
          const c1 = cross(a, b, p), c2 = cross(b, c, p), c3 = cross(c, a, p);
          return c1 >= -1e-6 && c2 >= -1e-6 && c3 >= -1e-6;
        };

        let guard = 0;
        while (indices.length > 3 && guard++ < n * n * 2) {
          let earFound = false;
          for (let i = 0; i < indices.length; i++) {
            const iPrev = indices[(i - 1 + indices.length) % indices.length];
            const iCurr = indices[i];
            const iNext = indices[(i + 1) % indices.length];
            const a = pts[iPrev], b = pts[iCurr], c = pts[iNext];
            if (cross(a, b, c) <= 1e-6) continue;
            let contains = false;
            for (const j of indices) {
              if (j === iPrev || j === iCurr || j === iNext) continue;
              if (ptInTri(pts[j], a, b, c)) { contains = true; break; }
            }
            if (!contains) {
              tris.push([iPrev, iCurr, iNext]);
              indices.splice(i, 1);
              earFound = true;
              break;
            }
          }
          if (!earFound) {
            tris.push([indices[0], indices[1], indices[2]]);
            indices.splice(1, 1);
          }
        }
        if (indices.length === 3) tris.push([indices[0], indices[1], indices[2]]);
        return tris;
      },

      buildSilhouetteMesh(rawPoints2D, depth = 0.45, rounded = true, color = '#6d315c', materialId = 'velvet_plum') {
        let pts = this.simplifyPath(rawPoints2D, 0.055);
        // Remove closing duplicate if near first point
        if (pts.length > 3 && Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y) < 0.08) {
          pts = pts.slice(0, -1);
        }
        if (pts.length < 3) return null;
        if (this.polygonArea2D(pts) < 0) pts = pts.reverse();

        // Center polygon and keep bottom at Y=0
        let cx = 0, minY = Infinity;
        for (const p of pts) { cx += p.x; if (p.y < minY) minY = p.y; }
        cx /= pts.length;
        pts = pts.map(p => ({ x: p.x - cx, y: p.y - minY }));
        let cy = 0;
        for (const p of pts) cy += p.y;
        cy /= pts.length;

        const tris = this.earClip2D(pts);
        const n = pts.length;
        const hd = depth * 0.5;
        const verts = [];
        const faces = [];

        if (!rounded) {
          for (const p of pts) verts.push({ x: p.x, y: p.y, z: hd });   // front ring 0..n-1
          for (const p of pts) verts.push({ x: p.x, y: p.y, z: -hd });  // back ring n..2n-1
          for (const [a, b, c] of tris) faces.push({ verts: [a, b, c], color, materialId });
          for (const [a, b, c] of tris) faces.push({ verts: [n + c, n + b, n + a], color, materialId });
          for (let i = 0; i < n; i++) {
            const nxt = (i + 1) % n;
            faces.push({ verts: [i, n + i, n + nxt, nxt], color, materialId });
          }
        } else {
          // 4-ring pillowed low-poly silhouette (puffed cartoon bevel!)
          const inset = 0.84;
          const midZ = hd * 0.45;
          for (const p of pts) verts.push({ x: p.x * inset, y: cy + (p.y - cy) * inset, z: hd });       // 0..n-1 front cap
          for (const p of pts) verts.push({ x: p.x, y: p.y, z: midZ });                                  // n..2n-1 front rim
          for (const p of pts) verts.push({ x: p.x, y: p.y, z: -midZ });                                 // 2n..3n-1 back rim
          for (const p of pts) verts.push({ x: p.x * inset, y: cy + (p.y - cy) * inset, z: -hd });       // 3n..4n-1 back cap

          for (const [a, b, c] of tris) faces.push({ verts: [a, b, c], color, materialId });
          for (const [a, b, c] of tris) faces.push({ verts: [3 * n + c, 3 * n + b, 3 * n + a], color, materialId });
          for (let i = 0; i < n; i++) {
            const nxt = (i + 1) % n;
            faces.push({ verts: [i, n + i, n + nxt, nxt], color, materialId });
            faces.push({ verts: [n + i, 2 * n + i, 2 * n + nxt, n + nxt], color, materialId });
            faces.push({ verts: [2 * n + i, 3 * n + i, 3 * n + nxt, 2 * n + nxt], color, materialId });
          }
        }
        return new EditableMesh(verts, faces);
      },

      buildStrokeMesh(rawPoints2D, radius = 0.14, tapered = true, sides = 6, color = '#543524', materialId = 'dark_timber') {
        const pts = this.simplifyPath(rawPoints2D, 0.06);
        if (pts.length < 2) return null;

        let cx = 0, minY = Infinity;
        for (const p of pts) { cx += p.x; if (p.y < minY) minY = p.y; }
        cx /= pts.length;
        const spine = pts.map(p => new THREE.Vector3(p.x - cx, p.y - minY + radius, 0));

        const verts = [], faces = [];
        for (let i = 0; i < spine.length; i++) {
          const p = spine[i];
          const prev = spine[Math.max(0, i - 1)];
          const next = spine[Math.min(spine.length - 1, i + 1)];
          const tangent = next.clone().sub(prev).normalize();
          const normal = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
          const binormal = new THREE.Vector3(0, 0, 1);

          const t = spine.length > 1 ? i / (spine.length - 1) : 0;
          const r = tapered ? radius * (1 - t * 0.72) : radius;

          for (let s = 0; s < sides; s++) {
            const ang = (s / sides) * Math.PI * 2;
            const c = Math.cos(ang) * r, sn = Math.sin(ang) * r;
            verts.push({
              x: p.x + normal.x * c + binormal.x * sn,
              y: p.y + normal.y * c + binormal.y * sn,
              z: p.z + normal.z * c + binormal.z * sn
            });
          }
        }

        for (let i = 0; i < spine.length - 1; i++) {
          const r0 = i * sides, r1 = (i + 1) * sides;
          for (let s = 0; s < sides; s++) {
            const nxt = (s + 1) % sides;
            faces.push({ verts: [r0 + s, r1 + s, r1 + nxt, r0 + nxt], color, materialId });
          }
        }
        // Start & end caps
        const startCap = [], endCap = [];
        const lastBase = (spine.length - 1) * sides;
        for (let s = 0; s < sides; s++) {
          startCap.push(sides - 1 - s);
          endCap.push(lastBase + s);
        }
        faces.push({ verts: startCap, color, materialId });
        faces.push({ verts: endCap, color, materialId });
        return new EditableMesh(verts, faces);
      }

      buildCrookedBookshelf(wS = 1, hS = 1, chunk = 1, crook = 0.34, detail = 1) {
