<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14111f" />
  <meta name="apple-mobile-web-app-title" content="Polycraft Studio" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <title>Polycraft Studio — Stylized Low-Poly 3D Workshop</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #13101e;
      --bg-panel: rgba(24, 20, 38, 0.88);
      --bg-panel-solid: #1b162b;
      --bg-elevated: rgba(39, 33, 60, 0.92);
      --border-subtle: rgba(255, 240, 214, 0.11);
      --border-strong: rgba(245, 166, 35, 0.45);
      --accent-amber: #f5a623;
      --accent-amber-soft: rgba(245, 166, 35, 0.18);
      --accent-teal: #38d9c0;
      --accent-teal-soft: rgba(56, 217, 192, 0.16);
      --accent-coral: #ff6b6b;
      --text-main: #f6f1e7;
      --text-muted: #aba3be;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    input[type="text"], input[type="number"] {
      user-select: text;
      -webkit-user-select: text;
    }

    #viewport-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: radial-gradient(circle at 50% 42%, #241e3a 0%, #141021 72%, #0e0b18 100%);
    }

    #viewport-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Subtle PS2 Bayer Dither overlay when Retro Preview + Dither enabled */
    #retro-dither-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      background-image: radial-gradient(rgba(0,0,0,0.34) 1px, transparent 0);
      background-size: 3px 3px;
      mix-blend-mode: multiply;
      z-index: 4;
    }
    #retro-dither-overlay.active {
      opacity: 0.7;
    }

    .glass-bar {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 28px rgba(5, 3, 14, 0.45);
    }

    .touch-btn {
      min-width: 40px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease, color 0.14s ease;
    }
    .touch-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .touch-btn:active {
      transform: scale(0.95);
    }
    .touch-btn.active {
      background: var(--accent-amber-soft);
      border-color: var(--border-strong);
      color: #ffd07a;
    }
    .touch-btn.teal-active {
      background: var(--accent-teal-soft);
      border-color: rgba(56, 217, 192, 0.55);
      color: #7df2df;
    }
    .touch-btn:disabled {
      opacity: 0.32;
      pointer-events: none;
    }

    .seg-pill {
      display: inline-flex;
      padding: 3px;
      border-radius: 14px;
      background: rgba(12, 9, 22, 0.65);
      border: 1px solid var(--border-subtle);
      gap: 2px;
    }
    .seg-pill button {
      min-height: 34px;
      padding: 0 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .seg-pill button.active {
      background: var(--accent-amber);
      color: #1a1205;
      box-shadow: 0 2px 10px rgba(245, 166, 35, 0.35);
    }

    /* Drawer / Sheet */
    .studio-sheet {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      bottom: calc(74px + var(--safe-bottom));
      width: min(560px, calc(100vw - 20px));
      max-height: min(52dvh, 430px);
      border-radius: 20px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .studio-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .sheet-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    /* Custom tactile sliders */
    input[type="range"].poly-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
    }
    input[type="range"].poly-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-amber);
      border: 2px solid #1c162c;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    /* Contextual Floating Action Bar */
    #context-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(76px + var(--safe-bottom));
      z-index: 18;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
      scrollbar-width: none;
      touch-action: pan-x;
      transition: bottom 0.2s ease, opacity 0.15s ease;
    }
    #context-bar::-webkit-scrollbar { display: none; }

    /* Toast */
    #toast-wrap {
      position: fixed;
      top: calc(68px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .toast-pill {
      background: rgba(22, 18, 36, 0.94);
      border: 1px solid rgba(245, 166, 35, 0.45);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: toastIn 0.18s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .swatch-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.16);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .swatch-btn.active, .swatch-btn:hover {
      transform: scale(1.1);
      border-color: #ffffff;
    }

    @media (max-width: 640px) {
      .hide-xs { display: none !important; }
      .seg-pill button { padding: 0 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <!-- 3D Viewport Container -->
  <div id="viewport-wrap">
    <canvas id="viewport-canvas"></canvas>
  </div>
  <div id="retro-dither-overlay"></div>

  <!-- Top Navigation & Mode Bar -->
  <header class="fixed top-0 left-0 right-0 z-20 px-2.5 pt-2.5 flex items-center justify-between gap-2 pointer-events-none" style="padding-top: calc(10px + var(--safe-top));">
    <!-- Left: Brand + Undo/Redo -->
    <div class="glass-bar rounded-2xl px-2 py-1 flex items-center gap-1 pointer-events-auto">
      <div class="flex items-center gap-2 pl-1.5 pr-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-stone-950 font-extrabold text-sm shadow">P</div>
        <div class="leading-tight hide-xs">
          <div class="text-xs font-extrabold tracking-tight text-amber-100">Polycraft Studio</div>
          <div id="project-status" class="text-[10px] text-purple-200/70">Autosaved</div>
        </div>
      </div>
      <div class="w-px h-6 bg-white/10 mx-0.5"></div>
      <button id="btn-undo" class="touch-btn px-2" title="Undo (Ctrl+Z)" disabled>
        <i data-lucide="undo-2" class="w-4 h-4"></i>
      </button>
      <button id="btn-redo" class="touch-btn px-2" title="Redo (Ctrl+Y)" disabled>
        <i data-lucide="redo-2" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Center: Selection Mode Switcher -->
    <div class="glass-bar rounded-2xl p-1 pointer-events-auto">
      <div class="seg-pill" role="tablist" aria-label="Selection Mode">
        <button id="mode-object" class="active" data-mode="object" title="Object Mode (1)">
          <i data-lucide="box" class="w-3.5 h-3.5"></i><span>Object</span>
        </button>
        <button id="mode-vertex" data-mode="vertex" title="Vertex Mode (2)">
          <i data-lucide="circle-dot" class="w-3.5 h-3.5"></i><span>Vert</span>
        </button>
        <button id="mode-edge" data-mode="edge" title="Edge Mode (3)">
          <i data-lucide="slash" class="w-3.5 h-3.5"></i><span>Edge</span>
        </button>
        <button id="mode-face" data-mode="face" title="Face Mode (4)">
          <i data-lucide="pentagon" class="w-3.5 h-3.5"></i><span>Face</span>
        </button>
      </div>
    </div>

    <!-- Right: Quick Toggles (Symmetry, Snap, Retro Preview, Camera Menu) -->
    <div class="glass-bar rounded-2xl px-1.5 py-1 flex items-center gap-1 pointer-events-auto">
      <button id="btn-symmetry" class="touch-btn px-2" title="X-Axis Symmetry Editing">
        <i data-lucide="flip-horizontal-2" class="w-4 h-4"></i><span class="hide-xs">Sym X</span>
      </button>
      <button id="btn-snap" class="touch-btn px-2" title="Grid Snap (0.25m)">
        <i data-lucide="magnet" class="w-4 h-4"></i>
      </button>
      <button id="btn-retro" class="touch-btn px-2" title="PS2 Retro Preview (Non-Destructive)">
        <i data-lucide="tv" class="w-4 h-4"></i><span class="hide-xs">PS2</span>
      </button>
      <button id="btn-camera-menu" class="touch-btn px-2" title="Camera & View Options">
        <i data-lucide="video" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Collapsible Camera & Preview Popover (Top Right) -->
  <div id="camera-popover" class="glass-bar fixed right-3 z-30 rounded-2xl p-3 w-64 hidden" style="top: calc(64px + var(--safe-top));">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-bold uppercase tracking-wider text-amber-200/90">Camera & Preview</span>
      <button id="btn-close-cam" class="touch-btn !min-w-7 !min-h-7 rounded-lg"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-1.5 mb-2.5">
      <button id="btn-proj-persp" class="touch-btn active !min-h-9 bg-white/5 text-xs">Perspective</button>
      <button id="btn-proj-ortho" class="touch-btn !min-h-9 bg-white/5 text-xs">Orthographic</button>
    </div>
    <div class="grid grid-cols-4 gap-1.5 mb-2.5">
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="front">Front</button>
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="side">Side</button>
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="top">Top</button>
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="back">Back</button>
    </div>
    <div class="grid grid-cols-2 gap-1.5 mb-3">
      <button id="btn-cam-focus" class="touch-btn !min-h-9 bg-white/5 text-xs"><i data-lucide="crosshair" class="w-3.5 h-3.5"></i>Focus</button>
      <button id="btn-fullscreen" class="touch-btn !min-h-9 bg-white/5 text-xs"><i data-lucide="maximize" class="w-3.5 h-3.5"></i>Fullscreen</button>
    </div>
    <div class="border-t border-white/10 pt-2.5 space-y-2">
      <div class="text-[11px] font-bold uppercase tracking-wider text-purple-200/70">Preview Effects (Non-Export)</div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">Wireframe Overlay</span>
        <button id="btn-wireframe" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Off</button>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">PS2 Low-Res + Fog</span>
        <button id="btn-retro-inner" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Off</button>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">Ink Outlines</span>
        <button id="btn-outlines" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Off</button>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">Lighting Mood</span>
        <button id="btn-lighting-mood" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Mansion</button>
      </div>
    </div>
  </div>

  <!-- Floating Transform Gizmo Mode + Axis Pill (Left side) -->
  <div id="transform-rail" class="glass-bar fixed left-2.5 top-1/2 -translate-y-1/2 z-15 rounded-2xl p-1.5 flex flex-col items-center gap-1">
    <button id="gizmo-move" class="touch-btn active !w-10 !h-10" data-gizmo="translate" title="Move (G)">
      <i data-lucide="move" class="w-4 h-4"></i>
    </button>
    <button id="gizmo-rotate" class="touch-btn !w-10 !h-10" data-gizmo="rotate" title="Rotate (R)">
      <i data-lucide="rotate-cw" class="w-4 h-4"></i>
    </button>
    <button id="gizmo-scale" class="touch-btn !w-10 !h-10" data-gizmo="scale" title="Scale (S)">
      <i data-lucide="maximize-2" class="w-4 h-4"></i>
    </button>
    <div class="w-6 h-px bg-white/10 my-0.5"></div>
    <button id="axis-free" class="touch-btn active !w-10 !h-8 text-[11px] font-bold" data-axis="free" title="Free Screen-Plane Drag">Free</button>
    <button id="axis-x" class="touch-btn !w-10 !h-8 text-[11px] font-bold text-rose-400" data-axis="x" title="Lock X Axis">X</button>
    <button id="axis-y" class="touch-btn !w-10 !h-8 text-[11px] font-bold text-emerald-400" data-axis="y" title="Lock Y Axis">Y</button>
    <button id="axis-z" class="touch-btn !w-10 !h-8 text-[11px] font-bold text-sky-400" data-axis="z" title="Lock Z Axis">Z</button>
  </div>

  <!-- Stats & Gesture Hint Chip (Bottom Left above dock on desktop, Top Left below header on mobile) -->
  <div id="stats-chip" class="glass-bar fixed left-3 z-10 rounded-xl px-2.5 py-1.5 text-[11px] text-purple-100/85 pointer-events-none flex items-center gap-2.5" style="top: calc(64px + var(--safe-top));">
    <span id="stat-poly">0 Tris · 0 Faces · 0 Verts</span>
    <span id="stat-sel" class="text-teal-300 font-semibold"></span>
  </div>

  <!-- Live Transform Delta Readout -->
  <div id="drag-hud" class="glass-bar fixed left-1/2 -translate-x-1/2 z-30 rounded-full px-3.5 py-1 text-xs font-bold text-amber-200 hidden pointer-events-none" style="top: calc(68px + var(--safe-top));"></div>

  <!-- Contextual Floating Action Bar (changes by Object / Vertex / Edge / Face selection) -->
  <div id="context-bar" class="glass-bar rounded-2xl px-1.5 py-1 flex items-center gap-1 hidden"></div>

  <!-- Collapsible Bottom Tool Sheet -->
  <section id="studio-sheet" class="studio-sheet glass-bar" aria-hidden="true">
    <div class="flex items-center justify-between px-4 py-2.5 border-b border-white/10">
      <div class="flex items-center gap-2">
        <span id="sheet-title" class="text-sm font-bold text-amber-100">Workshop</span>
        <span id="sheet-subtitle" class="text-[11px] text-purple-200/65"></span>
      </div>
      <button id="btn-close-sheet" class="touch-btn !min-w-8 !min-h-8 rounded-xl bg-white/5">
        <i data-lucide="chevron-down" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="sheet-body" class="sheet-scroll p-3.5 space-y-3"></div>
  </section>

  <!-- Bottom Tactile Dock -->
  <nav class="fixed bottom-0 left-0 right-0 z-20 px-2.5 pb-2.5 flex justify-center pointer-events-none" style="padding-bottom: calc(10px + var(--safe-bottom));">
    <div class="glass-bar rounded-2xl px-1.5 py-1.5 flex items-center gap-1 pointer-events-auto max-w-full overflow-x-auto">
      <button class="touch-btn px-3 flex-col !gap-0.5 !min-h-[50px] !min-w-[60px]" data-sheet="add">
        <i data-lucide="plus-square" class="w-4 h-4"></i>
        <span class="text-[10.5px]">Add</span>
      </button>
      <button class="touch-btn px-3 flex-col !gap-0.5 !min-h-[50px] !min-w-[60px]" data-sheet="deform">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span class="text-[10.5px]">Shape</span>
      </button>
      <button class="touch-btn px-3 flex-col !gap-0.5 !min-h-[50px] !min-w-[60px]" data-sheet="paint">
        <i data-lucide="palette" class="w-4 h-4"></i>
        <span class="text-[10.5px]">Paint</span>
      </button>
      <button class="touch-btn px-3 flex-col !gap-0.5 !min-h-[50px] !min-w-[60px]" data-sheet="scene">
        <i data-lucide="layers" class="w-4 h-4"></i>
        <span class="text-[10.5px]">Scene</span>
      </button>
      <button class="touch-btn px-3 flex-col !gap-0.5 !min-h-[50px] !min-w-[60px]" data-sheet="export">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span class="text-[10.5px]">Godot</span>
      </button>
    </div>
  </nav>

  <!-- Toast Notifications -->
  <div id="toast-wrap"></div>

  <!-- Hidden File Inputs for Project JSON & GLB Import -->
  <input id="input-import-json" type="file" accept=".json,.polycraft" class="hidden" />
  <input id="input-import-glb" type="file" accept=".glb" class="hidden" />

  <script>
    /* =========================================================================
     * POLYCRAFT STUDIO — MODULAR ARCHITECTURE (PHASES 1–4 READY)
     * Modules:
     *   1. GeometryCore   : EditableMesh B-Rep topology (verts, edges, faces)
     *   2. DemoWorkshop   : Handcrafted stylized low-poly assets (Crooked Bookshelf,
     *                       Spooky Mansion Door, Stylized Spooky Tree)
     *   3. MaterialLib    : Stylized PS2-era hand-painted palette & materials
     *   4. HistoryManager : Command/Snapshot Undo & Redo engine
     *   5. StorageManager : IndexedDB autosave + JSON backup export/import
     *   6. GodotGLB       : Binary GLB 2.0 exporter, importer & Godot 4 validator
     *   7. ViewportEngine : Three.js renderer, custom gizmo, selection overlays,
     *                       touch/pen/mouse gesture separation & Retro PS2 preview
     *   8. StudioApp      : State store, UI sheets, contextual menus & wiring
     * ========================================================================= */

    // =========================================================================
    // 1. MATERIAL LIBRARY (Stylized Early-2000s Palette)
    // =========================================================================
    const MaterialLib = {
      presets: [
        { id: 'aged_wood',    name: 'Aged Oak',      color: '#6b442a', roughness: 0.85, metalness: 0.05 },
        { id: 'dark_timber',  name: 'Dark Timber',   color: '#42281c', roughness: 0.88, metalness: 0.05 },
        { id: 'mossy_stone',  name: 'Mossy Stone',   color: '#6d7570', roughness: 0.92, metalness: 0.04 },
        { id: 'mansion_plaster', name: 'Old Plaster', color: '#cfc2a8', roughness: 0.90, metalness: 0.02 },
        { id: 'wrought_iron', name: 'Wrought Iron',  color: '#2e313b', roughness: 0.55, metalness: 0.65 },
        { id: 'tarnished_brass', name: 'Old Brass',  color: '#c9973e', roughness: 0.42, metalness: 0.72 },
        { id: 'velvet_plum',  name: 'Mystery Plum',  color: '#6d315c', roughness: 0.86, metalness: 0.04 },
        { id: 'autumn_leaf',  name: 'Spooky Teal',   color: '#2f6d65', roughness: 0.84, metalness: 0.02 },
        { id: 'pumpkin',      name: 'Amber Glow',    color: '#d97828', roughness: 0.72, metalness: 0.05 },
        { id: 'book_crimson', name: 'Tome Red',      color: '#9e2f38', roughness: 0.82, metalness: 0.04 },
        { id: 'book_cobalt',  name: 'Tome Blue',     color: '#34588a', roughness: 0.82, metalness: 0.04 },
        { id: 'ghost_mint',   name: 'Ecto Mint',     color: '#5ce0b8', roughness: 0.45, metalness: 0.05 },
      ],
      hexToRgb01(hex) {
        const clean = hex.replace('#', '');
        const n = parseInt(clean, 16);
        return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
      }
    };

    // =========================================================================
    // 2. GEOMETRY CORE: GENUINE EDITABLE MESH (B-Rep Topology)
    // =========================================================================
    class EditableMesh {
      constructor(vertices = [], faces = []) {
        // vertices: [{ x, y, z }]
        // faces: [{ verts: [i0, i1, i2, ...], color: '#hex', materialId: 'aged_wood' }]
        this.vertices = vertices.map(v => ({ x: +v.x, y: +v.y, z: +v.z }));
        this.faces = faces.map(f => ({
          verts: [...f.verts],
          color: f.color || '#6b442a',
          materialId: f.materialId || 'aged_wood'
        }));
      }

      clone() {
        return new EditableMesh(this.vertices, this.faces);
      }

      toJSON() {
        return {
          vertices: this.vertices.map(v => [
            +v.x.toFixed(5), +v.y.toFixed(5), +v.z.toFixed(5)
          ]),
          faces: this.faces.map(f => ({
            v: [...f.verts],
            c: f.color,
            m: f.materialId
          }))
        };
      }

      static fromJSON(data) {
        const verts = (data.vertices || []).map(v =>
          Array.isArray(v) ? { x: v[0], y: v[1], z: v[2] } : { x: v.x, y: v.y, z: v.z }
        );
        const faces = (data.faces || []).map(f => ({
          verts: f.v || f.verts,
          color: f.c || f.color || '#6b442a',
          materialId: f.m || f.materialId || 'aged_wood'
        }));
        return new EditableMesh(verts, faces);
      }

      getTriangleCount() {
        let tris = 0;
        for (const f of this.faces) {
          if (f.verts.length >= 3) tris += f.verts.length - 2;
        }
        return tris;
      }

      getEdges() {
        // Returns deduplicated array of { a, b, key, faces: [fIdx...] }
        const map = new Map();
        for (let fi = 0; fi < this.faces.length; fi++) {
          const vs = this.faces[fi].verts;
          for (let i = 0; i < vs.length; i++) {
            const v0 = vs[i];
            const v1 = vs[(i + 1) % vs.length];
            const a = Math.min(v0, v1);
            const b = Math.max(v0, v1);
            const key = `${a}_${b}`;
            if (!map.has(key)) map.set(key, { a, b, key, faces: [] });
            map.get(key).faces.push(fi);
          }
        }
        return Array.from(map.values());
      }

      computeFaceNormal(faceIdx) {
        const f = this.faces[faceIdx];
        if (!f || f.verts.length < 3) return new THREE.Vector3(0, 1, 0);
        // Newell's method for robust polygon normals
        let nx = 0, ny = 0, nz = 0;
        const n = f.verts.length;
        for (let i = 0; i < n; i++) {
          const c = this.vertices[f.verts[i]];
          const next = this.vertices[f.verts[(i + 1) % n]];
          if (!c || !next) continue;
          nx += (c.y - next.y) * (c.z + next.z);
          ny += (c.z - next.z) * (c.x + next.x);
          nz += (c.x - next.x) * (c.y + next.y);
        }
        const vec = new THREE.Vector3(nx, ny, nz);
        if (vec.lengthSq() < 1e-10) return new THREE.Vector3(0, 1, 0);
        return vec.normalize();
      }

      computeFaceCenter(faceIdx) {
        const f = this.faces[faceIdx];
        const c = new THREE.Vector3();
        if (!f || !f.verts.length) return c;
        for (const vi of f.verts) {
          const v = this.vertices[vi];
          if (v) c.add(new THREE.Vector3(v.x, v.y, v.z));
        }
        return c.divideScalar(f.verts.length);
      }

      getBounds() {
        const min = new THREE.Vector3(Infinity, Infinity, Infinity);
        const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
        for (const v of this.vertices) {
          if (v.x < min.x) min.x = v.x;
          if (v.y < min.y) min.y = v.y;
          if (v.z < min.z) min.z = v.z;
          if (v.x > max.x) max.x = v.x;
          if (v.y > max.y) max.y = v.y;
          if (v.z > max.z) max.z = v.z;
        }
        if (!this.vertices.length) {
          min.set(0, 0, 0);
          max.set(0, 0, 0);
        }
        return {
          min, max,
          center: min.clone().add(max).multiplyScalar(0.5),
          size: max.clone().sub(min)
        };
      }

      // ---- Topology Operations ----

      extrudeFaces(faceIndices, distance = 0.35) {
        const valid = [...new Set(faceIndices)].filter(fi => fi >= 0 && fi < this.faces.length);
        if (!valid.length) return [];

        const selectedSet = new Set(valid);
        // Compute average extrusion direction
        const avgNormal = new THREE.Vector3();
        for (const fi of valid) avgNormal.add(this.computeFaceNormal(fi));
        if (avgNormal.lengthSq() < 1e-8) avgNormal.set(0, 1, 0);
        else avgNormal.normalize();

        // Count directed edge occurrences within selected faces to find boundary loop
        const edgeCount = new Map();
        const boundaryDirected = [];
        for (const fi of valid) {
          const vs = this.faces[fi].verts;
          for (let i = 0; i < vs.length; i++) {
            const a = vs[i];
            const b = vs[(i + 1) % vs.length];
            const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
            edgeCount.set(key, (edgeCount.get(key) || 0) + 1);
          }
        }
        for (const fi of valid) {
          const vs = this.faces[fi].verts;
          const faceColor = this.faces[fi].color;
          const faceMat = this.faces[fi].materialId;
          for (let i = 0; i < vs.length; i++) {
            const a = vs[i];
            const b = vs[(i + 1) % vs.length];
            const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
            if (edgeCount.get(key) === 1) {
              boundaryDirected.push({ a, b, color: faceColor, materialId: faceMat });
            }
          }
        }

        // Duplicate all vertices used by selected faces
        const oldToNew = new Map();
        for (const fi of valid) {
          for (const vi of this.faces[fi].verts) {
            if (!oldToNew.has(vi)) {
              const orig = this.vertices[vi];
              const newIdx = this.vertices.length;
              this.vertices.push({
                x: orig.x + avgNormal.x * distance,
                y: orig.y + avgNormal.y * distance,
                z: orig.z + avgNormal.z * distance
              });
              oldToNew.set(vi, newIdx);
            }
          }
        }

        // Remap selected faces to use duplicated extruded vertices
        for (const fi of valid) {
          this.faces[fi].verts = this.faces[fi].verts.map(vi => oldToNew.get(vi));
        }

        // Stitch side wall quads along boundary edges
        for (const edge of boundaryDirected) {
          const na = oldToNew.get(edge.a);
          const nb = oldToNew.get(edge.b);
          this.faces.push({
            verts: [edge.a, edge.b, nb, na],
            color: edge.color,
            materialId: edge.materialId
          });
        }

        return valid;
      }

      insetFaces(faceIndices, factor = 0.25) {
        const valid = [...new Set(faceIndices)].filter(fi => fi >= 0 && fi < this.faces.length);
        if (!valid.length) return [];
        const t = Math.max(0.05, Math.min(0.85, factor));

        for (const fi of valid) {
          const f = this.faces[fi];
          const center = this.computeFaceCenter(fi);
          const origVerts = [...f.verts];
          const innerVerts = [];
          for (const vi of origVerts) {
            const v = this.vertices[vi];
            const idx = this.vertices.length;
            this.vertices.push({
              x: v.x + (center.x - v.x) * t,
              y: v.y + (center.y - v.y) * t,
              z: v.z + (center.z - v.z) * t
            });
            innerVerts.push(idx);
          }
          // Replace original face with inner face
          f.verts = innerVerts;
          // Add border quads
          for (let i = 0; i < origVerts.length; i++) {
            const next = (i + 1) % origVerts.length;
            this.faces.push({
              verts: [origVerts[i], origVerts[next], innerVerts[next], innerVerts[i]],
              color: f.color,
              materialId: f.materialId
            });
          }
        }
        return valid;
      }

      bevelFaces(faceIndices, amount = 0.14) {
        // Inset + slight outward/inward step produces a crisp low-poly bevel
        const valid = this.insetFaces(faceIndices, Math.min(0.45, Math.max(0.08, amount * 1.4)));
        for (const fi of valid) {
          const n = this.computeFaceNormal(fi);
          for (const vi of this.faces[fi].verts) {
            this.vertices[vi].x += n.x * amount * 0.55;
            this.vertices[vi].y += n.y * amount * 0.55;
            this.vertices[vi].z += n.z * amount * 0.55;
          }
        }
        return valid;
      }

      subdivideFaces(faceIndices) {
        const targets = faceIndices && faceIndices.length
          ? [...new Set(faceIndices)].filter(fi => fi >= 0 && fi < this.faces.length)
          : this.faces.map((_, i) => i);
        if (!targets.length) return [];

        const targetSet = new Set(targets);
        const edgeMidMap = new Map();
        const getEdgeMid = (a, b) => {
          const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
          if (edgeMidMap.has(key)) return edgeMidMap.get(key);
          const va = this.vertices[a], vb = this.vertices[b];
          const idx = this.vertices.length;
          this.vertices.push({
            x: (va.x + vb.x) * 0.5,
            y: (va.y + vb.y) * 0.5,
            z: (va.z + vb.z) * 0.5
          });
          edgeMidMap.set(key, idx);
          return idx;
        };

        const newFaces = [];
        const newTargetIndices = [];

        for (let fi = 0; fi < this.faces.length; fi++) {
          const f = this.faces[fi];
          if (!targetSet.has(fi)) {
            // Check if any edge of this neighbor face was split to prevent T-junctions
            const vs = f.verts;
            const rebuilt = [];
            for (let i = 0; i < vs.length; i++) {
              const a = vs[i], b = vs[(i + 1) % vs.length];
              rebuilt.push(a);
              const key = `${Math.min(a, b)}_${Math.max(a, b)}`;
              if (edgeMidMap.has(key)) rebuilt.push(edgeMidMap.get(key));
            }
            newFaces.push({ verts: rebuilt, color: f.color, materialId: f.materialId });
            continue;
          }

          const c = this.computeFaceCenter(fi);
          const cIdx = this.vertices.length;
          this.vertices.push({ x: c.x, y: c.y, z: c.z });

          const vs = f.verts;
          const mids = vs.map((v, i) => getEdgeMid(v, vs[(i + 1) % vs.length]));
          for (let i = 0; i < vs.length; i++) {
            const prevMid = mids[(i - 1 + vs.length) % vs.length];
            const currMid = mids[i];
            newTargetIndices.push(newFaces.length);
            newFaces.push({
              verts: [vs[i], currMid, cIdx, prevMid],
              color: f.color,
              materialId: f.materialId
            });
          }
        }

        this.faces = newFaces;
        return newTargetIndices;
      }

      deleteFaces(faceIndices) {
        const delSet = new Set(faceIndices);
        this.faces = this.faces.filter((_, i) => !delSet.has(i));
        this.pruneUnusedVertices();
      }

      deleteVertices(vertIndices) {
        const delSet = new Set(vertIndices);
        this.faces = this.faces.filter(f => !f.verts.some(vi => delSet.has(vi)));
        this.pruneUnusedVertices();
      }

      weldVertices(vertIndices, threshold = 0.0) {
        // If threshold > 0, welds any pairs within threshold; else welds all vertIndices to their centroid
        if (threshold > 0) {
          const remap = this.vertices.map((_, i) => i);
          const th2 = threshold * threshold;
          for (let i = 0; i < this.vertices.length; i++) {
            if (remap[i] !== i) continue;
            const vi = this.vertices[i];
            for (let j = i + 1; j < this.vertices.length; j++) {
              if (remap[j] !== j) continue;
              const vj = this.vertices[j];
              const dx = vi.x - vj.x, dy = vi.y - vj.y, dz = vi.z - vj.z;
              if (dx * dx + dy * dy + dz * dz <= th2) {
                remap[j] = i;
              }
            }
          }
          this._remapAndClean(remap);
          return;
        }

        const unique = [...new Set(vertIndices)].filter(i => i >= 0 && i < this.vertices.length);
        if (unique.length < 2) return;
        let cx = 0, cy = 0, cz = 0;
        for (const vi of unique) {
          cx += this.vertices[vi].x;
          cy += this.vertices[vi].y;
          cz += this.vertices[vi].z;
        }
        cx /= unique.length; cy /= unique.length; cz /= unique.length;
        const target = unique[0];
        this.vertices[target] = { x: cx, y: cy, z: cz };
        const remap = this.vertices.map((_, i) => i);
        for (let k = 1; k < unique.length; k++) remap[unique[k]] = target;
        this._remapAndClean(remap);
      }

      _remapAndClean(remap) {
        const cleanedFaces = [];
        for (const f of this.faces) {
          const nv = [];
          for (const vi of f.verts) {
            const m = remap[vi];
            if (nv.length === 0 || nv[nv.length - 1] !== m) nv.push(m);
          }
          if (nv.length > 1 && nv[0] === nv[nv.length - 1]) nv.pop();
          const uniqueCount = new Set(nv).size;
          if (nv.length >= 3 && uniqueCount >= 3) {
            cleanedFaces.push({ verts: nv, color: f.color, materialId: f.materialId });
          }
        }
        this.faces = cleanedFaces;
        this.pruneUnusedVertices();
      }

      pruneUnusedVertices() {
        const used = new Set();
        for (const f of this.faces) for (const vi of f.verts) used.add(vi);
        const newVerts = [];
        const remap = new Map();
        for (let i = 0; i < this.vertices.length; i++) {
          if (used.has(i)) {
            remap.set(i, newVerts.length);
            newVerts.push(this.vertices[i]);
          }
        }
        this.vertices = newVerts;
        for (const f of this.faces) {
          f.verts = f.verts.map(vi => remap.get(vi));
        }
      }

      mirrorX(mergeWithOriginal = true) {
        const origVertCount = this.vertices.length;
        const origFaces = this.faces.map(f => ({ verts: [...f.verts], color: f.color, materialId: f.materialId }));
        if (!mergeWithOriginal) {
          for (const v of this.vertices) v.x = -v.x;
          for (const f of this.faces) f.verts.reverse();
          return;
        }
        for (let i = 0; i < origVertCount; i++) {
          const v = this.vertices[i];
          this.vertices.push({ x: -v.x, y: v.y, z: v.z });
        }
        for (const f of origFaces) {
          this.faces.push({
            verts: f.verts.map(vi => vi + origVertCount).reverse(),
            color: f.color,
            materialId: f.materialId
          });
        }
        this.weldVertices([], 0.001);
      }

      recalculateNormals() {
        // Ensure outward winding relative to mesh centroid for closed/convex-ish volumes
        const { center } = this.getBounds();
        let dotSum = 0;
        for (let fi = 0; fi < this.faces.length; fi++) {
          const n = this.computeFaceNormal(fi);
          const fc = this.computeFaceCenter(fi).sub(center);
          dotSum += n.dot(fc);
        }
        if (dotSum < 0) {
          for (const f of this.faces) f.verts.reverse();
        }
      }

      mergeWith(otherMesh, offsetPos = { x: 0, y: 0, z: 0 }) {
        const base = this.vertices.length;
        for (const v of otherMesh.vertices) {
          this.vertices.push({
            x: v.x + offsetPos.x,
            y: v.y + offsetPos.y,
            z: v.z + offsetPos.z
          });
        }
        for (const f of otherMesh.faces) {
          this.faces.push({
            verts: f.verts.map(vi => vi + base),
            color: f.color,
            materialId: f.materialId
          });
        }
      }

      // ---- Artistic Shape Deformers (Crookedness, Taper, Bend, Twist, Bulge) ----
      applyDeform(type, amount) {
        if (Math.abs(amount) < 1e-4) return;
        const { min, max, center, size } = this.getBounds();
        const h = Math.max(size.y, 0.001);
        const w = Math.max(size.x, 0.001);

        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          const ty = (v.y - min.y) / h; // 0 at bottom, 1 at top
          const cy = v.y - center.y;

          if (type === 'crooked') {
            // Whimsical Scooby-Doo lean + organic hand-crafted irregularity
            const hash = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
            const jitter = (hash - Math.floor(hash) - 0.5) * 0.14 * amount;
            v.x += Math.pow(ty, 1.4) * amount * 0.48 + jitter;
            v.z += Math.sin(ty * Math.PI) * amount * 0.18 + jitter * 0.7;
            v.y += Math.sin((v.x - center.x) * 2.1) * amount * 0.08;
          } else if (type === 'taper') {
            const scale = Math.max(0.15, 1 + (ty - 0.5) * amount * 1.1);
            v.x = center.x + (v.x - center.x) * scale;
            v.z = center.z + (v.z - center.z) * scale;
          } else if (type === 'bend') {
            const angle = ty * amount * 0.9;
            const dx = v.x - center.x;
            const dy = v.y - min.y;
            const cos = Math.cos(angle), sin = Math.sin(angle);
            v.x = center.x + dx * cos + dy * sin * 0.45;
            v.y = min.y + dy * cos - dx * sin * 0.25;
          } else if (type === 'twist') {
            const angle = (ty - 0.5) * amount * Math.PI * 0.85;
            const dx = v.x - center.x;
            const dz = v.z - center.z;
            const cos = Math.cos(angle), sin = Math.sin(angle);
            v.x = center.x + dx * cos - dz * sin;
            v.z = center.z + dx * sin + dz * cos;
          } else if (type === 'bulge') {
            const bulgeFactor = 1 + Math.sin(ty * Math.PI) * amount * 0.65;
            v.x = center.x + (v.x - center.x) * bulgeFactor;
            v.z = center.z + (v.z - center.z) * bulgeFactor;
          } else if (type === 'squash') {
            const sy = Math.max(0.25, 1 - amount * 0.45);
            const sxz = 1 / Math.sqrt(sy);
            v.y = min.y + (v.y - min.y) * sy;
            v.x = center.x + (v.x - center.x) * sxz;
            v.z = center.z + (v.z - center.z) * sxz;
          }
        }
      }

      // ---- Convert to Three.js BufferGeometry with Box-Projected UVs & Face Colors ----
      toThreeBufferGeometry(flatShading = true, selectedFaces = null) {
        const positions = [];
        const normals = [];
        const uvs = [];
        const colors = [];
        const faceMap = []; // triangleIndex -> faceIndex

        // Compute smooth vertex normals if needed
        let smoothNormals = null;
        if (!flatShading) {
          smoothNormals = this.vertices.map(() => new THREE.Vector3());
          for (let fi = 0; fi < this.faces.length; fi++) {
            const fn = this.computeFaceNormal(fi);
            for (const vi of this.faces[fi].verts) {
              if (smoothNormals[vi]) smoothNormals[vi].add(fn);
            }
          }
          for (const sn of smoothNormals) {
            if (sn.lengthSq() > 1e-8) sn.normalize();
            else sn.set(0, 1, 0);
          }
        }

        const selSet = selectedFaces ? new Set(selectedFaces) : null;

        for (let fi = 0; fi < this.faces.length; fi++) {
          const f = this.faces[fi];
          if (f.verts.length < 3) continue;
          const fn = this.computeFaceNormal(fi);
          const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);

          let [r, g, b] = MaterialLib.hexToRgb01(f.color || '#6b442a');
          if (selSet && selSet.has(fi)) {
            // Subtle warm highlight tint on selected faces
            r = Math.min(1, r * 0.55 + 0.45);
            g = Math.min(1, g * 0.55 + 0.32);
            b = Math.min(1, b * 0.55 + 0.08);
          }

          // Fan triangulation
          for (let i = 1; i < f.verts.length - 1; i++) {
            const tri = [f.verts[0], f.verts[i], f.verts[i + 1]];
            for (const vi of tri) {
              const v = this.vertices[vi];
              positions.push(v.x, v.y, v.z);
              const n = flatShading ? fn : smoothNormals[vi];
              normals.push(n.x, n.y, n.z);

              // Clean box-projected UV for Godot 4 compatibility
              let u = 0, vv = 0;
              if (ay >= ax && ay >= az) { u = v.x * 0.5 + 0.5; vv = v.z * 0.5 + 0.5; }
              else if (ax >= ay && ax >= az) { u = v.z * 0.5 + 0.5; vv = v.y * 0.5 + 0.5; }
              else { u = v.x * 0.5 + 0.5; vv = v.y * 0.5 + 0.5; }
              uvs.push(u, vv);
              colors.push(r, g, b);
            }
            faceMap.push(fi);
          }
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geom.userData.faceMap = faceMap;
        geom.computeBoundingSphere();
        geom.computeBoundingBox();
        return geom;
      }

      // ---- Primitive Generators ----
      static createBox(w = 1, h = 1, d = 1, color = '#6b442a', materialId = 'aged_wood', ox = 0, oy = 0, oz = 0) {
        const hw = w / 2, hh = h / 2, hd = d / 2;
        const verts = [
          { x: ox - hw, y: oy - hh, z: oz + hd }, // 0
          { x: ox + hw, y: oy - hh, z: oz + hd }, // 1
          { x: ox + hw, y: oy + hh, z: oz + hd }, // 2
          { x: ox - hw, y: oy + hh, z: oz + hd }, // 3
          { x: ox - hw, y: oy - hh, z: oz - hd }, // 4
          { x: ox + hw, y: oy - hh, z: oz - hd }, // 5
          { x: ox + hw, y: oy + hh, z: oz - hd }, // 6
          { x: ox - hw, y: oy + hh, z: oz - hd }, // 7
        ];
        const faces = [
          { verts: [0, 1, 2, 3], color, materialId }, // front
          { verts: [5, 4, 7, 6], color, materialId }, // back
          { verts: [4, 0, 3, 7], color, materialId }, // left
          { verts: [1, 5, 6, 2], color, materialId }, // right
          { verts: [3, 2, 6, 7], color, materialId }, // top
          { verts: [4, 5, 1, 0], color, materialId }, // bottom
        ];
        return new EditableMesh(verts, faces);
      }

      static createCylinder(rTop = 0.5, rBot = 0.5, h = 1.2, segs = 8, color = '#6d7570', materialId = 'mossy_stone', ox = 0, oy = 0, oz = 0) {
        const verts = [];
        const faces = [];
        const hh = h / 2;
        for (let i = 0; i < segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          verts.push({ x: ox + Math.cos(a) * rBot, y: oy - hh, z: oz + Math.sin(a) * rBot });
        }
        for (let i = 0; i < segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          verts.push({ x: ox + Math.cos(a) * rTop, y: oy + hh, z: oz + Math.sin(a) * rTop });
        }
        // Sides
        for (let i = 0; i < segs; i++) {
          const n = (i + 1) % segs;
          faces.push({ verts: [i, n, segs + n, segs + i], color, materialId });
        }
        // Bottom & Top caps
        const botCap = [];
        const topCap = [];
        for (let i = 0; i < segs; i++) {
          botCap.push(segs - 1 - i);
          topCap.push(segs + i);
        }
        if (rBot > 0.001) faces.push({ verts: botCap, color, materialId });
        if (rTop > 0.001) faces.push({ verts: topCap, color, materialId });
        return new EditableMesh(verts, faces);
      }

      static createCone(r = 0.65, h = 1.4, segs = 7, color = '#2f6d65', materialId = 'autumn_leaf', ox = 0, oy = 0, oz = 0) {
        const verts = [];
        const faces = [];
        const hh = h / 2;
        for (let i = 0; i < segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          verts.push({ x: ox + Math.cos(a) * r, y: oy - hh, z: oz + Math.sin(a) * r });
        }
        const apex = verts.length;
        verts.push({ x: ox, y: oy + hh, z: oz });
        for (let i = 0; i < segs; i++) {
          const n = (i + 1) % segs;
          faces.push({ verts: [i, n, apex], color, materialId });
        }
        const bot = [];
        for (let i = segs - 1; i >= 0; i--) bot.push(i);
        faces.push({ verts: bot, color, materialId });
        return new EditableMesh(verts, faces);
      }

      static createLowPolySphere(r = 0.65, rings = 5, segs = 8, color = '#d97828', materialId = 'pumpkin', ox = 0, oy = 0, oz = 0) {
        const verts = [];
        const faces = [];
        const topIdx = 0;
        verts.push({ x: ox, y: oy + r, z: oz });
        for (let y = 1; y < rings; y++) {
          const phi = (y / rings) * Math.PI;
          const ry = Math.cos(phi) * r;
          const rr = Math.sin(phi) * r;
          for (let x = 0; x < segs; x++) {
            const theta = (x / segs) * Math.PI * 2;
            verts.push({ x: ox + Math.cos(theta) * rr, y: oy + ry, z: oz + Math.sin(theta) * rr });
          }
        }
        const botIdx = verts.length;
        verts.push({ x: ox, y: oy - r, z: oz });

        // Top fan
        for (let x = 0; x < segs; x++) {
          const n = (x + 1) % segs;
          faces.push({ verts: [topIdx, 1 + n, 1 + x], color, materialId });
        }
        // Middle quads
        for (let y = 0; y < rings - 2; y++) {
          const r0 = 1 + y * segs;
          const r1 = 1 + (y + 1) * segs;
          for (let x = 0; x < segs; x++) {
            const n = (x + 1) % segs;
            faces.push({ verts: [r0 + x, r0 + n, r1 + n, r1 + x], color, materialId });
          }
        }
        // Bottom fan
        const lastRow = 1 + (rings - 2) * segs;
        for (let x = 0; x < segs; x++) {
          const n = (x + 1) % segs;
          faces.push({ verts: [botIdx, lastRow + x, lastRow + n], color, materialId });
        }
        return new EditableMesh(verts, faces);
      }

      static createRoofPrism(w = 1.4, h = 0.9, d = 1.4, color = '#6d315c', materialId = 'velvet_plum') {
        const hw = w / 2, hh = h / 2, hd = d / 2;
        const verts = [
          { x: -hw, y: -hh, z: hd },
          { x: hw,  y: -hh, z: hd },
          { x: 0,   y: hh,  z: hd },
          { x: -hw, y: -hh, z: -hd },
          { x: hw,  y: -hh, z: -hd },
          { x: 0,   y: hh,  z: -hd },
        ];
        const faces = [
          { verts: [0, 1, 2], color, materialId },
          { verts: [4, 3, 5], color, materialId },
          { verts: [1, 4, 5, 2], color, materialId },
          { verts: [3, 0, 2, 5], color, materialId },
          { verts: [3, 4, 1, 0], color, materialId },
        ];
        return new EditableMesh(verts, faces);
      }
    }
