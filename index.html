<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14111f" />
  <meta name="apple-mobile-web-app-title" content="Polycraft Studio" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <title>Polycraft Studio — Stylized Low-Poly 3D Workshop</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #13101e;
      --bg-panel: rgba(24, 20, 38, 0.88);
      --bg-panel-solid: #1b162b;
      --bg-elevated: rgba(39, 33, 60, 0.92);
      --border-subtle: rgba(255, 240, 214, 0.11);
      --border-strong: rgba(245, 166, 35, 0.45);
      --accent-amber: #f5a623;
      --accent-amber-soft: rgba(245, 166, 35, 0.18);
      --accent-teal: #38d9c0;
      --accent-teal-soft: rgba(56, 217, 192, 0.16);
      --accent-coral: #ff6b6b;
      --text-main: #f6f1e7;
      --text-muted: #aba3be;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    input[type="text"], input[type="number"] {
      user-select: text;
      -webkit-user-select: text;
    }

    #viewport-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: radial-gradient(circle at 50% 42%, #241e3a 0%, #141021 72%, #0e0b18 100%);
    }

    #viewport-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #draw-overlay-wrap {
      position: fixed;
      inset: 0;
      z-index: 32;
      background: rgba(16, 12, 28, 0.36);
      touch-action: none;
    }
    #draw-overlay-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    #retro-dither-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      background-image: radial-gradient(rgba(0,0,0,0.34) 1px, transparent 0);
      background-size: 3px 3px;
      mix-blend-mode: multiply;
      z-index: 4;
    }
    #retro-dither-overlay.active {
      opacity: 0.7;
    }

    .glass-bar {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 28px rgba(5, 3, 14, 0.45);
    }

    .touch-btn {
      min-width: 38px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease, color 0.14s ease;
    }
    .touch-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .touch-btn:active {
      transform: scale(0.95);
    }
    .touch-btn.active {
      background: var(--accent-amber-soft);
      border-color: var(--border-strong);
      color: #ffd07a;
    }
    .touch-btn.teal-active {
      background: var(--accent-teal-soft);
      border-color: rgba(56, 217, 192, 0.55);
      color: #7df2df;
    }
    .touch-btn:disabled {
      opacity: 0.32;
      pointer-events: none;
    }

    .seg-pill {
      display: inline-flex;
      padding: 3px;
      border-radius: 14px;
      background: rgba(12, 9, 22, 0.65);
      border: 1px solid var(--border-subtle);
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .seg-pill::-webkit-scrollbar { display: none; }
    .seg-pill button {
      min-height: 34px;
      padding: 0 9px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .seg-pill button.active {
      background: var(--accent-amber);
      color: #1a1205;
      box-shadow: 0 2px 10px rgba(245, 166, 35, 0.35);
    }

    .studio-sheet {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      bottom: calc(74px + var(--safe-bottom));
      width: min(580px, calc(100vw - 20px));
      max-height: min(56dvh, 470px);
      border-radius: 20px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .studio-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .sheet-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    input[type="range"].poly-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
    }
    input[type="range"].poly-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-amber);
      border: 2px solid #1c162c;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    #context-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(76px + var(--safe-bottom));
      z-index: 18;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
      scrollbar-width: none;
      touch-action: pan-x;
      transition: bottom 0.2s ease, opacity 0.15s ease;
    }
    #context-bar::-webkit-scrollbar { display: none; }

    #toast-wrap {
      position: fixed;
      top: calc(68px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .toast-pill {
      background: rgba(22, 18, 36, 0.94);
      border: 1px solid rgba(245, 166, 35, 0.45);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: toastIn 0.18s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .swatch-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.16);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .swatch-btn.active, .swatch-btn:hover {
      transform: scale(1.1);
      border-color: #ffffff;
    }

    @media (max-width: 680px) {
      .hide-xs { display: none !important; }
      header.studio-header { flex-wrap: wrap !important; row-gap: 6px !important; }
      header.studio-header .header-modes { order: 3; width: 100%; max-width: 100% !important; display: flex; justify-content: center; }
      header.studio-header .header-modes .seg-pill { width: 100%; justify-content: space-between; }
      .seg-pill button { padding: 0 8px; font-size: 10.5px; flex: 1; justify-content: center; }
      .seg-pill button span { display: none; }
      #stats-chip { top: calc(112px + var(--safe-top)) !important; }
      #camera-popover { top: calc(112px + var(--safe-top)) !important; }
      #drag-hud { top: calc(114px + var(--safe-top)) !important; }
      nav .glass-bar { width: 100%; justify-content: space-between; padding: 5px 4px !important; gap: 0 !important; }
      nav .touch-btn { min-width: 0 !important; flex: 1 1 0%; padding: 4px 2px !important; min-height: 46px !important; }
      nav .touch-btn span { font-size: 9.5px !important; }
    }
  </style>
</head>
<body>
  <!-- 3D Viewport Container -->
  <div id="viewport-wrap">
    <canvas id="viewport-canvas"></canvas>
  </div>
  <div id="retro-dither-overlay"></div>

  <!-- Phase 2: 2D-to-3D Silhouette & Stroke Drawing Overlay -->
  <div id="draw-overlay-wrap" class="hidden">
    <canvas id="draw-overlay-canvas"></canvas>
    <div class="fixed top-3 left-1/2 -translate-x-1/2 glass-bar rounded-2xl px-3 py-2 flex items-center gap-2 z-40 max-w-[95vw]" style="top: calc(12px + var(--safe-top));">
      <div class="seg-pill">
        <button id="draw-kind-silhouette" class="active"><i data-lucide="pentagon" class="w-3.5 h-3.5"></i><span>Silhouette</span></button>
        <button id="draw-kind-stroke"><i data-lucide="pen-tool" class="w-3.5 h-3.5"></i><span>Stroke</span></button>
      </div>
      <span id="draw-hint" class="text-[11px] text-amber-100/90 hide-xs">Draw a closed shape with your finger</span>
      <button id="btn-draw-cancel" class="touch-btn !min-h-8 px-2.5 bg-white/10 text-xs">Cancel</button>
    </div>

    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 glass-bar rounded-2xl px-3.5 py-2.5 flex flex-wrap items-center justify-center gap-3 z-40 w-[min(540px,94vw)]" style="bottom: calc(16px + var(--safe-bottom));">
      <div class="flex items-center gap-2 text-xs">
        <span id="draw-param1-label" class="text-purple-100/80 font-semibold">Depth</span>
        <input id="draw-param1" type="range" class="poly-range w-24" min="0.1" max="1.4" step="0.05" value="0.45" />
        <span id="draw-param1-val" class="font-mono text-amber-300 w-8">0.45</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span id="draw-param2-label" class="text-purple-100/80 font-semibold">Style</span>
        <button id="draw-style-toggle" class="touch-btn active !min-h-8 px-2.5 text-xs">Pillow 3D</button>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-draw-clear" class="touch-btn !min-h-9 px-3 bg-white/10 text-xs">Clear</button>
        <button id="btn-draw-build" class="touch-btn active !min-h-9 px-3.5 bg-amber-500/25 text-xs font-bold">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>Create 3D Mesh
        </button>
      </div>
    </div>
  </div>

  <!-- Built-In 2D Texture Pad Modal (with UV Wireframe Guide) -->
  <div id="tex-pad-modal" class="fixed inset-0 z-40 hidden flex items-center justify-center p-3 bg-black/70 backdrop-blur-sm">
    <div class="glass-bar rounded-2xl w-full max-w-[440px] max-h-[92dvh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-white/10">
        <div>
          <div class="text-sm font-bold text-amber-100">2D Texture Pad</div>
          <div id="tex-pad-sub" class="text-[10.5px] text-purple-200/70">Draw directly on the UV atlas</div>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="btn-tex-uv" class="touch-btn teal-active !min-h-8 px-2.5 text-[11px]">UV Guide</button>
          <button id="btn-tex-done" class="touch-btn active !min-h-8 px-3 text-xs font-bold">Done</button>
        </div>
      </div>
      <div class="p-3 flex flex-col items-center gap-2.5 overflow-y-auto">
        <div class="relative w-full aspect-square max-w-[340px] rounded-xl overflow-hidden border border-white/20 bg-stone-900 touch-none">
          <canvas id="tex-pad-canvas" class="w-full h-full block touch-none cursor-crosshair"></canvas>
          <canvas id="tex-pad-uv" class="absolute inset-0 w-full h-full pointer-events-none opacity-45"></canvas>
        </div>
        <div class="w-full flex items-center justify-between gap-2">
          <div class="flex items-center gap-1">
            <button id="tp-tool-brush" class="touch-btn active !min-h-8 px-2.5 text-xs"><i data-lucide="brush" class="w-3.5 h-3.5"></i>Brush</button>
            <button id="tp-tool-eraser" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs"><i data-lucide="eraser" class="w-3.5 h-3.5"></i>Erase</button>
            <button id="tp-tool-pick" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs"><i data-lucide="pipette" class="w-3.5 h-3.5"></i>Pick</button>
          </div>
          <div class="flex items-center gap-1.5">
            <input id="tp-color" type="color" value="#f5a623" class="w-8 h-8 rounded-lg border border-white/20 bg-transparent cursor-pointer" title="Custom Color" />
            <input id="tp-size" type="range" class="poly-range w-20" min="2" max="42" step="1" value="10" />
          </div>
        </div>
        <div id="tp-swatches" class="w-full flex flex-wrap gap-1.5 justify-center"></div>
      </div>
    </div>
  </div>

  <!-- Top Navigation & Mode Bar -->
  <header class="studio-header fixed top-0 left-0 right-0 z-20 px-2 pt-2 flex items-center justify-between gap-1.5 pointer-events-none" style="padding-top: calc(10px + var(--safe-top));">
    <!-- Left: Brand + Undo/Redo -->
    <div class="glass-bar rounded-2xl px-1.5 py-1 flex items-center gap-0.5 pointer-events-auto shrink-0">
      <div class="flex items-center gap-2 pl-1.5 pr-1.5">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-stone-950 font-extrabold text-sm shadow">P</div>
        <div class="leading-tight hide-xs">
          <div class="text-xs font-extrabold tracking-tight text-amber-100">Polycraft Studio</div>
          <div id="project-status" class="text-[10px] text-purple-200/70">Autosaved</div>
        </div>
      </div>
      <div class="w-px h-6 bg-white/10 mx-0.5"></div>
      <button id="btn-undo" class="touch-btn px-1.5" title="Undo (Ctrl+Z)" disabled>
        <i data-lucide="undo-2" class="w-4 h-4"></i>
      </button>
      <button id="btn-redo" class="touch-btn px-1.5" title="Redo (Ctrl+Y)" disabled>
        <i data-lucide="redo-2" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Center: Selection & Artistic Mode Switcher -->
    <div class="header-modes glass-bar rounded-2xl p-1 pointer-events-auto max-w-[54vw]">
      <div class="seg-pill" role="tablist" aria-label="Editing Mode">
        <button id="mode-object" class="active" data-mode="object" title="Object Mode (1)">
          <i data-lucide="box" class="w-3.5 h-3.5"></i><span>Object</span>
        </button>
        <button id="mode-vertex" data-mode="vertex" title="Vertex Mode (2)">
          <i data-lucide="circle-dot" class="w-3.5 h-3.5"></i><span>Vert</span>
        </button>
        <button id="mode-edge" data-mode="edge" title="Edge Mode (3)">
          <i data-lucide="slash" class="w-3.5 h-3.5"></i><span>Edge</span>
        </button>
        <button id="mode-face" data-mode="face" title="Face Mode (4)">
          <i data-lucide="pentagon" class="w-3.5 h-3.5"></i><span>Face</span>
        </button>
        <button id="mode-sculpt" data-mode="sculpt" title="Low-Poly Clay Sculpt (5)">
          <i data-lucide="hand" class="w-3.5 h-3.5"></i><span>Sculpt</span>
        </button>
        <button id="mode-paint" data-mode="paint" title="Direct 3D Texture Paint (6)">
          <i data-lucide="brush" class="w-3.5 h-3.5"></i><span>Paint</span>
        </button>
        <button id="mode-rig" data-mode="rig" title="Character Rig & Puppet Pose (7)">
          <i data-lucide="bone" class="w-3.5 h-3.5"></i><span>Rig</span>
        </button>
      </div>
    </div>

    <!-- Right: Quick Toggles -->
    <div class="glass-bar rounded-2xl px-1 py-1 flex items-center gap-0.5 pointer-events-auto shrink-0">
      <button id="btn-symmetry" class="touch-btn px-1.5" title="X-Axis Symmetry Editing">
        <i data-lucide="flip-horizontal-2" class="w-4 h-4"></i><span class="hide-xs">Sym X</span>
      </button>
      <button id="btn-snap" class="touch-btn px-1.5" title="Grid Snap (0.25m)">
        <i data-lucide="magnet" class="w-4 h-4"></i>
      </button>
      <button id="btn-retro" class="touch-btn px-1.5" title="PS2 Retro Preview (Non-Destructive)">
        <i data-lucide="tv" class="w-4 h-4"></i><span class="hide-xs">PS2</span>
      </button>
      <button id="btn-camera-menu" class="touch-btn px-1.5" title="Camera & View Options">
        <i data-lucide="video" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Collapsible Camera & Preview Popover (Top Right) -->
  <div id="camera-popover" class="glass-bar fixed right-3 z-30 rounded-2xl p-3 w-64 hidden" style="top: calc(64px + var(--safe-top));">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-bold uppercase tracking-wider text-amber-200/90">Camera & Preview</span>
      <button id="btn-close-cam" class="touch-btn !min-w-7 !min-h-7 rounded-lg"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-1.5 mb-2.5">
      <button id="btn-proj-persp" class="touch-btn active !min-h-9 bg-white/5 text-xs">Perspective</button>
      <button id="btn-proj-ortho" class="touch-btn !min-h-9 bg-white/5 text-xs">Orthographic</button>
    </div>
    <div class="grid grid-cols-4 gap-1.5 mb-2.5">
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="front">Front</button>
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="side">Side</button>
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="top">Top</button>
      <button class="touch-btn !min-h-9 bg-white/5 text-xs" data-camview="back">Back</button>
    </div>
    <div class="grid grid-cols-2 gap-1.5 mb-3">
      <button id="btn-cam-focus" class="touch-btn !min-h-9 bg-white/5 text-xs"><i data-lucide="crosshair" class="w-3.5 h-3.5"></i>Focus</button>
      <button id="btn-fullscreen" class="touch-btn !min-h-9 bg-white/5 text-xs"><i data-lucide="maximize" class="w-3.5 h-3.5"></i>Fullscreen</button>
    </div>
    <div class="border-t border-white/10 pt-2.5 space-y-2">
      <div class="text-[11px] font-bold uppercase tracking-wider text-purple-200/70">Preview Effects (Non-Export)</div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">Wireframe Overlay</span>
        <button id="btn-wireframe" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Off</button>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">PS2 Low-Res + Fog</span>
        <button id="btn-retro-inner" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Off</button>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">Ink Outlines</span>
        <button id="btn-outlines" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Off</button>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-purple-100/90">Lighting Mood</span>
        <button id="btn-lighting-mood" class="touch-btn !min-h-8 px-2.5 bg-white/5 text-xs">Mansion</button>
      </div>
    </div>
  </div>

  <!-- Floating Transform Gizmo Mode + Axis Pill (Left side) -->
  <div id="transform-rail" class="glass-bar fixed left-2.5 top-1/2 -translate-y-1/2 z-15 rounded-2xl p-1.5 flex flex-col items-center gap-1">
    <button id="gizmo-move" class="touch-btn active !w-10 !h-10" data-gizmo="translate" title="Move (G)">
      <i data-lucide="move" class="w-4 h-4"></i>
    </button>
    <button id="gizmo-rotate" class="touch-btn !w-10 !h-10" data-gizmo="rotate" title="Rotate (R)">
      <i data-lucide="rotate-cw" class="w-4 h-4"></i>
    </button>
    <button id="gizmo-scale" class="touch-btn !w-10 !h-10" data-gizmo="scale" title="Scale (S)">
      <i data-lucide="maximize-2" class="w-4 h-4"></i>
    </button>
    <div class="w-6 h-px bg-white/10 my-0.5"></div>
