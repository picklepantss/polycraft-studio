          body.querySelector('#btn-weld-auto').addEventListener('click', () => {
            const obj = this.getSelectedObject(); if (!obj) return;
            obj.mesh.weldVertices([], 0.01); this.pushHistory('Auto Weld'); this.refreshAll(); this.toast('Welded duplicate vertices');
          });
        } else if (name === 'export') {
          title.textContent = 'Godot 4 Export & Project Backups';
          sub.textContent = 'glTF 2.0 (.glb) with Embedded PNG Textures';
          const val = GodotGLB.validateScene(this.state.objects, this.state.unitScale);
          const issuesHtml = val.issues.length
            ? val.issues.map(i => `<div class="text-[11px] ${i.level === 'error' ? 'text-rose-300' : 'text-amber-300'}">• ${i.text}</div>`).join('')
            : `<div class="text-[11px] text-emerald-300">✓ Ready for Godot 4 (${val.visibleCount} asset(s), ${val.totalTris} tris, ${val.texturedCount} PNG texture(s), ${val.riggedCount} skeleton(s), ${val.animClipCount} animation clip(s))</div>`;

          body.innerHTML = `
            <div class="bg-white/5 rounded-xl p-3 border border-white/10 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <label class="text-xs font-semibold text-purple-100">Project Name</label>
                <input id="inp-proj-name" type="text" value="${this.state.projectName}" class="bg-black/35 border border-white/15 rounded-lg px-2.5 py-1 text-xs text-white w-44" />
              </div>
              <div class="flex items-center justify-between gap-2">
                <label class="text-xs font-semibold text-purple-100">Godot Unit Scale</label>
                <select id="sel-unit-scale" class="bg-black/45 border border-white/15 rounded-lg px-2.5 py-1 text-xs text-white">
                  <option value="1" ${this.state.unitScale === 1 ? 'selected' : ''}>1.0x (1m Godot Standard)</option>
                  <option value="0.5" ${this.state.unitScale === 0.5 ? 'selected' : ''}>0.5x (Compact Props)</option>
                  <option value="2" ${this.state.unitScale === 2 ? 'selected' : ''}>2.0x (Large Architecture)</option>
                </select>
              </div>
              <div class="pt-1 border-t border-white/10">${issuesHtml}</div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button id="btn-export-glb" class="touch-btn active !min-h-11 bg-amber-500/20" ${val.ok ? '' : 'disabled'}><i data-lucide="download" class="w-4 h-4"></i><span>Export .GLB (Godot 4)</span></button>
              <button id="btn-import-glb" class="touch-btn !min-h-11 bg-white/5 border border-white/10"><i data-lucide="upload" class="w-4 h-4"></i><span>Import .GLB</span></button>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
              <button id="btn-backup-json" class="touch-btn !min-h-10 bg-white/5 border border-white/10 text-[11px]"><i data-lucide="hard-drive-download" class="w-3.5 h-3.5 text-teal-300"></i><span>Backup</span></button>
              <button id="btn-append-json" class="touch-btn teal-active !min-h-10 text-[11px] font-bold"><i data-lucide="package-plus" class="w-3.5 h-3.5"></i><span>Append .JSON</span></button>
              <button id="btn-restore-json" class="touch-btn !min-h-10 bg-white/5 border border-white/10 text-[11px]"><i data-lucide="folder-open" class="w-3.5 h-3.5 text-teal-300"></i><span>Restore</span></button>
            </div>
            <div class="bg-white/5 rounded-xl p-2.5 border border-white/10 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold uppercase tracking-wider text-amber-200/90">My Saved Projects</span>
                <div class="flex gap-1">
                  <button id="btn-proj-new" class="touch-btn !min-h-7 px-2 bg-white/10 text-[11px]">+ New</button>
                  <button id="btn-proj-dup" class="touch-btn !min-h-7 px-2 bg-white/10 text-[11px]">Save Copy</button>
                </div>
              </div>
              <div id="proj-library-list" class="space-y-1 max-h-32 overflow-y-auto text-xs text-purple-200/70">Loading projects...</div>
            </div>
          `;
          body.querySelector('#inp-proj-name').addEventListener('input', (e) => { this.state.projectName = e.target.value || 'Polycraft Project'; this.scheduleAutosave(); });
          body.querySelector('#sel-unit-scale').addEventListener('change', (e) => { this.state.unitScale = parseFloat(e.target.value); this.renderSheet('export'); });
          body.querySelector('#btn-export-glb').addEventListener('click', () => this.downloadGLB());
          body.querySelector('#btn-import-glb').addEventListener('click', () => document.getElementById('input-import-glb').click());
          body.querySelector('#btn-backup-json').addEventListener('click', () => this.downloadJSONBackup());
          body.querySelector('#btn-restore-json').addEventListener('click', () => document.getElementById('input-import-json').click());
          body.querySelector('#btn-append-json').addEventListener('click', () => document.getElementById('input-append-json').click());
          body.querySelector('#btn-proj-new').addEventListener('click', async () => {
            await StorageManager.saveProject(this.serializeScene());
            this.state.projectId = 'proj_' + Date.now();
            this.state.projectName = 'New Mansion Asset';
            this.state.objects = [];
            this.state.selectedObjectId = null;
            this.addPrimitive('box');
            await StorageManager.saveProject(this.serializeScene());
            this.renderSheet('export'); lucide.createIcons();
            this.toast('Started new project');
          });
          body.querySelector('#btn-proj-dup').addEventListener('click', async () => {
            await StorageManager.saveProject(this.serializeScene());
            this.state.projectId = 'proj_' + Date.now();
            this.state.projectName = this.state.projectName + ' Copy';
            await StorageManager.saveProject(this.serializeScene());
            this.renderSheet('export'); lucide.createIcons();
            this.toast('Saved project copy');
          });
          StorageManager.listProjects().then((projects) => {
            const listEl = body.querySelector('#proj-library-list');
            if (!listEl) return;
            if (!projects.length) { listEl.innerHTML = '<div class="text-[11px] text-purple-200/50 py-1">Current project will autosave here.</div>'; return; }
            listEl.innerHTML = '';
            for (const pr of projects) {
              const isCur = pr.id === this.state.projectId;
              const row = document.createElement('div');
              row.className = `flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg border ${isCur ? 'bg-amber-500/15 border-amber-400/40' : 'bg-black/25 border-white/10'}`;
              row.innerHTML = `
                <button class="flex-1 text-left truncate" data-open>
                  <div class="text-xs font-semibold text-white truncate">${pr.name || 'Untitled'} ${isCur ? '<span class="text-[10px] text-amber-300">(Active)</span>' : ''}</div>
                  <div class="text-[10px] text-purple-200/60">${(pr.objects || []).length} object(s)</div>
                </button>
                ${!isCur ? '<button class="touch-btn !min-w-7 !min-h-7 text-rose-300" data-del title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>' : ''}
              `;
              row.querySelector('[data-open]').addEventListener('click', () => {
                if (isCur) return;
                this.restoreScene(pr, true);
                this.viewport.focusSelected();
                this.closeSheet();
                this.toast(`Opened "${pr.name}"`);
              });
              const delBtn = row.querySelector('[data-del]');
              if (delBtn) delBtn.addEventListener('click', async () => {
                await StorageManager.deleteProject(pr.id);
                this.renderSheet('export'); lucide.createIcons();
                this.toast(`Deleted "${pr.name}"`);
              });
              listEl.appendChild(row);
            }
            lucide.createIcons();
          });
        }
      }

      downloadGLB() {
        try {
          for (const o of this.state.objects) {
            if (o.textureCanvas) o.textureDataUrl = o.textureCanvas.toDataURL('image/png');
          }
          const bytes = GodotGLB.exportGLB(this.state.objects, this.state.unitScale);
          const blob = new Blob([bytes], { type: 'model/gltf-binary' });
          const slug = this.state.projectName.toLowerCase().replace(/[^a-z0-9]+/g, '_') || 'polycraft_asset';
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = `${slug}.glb`; a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 1500);
          this.toast(`Exported ${slug}.glb (${(bytes.byteLength / 1024).toFixed(1)} KB)`);
        } catch (err) { this.toast('Export failed: ' + err.message); }
      }

      downloadJSONBackup() {
        const blob = new Blob([JSON.stringify(this.serializeScene(), null, 2)], { type: 'application/json' });
        const slug = this.state.projectName.toLowerCase().replace(/[^a-z0-9]+/g, '_') || 'polycraft_project';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = `${slug}.polycraft.json`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        this.toast(`Saved backup ${slug}.polycraft.json`);
      }

      bindUI() {
        document.querySelectorAll('.seg-pill button[data-mode]').forEach(btn => btn.addEventListener('click', () => this.setMode(btn.dataset.mode)));
        document.querySelectorAll('nav [data-sheet]').forEach(btn => btn.addEventListener('click', () => this.openSheet(btn.dataset.sheet)));
        document.getElementById('btn-dock-draw').addEventListener('click', () => this.openDrawOverlay('silhouette'));
        document.getElementById('btn-close-sheet').addEventListener('click', () => this.closeSheet());

        document.getElementById('btn-undo').addEventListener('click', () => {
          const res = this.history.undo();
          if (res) { this.restoreScene(res.snapshot, false); this.toast(`Undo: ${res.label}`); }
        });
        document.getElementById('btn-redo').addEventListener('click', () => {
          const res = this.history.redo();
          if (res) { this.restoreScene(res.snapshot, false); this.toast(`Redo: ${res.label}`); }
        });

        document.getElementById('btn-symmetry').addEventListener('click', (e) => {
          this.state.symmetryX = !this.state.symmetryX;
          e.currentTarget.classList.toggle('teal-active', this.state.symmetryX);
          this.viewport.applyPreviewSettings();
          this.toast(this.state.symmetryX ? 'X-Symmetry Editing ON' : 'X-Symmetry OFF');
        });
        document.getElementById('btn-snap').addEventListener('click', (e) => {
          this.state.snap = !this.state.snap;
          e.currentTarget.classList.toggle('active', this.state.snap);
          this.toast(this.state.snap ? 'Grid Snap ON (0.25m)' : 'Grid Snap OFF');
        });

        const toggleRetro = () => {
          this.state.preview.retro = !this.state.preview.retro;
          document.getElementById('btn-retro').classList.toggle('active', this.state.preview.retro);
          document.getElementById('btn-retro-inner').textContent = this.state.preview.retro ? 'On' : 'Off';
          document.getElementById('btn-retro-inner').classList.toggle('active', this.state.preview.retro);
          this.viewport.applyPreviewSettings();
          this.toast(this.state.preview.retro ? 'PS2 Retro Preview ON (Export unaffected)' : 'Standard Viewport');
        };
        document.getElementById('btn-retro').addEventListener('click', toggleRetro);
        document.getElementById('btn-retro-inner').addEventListener('click', toggleRetro);

        const camPop = document.getElementById('camera-popover');
        document.getElementById('btn-camera-menu').addEventListener('click', () => camPop.classList.toggle('hidden'));
        document.getElementById('btn-close-cam').addEventListener('click', () => camPop.classList.add('hidden'));
        document.getElementById('btn-proj-persp').addEventListener('click', () => {
          this.viewport.setProjection(false);
          document.getElementById('btn-proj-persp').classList.add('active');
          document.getElementById('btn-proj-ortho').classList.remove('active');
        });
        document.getElementById('btn-proj-ortho').addEventListener('click', () => {
          this.viewport.setProjection(true);
          document.getElementById('btn-proj-ortho').classList.add('active');
          document.getElementById('btn-proj-persp').classList.remove('active');
        });
        document.querySelectorAll('[data-camview]').forEach(b => b.addEventListener('click', () => this.viewport.setStandardView(b.dataset.camview)));
        document.getElementById('btn-cam-focus').addEventListener('click', () => this.viewport.focusSelected());
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
          else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
        });
        document.getElementById('btn-wireframe').addEventListener('click', (e) => {
          this.state.preview.wireframe = !this.state.preview.wireframe;
          e.currentTarget.textContent = this.state.preview.wireframe ? 'On' : 'Off';
          e.currentTarget.classList.toggle('active', this.state.preview.wireframe);
          this.viewport.syncScene();
        });
        document.getElementById('btn-outlines').addEventListener('click', (e) => {
          this.state.preview.outlines = !this.state.preview.outlines;
          e.currentTarget.textContent = this.state.preview.outlines ? 'On' : 'Off';
          e.currentTarget.classList.toggle('active', this.state.preview.outlines);
          this.viewport.applyPreviewSettings();
        });
        document.getElementById('btn-lighting-mood').addEventListener('click', (e) => {
          this.state.preview.mood = this.state.preview.mood === 'mansion' ? 'studio' : 'mansion';
          e.currentTarget.textContent = this.state.preview.mood === 'mansion' ? 'Mansion' : 'Studio';
          this.viewport.applyPreviewSettings();
        });

        document.querySelectorAll('#transform-rail [data-gizmo]').forEach(btn => btn.addEventListener('click', () => {
          this.state.gizmoMode = btn.dataset.gizmo;
          document.querySelectorAll('#transform-rail [data-gizmo]').forEach(b => b.classList.toggle('active', b === btn));
        }));
        document.querySelectorAll('#transform-rail [data-axis]').forEach(btn => btn.addEventListener('click', () => {
          this.state.axisLock = btn.dataset.axis;
          document.querySelectorAll('#transform-rail [data-axis]').forEach(b => b.classList.toggle('active', b === btn));
        }));

        document.getElementById('input-import-json').addEventListener('change', async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try { this.restoreScene(JSON.parse(await file.text()), true); this.viewport.focusSelected(); this.toast(`Restored ${file.name}`); this.closeSheet(); }
          catch { this.toast('Invalid project backup file'); }
          e.target.value = '';
        });

        document.getElementById('input-append-json').addEventListener('change', async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try {
            const count = this.appendSceneObjects(JSON.parse(await file.text()));
            if (!count) throw new Error('No objects');
            this.toast(`Appended ${count} editable asset(s) from ${file.name}`);
            this.closeSheet();
          } catch { this.toast('Invalid .polycraft.json asset file'); }
          e.target.value = '';
        });

        document.getElementById('input-import-glb').addEventListener('change', async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try {
            const items = GodotGLB.importGLB(await file.arrayBuffer());
            if (!items.length) throw new Error('No meshes found');
            for (const it of items) {
              const obj = this.createSceneObject(it.name, it.mesh, it.position);
              obj.rotation = it.rotation; obj.scale = it.scale;
              this.state.objects.push(obj); this.state.selectedObjectId = obj.id;
            }
            this.pushHistory('Import GLB'); this.refreshAll(); this.viewport.focusSelected();
            this.toast(`Imported ${items.length} mesh(es)`); this.closeSheet();
          } catch (err) { this.toast('GLB import error: ' + err.message); }
          e.target.value = '';
        });

        document.getElementById('input-import-tex').addEventListener('change', (e) => {
          const file = e.target.files[0]; const obj = this.getSelectedObject();
          if (!file || !obj) return;
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const c = this.ensureObjectTexture(obj, this.state.paint.res);
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
              obj.textureDataUrl = c.toDataURL('image/png');
              this.pushHistory('Import Texture'); this.refreshAll(); this.toast(`Applied ${file.name}`);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });

        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) document.getElementById('btn-redo').click();
            else document.getElementById('btn-undo').click();
          } else if (e.key === '1') this.setMode('object');
          else if (e.key === '2') this.setMode('vertex');
          else if (e.key === '3') this.setMode('edge');
          else if (e.key === '4') this.setMode('face');
          else if (e.key === '5') this.setMode('sculpt');
          else if (e.key === '6') this.setMode('paint');
          else if (e.key === '7') this.setMode('rig');
          else if (e.key.toLowerCase() === 'g') document.getElementById('gizmo-move').click();
          else if (e.key.toLowerCase() === 'r') document.getElementById('gizmo-rotate').click();
          else if (e.key.toLowerCase() === 's') document.getElementById('gizmo-scale').click();
          else if (e.key.toLowerCase() === 'e' && this.state.mode === 'face') this.runFaceOp('extrude');
          else if (e.key.toLowerCase() === 'f') this.viewport.focusSelected();
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.polycraft = new StudioApp();
    });

    // Register Offline Service Worker for iPhone PWA use
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
