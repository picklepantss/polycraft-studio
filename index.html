    // =========================================================================
    // 4B. PHASE 3: RIGGING ENGINE (17-Bone Humanoid Skeleton, Auto-Skinning, LBS, 2-Bone IK)
    // =========================================================================
    const RigEngine = {
      createHumanoidSkeleton(bounds) {
        const min = bounds.min, size = bounds.size, cx = bounds.center.x, cz = bounds.center.z;
        const H = Math.max(1.2, size.y);
        const W = Math.max(0.5, size.x);
        const y = (f) => min.y + H * f;
        const shX = Math.min(W * 0.24, H * 0.14);
        const armL = H * 0.16;
        const hipX = shX * 0.52;

        // World rest positions for 17 humanoid bones (Godot 4 Skeleton3D friendly)
        const worldPos = [
          { name: 'Hips',       parent: -1, p: [cx, y(0.48), cz] },                  // 0
          { name: 'Spine',      parent: 0,  p: [cx, y(0.58), cz] },                  // 1
          { name: 'Chest',      parent: 1,  p: [cx, y(0.70), cz] },                  // 2
          { name: 'Neck',       parent: 2,  p: [cx, y(0.78), cz] },                  // 3
          { name: 'Head',       parent: 3,  p: [cx, y(0.86), cz] },                  // 4
          { name: 'UpperArm_L', parent: 2,  p: [cx + shX, y(0.72), cz] },            // 5
          { name: 'Forearm_L',  parent: 5,  p: [cx + shX + armL, y(0.70), cz] },     // 6
          { name: 'Hand_L',     parent: 6,  p: [cx + shX + armL * 1.9, y(0.68), cz] },// 7
          { name: 'UpperArm_R', parent: 2,  p: [cx - shX, y(0.72), cz] },            // 8
          { name: 'Forearm_R',  parent: 8,  p: [cx - shX - armL, y(0.70), cz] },     // 9
          { name: 'Hand_R',     parent: 9,  p: [cx - shX - armL * 1.9, y(0.68), cz] },// 10
          { name: 'Thigh_L',    parent: 0,  p: [cx + hipX, y(0.45), cz] },           // 11
          { name: 'Shin_L',     parent: 11, p: [cx + hipX, y(0.24), cz] },           // 12
          { name: 'Foot_L',     parent: 12, p: [cx + hipX, y(0.05), cz + 0.05] },    // 13
          { name: 'Thigh_R',    parent: 0,  p: [cx - hipX, y(0.45), cz] },           // 14
          { name: 'Shin_R',     parent: 14, p: [cx - hipX, y(0.24), cz] },           // 15
          { name: 'Foot_R',     parent: 15, p: [cx - hipX, y(0.05), cz + 0.05] },    // 16
        ];

        return worldPos.map((b, idx) => {
          const pp = b.parent >= 0 ? worldPos[b.parent].p : [0, 0, 0];
          return {
            id: idx,
            name: b.name,
            parent: b.parent,
            restLocal: [+(b.p[0] - pp[0]).toFixed(4), +(b.p[1] - pp[1]).toFixed(4), +(b.p[2] - pp[2]).toFixed(4)],
            poseRot: [0, 0, 0]
          };
        });
      },

      computeMatrices(bones, usePose = true) {
        const worldMats = [];
        const worldPos = [];
        for (let i = 0; i < bones.length; i++) {
          const b = bones[i];
          const local = new THREE.Matrix4();
          const t = new THREE.Vector3(...b.restLocal);
          const q = usePose
            ? new THREE.Quaternion().setFromEuler(new THREE.Euler(b.poseRot[0], b.poseRot[1], b.poseRot[2], 'XYZ'))
            : new THREE.Quaternion();
          local.compose(t, q, new THREE.Vector3(1, 1, 1));
          const world = b.parent >= 0 ? worldMats[b.parent].clone().multiply(local) : local;
          worldMats.push(world);
          worldPos.push(new THREE.Vector3().setFromMatrixPosition(world));
        }
        return { worldMats, worldPos };
      },

      getInverseBindMatrices(bones) {
        const { worldMats } = this.computeMatrices(bones, false);
        return worldMats.map(m => m.clone().invert());
      },

      autoSkinMesh(mesh, bones, sharpness = 4.2) {
        const { worldPos } = this.computeMatrices(bones, false);
        // Build bone segments (bone -> first child or tip extension) for accurate capsule proximity
        const segs = bones.map((b, i) => {
          const a = worldPos[i];
          const childIdx = bones.findIndex(c => c.parent === i);
          let end;
          if (childIdx >= 0) end = worldPos[childIdx];
          else if (b.parent >= 0) end = a.clone().add(a.clone().sub(worldPos[b.parent]).multiplyScalar(0.45));
          else end = a.clone().add(new THREE.Vector3(0, 0.15, 0));
          return { a, b: end };
        });

        const distPtToSeg = (p, a, b) => {
          const ab = b.clone().sub(a);
          const l2 = ab.lengthSq();
          if (l2 < 1e-8) return p.distanceTo(a);
          const t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / l2));
          return p.distanceTo(a.clone().addScaledVector(ab, t));
        };

        const skinJoints = [];
        const skinWeights = [];
        for (const v of mesh.vertices) {
          const vp = new THREE.Vector3(v.x, v.y, v.z);
          const scored = [];
          for (let bi = 0; bi < bones.length; bi++) {
            const d = distPtToSeg(vp, segs[bi].a, segs[bi].b);
            const w = 1 / Math.pow(d + 0.04, sharpness);
            scored.push({ bi, w });
          }
          scored.sort((a, b) => b.w - a.w);
          const top = scored.slice(0, 4);
          let sum = top.reduce((acc, x) => acc + x.w, 0) || 1;
          skinJoints.push([top[0]?.bi || 0, top[1]?.bi || 0, top[2]?.bi || 0, top[3]?.bi || 0]);
          skinWeights.push([
            (top[0]?.w || 0) / sum, (top[1]?.w || 0) / sum,
            (top[2]?.w || 0) / sum, (top[3]?.w || 0) / sum
          ]);
        }
        mesh.skinJoints = skinJoints;
        mesh.skinWeights = skinWeights;
        this.normalizeSkinWeights(mesh);
      },

      normalizeSkinWeights(mesh) {
        if (!mesh.skinWeights) return;
        for (let i = 0; i < mesh.skinWeights.length; i++) {
          const w = mesh.skinWeights[i];
          const s = w[0] + w[1] + w[2] + w[3];
          if (s > 1e-6) { w[0] /= s; w[1] /= s; w[2] /= s; w[3] /= s; }
          else { w[0] = 1; w[1] = 0; w[2] = 0; w[3] = 0; }
        }
      },

      smoothSkinWeights(mesh, iterations = 1) {
        if (!mesh.skinJoints || !mesh.skinWeights) return;
        const neighbors = mesh.getVertexNeighbors();
        for (let it = 0; it < iterations; it++) {
          const nextJ = [], nextW = [];
          for (let i = 0; i < mesh.vertices.length; i++) {
            const map = new Map();
            const addVert = (vi, factor) => {
              const sj = mesh.skinJoints[vi], sw = mesh.skinWeights[vi];
              for (let k = 0; k < 4; k++) map.set(sj[k], (map.get(sj[k]) || 0) + sw[k] * factor);
            };
            addVert(i, 0.6);
            const nbs = neighbors[i];
            if (nbs && nbs.length) {
              const share = 0.4 / nbs.length;
              for (const ni of nbs) addVert(ni, share);
            }
            const sorted = Array.from(map.entries()).sort((a, b) => b[1] - a[1]).slice(0, 4);
            while (sorted.length < 4) sorted.push([0, 0]);
            const sum = sorted.reduce((a, x) => a + x[1], 0) || 1;
            nextJ.push(sorted.map(x => x[0]));
            nextW.push(sorted.map(x => x[1] / sum));
          }
          mesh.skinJoints = nextJ;
          mesh.skinWeights = nextW;
        }
        this.normalizeSkinWeights(mesh);
      },

      computePosedVertices(mesh, bones) {
        if (!mesh.skinJoints || !mesh.skinWeights || !bones || !bones.length) return null;
        const { worldMats } = this.computeMatrices(bones, true);
        const invBind = this.getInverseBindMatrices(bones);
        const skinMats = bones.map((_, i) => worldMats[i].clone().multiply(invBind[i]));

        const out = new Array(mesh.vertices.length);
        const vTmp = new THREE.Vector3();
        for (let i = 0; i < mesh.vertices.length; i++) {
          const rv = mesh.vertices[i];
          const sj = mesh.skinJoints[i], sw = mesh.skinWeights[i];
          let x = 0, y = 0, z = 0;
          for (let k = 0; k < 4; k++) {
            const w = sw[k];
            if (w < 1e-5) continue;
            vTmp.set(rv.x, rv.y, rv.z).applyMatrix4(skinMats[sj[k]]);
            x += vTmp.x * w; y += vTmp.y * w; z += vTmp.z * w;
          }
          out[i] = { x, y, z };
        }
        return out;
      },

      solveTwoBoneIK(bones, limb, targetLocal) {
        // Analytical 2-bone IK for touchscreen puppet hand/foot pulling
        const chains = {
          arm_l: { root: 5, mid: 6, tip: 7, bendAxis: 'y', bendSign: -1 },
          arm_r: { root: 8, mid: 9, tip: 10, bendAxis: 'y', bendSign: 1 },
          leg_l: { root: 11, mid: 12, tip: 13, bendAxis: 'x', bendSign: 1 },
          leg_r: { root: 14, mid: 15, tip: 16, bendAxis: 'x', bendSign: 1 },
        };
        const ch = chains[limb];
        if (!ch) return;
        const { worldPos } = this.computeMatrices(bones, false);
        const pRoot = worldPos[ch.root], pMid = worldPos[ch.mid], pTip = worldPos[ch.tip];
        const L1 = Math.max(0.05, pRoot.distanceTo(pMid));
        const L2 = Math.max(0.05, pMid.distanceTo(pTip));
        const toTarget = targetLocal.clone().sub(pRoot);
        const dist = Math.max(0.08, Math.min(L1 + L2 - 0.01, toTarget.length()));

        // Law of cosines for knee/elbow bend angle
        const cosKnee = Math.max(-1, Math.min(1, (L1 * L1 + L2 * L2 - dist * dist) / (2 * L1 * L2)));
        const bendAngle = (Math.PI - Math.acos(cosKnee)) * ch.bendSign;
        const cosHip = Math.max(-1, Math.min(1, (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist)));
        const hipOffset = Math.acos(cosHip);

        if (limb.startsWith('arm')) {
          const dir = toTarget.clone().normalize();
          const sideSign = limb === 'arm_l' ? 1 : -1;
          const rz = Math.atan2(dir.y, Math.abs(dir.x) + 0.01) * sideSign;
          const ry = Math.atan2(-dir.z, Math.abs(dir.x) + 0.01) * sideSign;
          bones[ch.root].poseRot = [0, ry + hipOffset * sideSign * 0.5, rz];
          bones[ch.mid].poseRot = [0, bendAngle, 0];
        } else {
          const dir = toTarget.clone().normalize();
          const rx = -Math.atan2(dir.z, -dir.y + 0.01) - hipOffset;
          const rz = Math.atan2(dir.x, -dir.y + 0.01) * 0.6;
          bones[ch.root].poseRot = [rx, 0, rz];
          bones[ch.mid].poseRot = [Math.abs(bendAngle), 0, 0];
        }
      },

      applyPresetPose(bones, preset) {
        for (const b of bones) b.poseRot = [0, 0, 0];
        if (preset === 'rest') return;
        if (preset === 'idle') {
          bones[1].poseRot = [0.06, 0.08, 0];
          bones[4].poseRot = [-0.05, -0.12, 0.06];
          bones[5].poseRot = [0.1, 0.15, -1.05]; bones[6].poseRot = [0, 0.35, -0.2];
          bones[8].poseRot = [0.1, -0.15, 1.05]; bones[9].poseRot = [0, -0.35, 0.2];
          bones[11].poseRot = [-0.08, 0, 0.06]; bones[12].poseRot = [0.14, 0, 0];
          bones[14].poseRot = [0.05, 0, -0.06]; bones[15].poseRot = [0.08, 0, 0];
        } else if (preset === 'point') {
          bones[2].poseRot = [0.08, -0.25, 0];
          bones[4].poseRot = [0, 0.25, 0];
          bones[5].poseRot = [0, 1.15, -0.08]; bones[6].poseRot = [0, 0.12, 0];
          bones[8].poseRot = [0.2, -0.2, 1.15]; bones[9].poseRot = [0, -0.6, 0];
        } else if (preset === 'spooked') {
          bones[1].poseRot = [-0.18, 0, 0];
          bones[4].poseRot = [-0.15, 0, 0.12];
          bones[5].poseRot = [-0.4, 0.3, 0.85]; bones[6].poseRot = [0, 0.9, 0.4];
          bones[8].poseRot = [-0.4, -0.3, -0.85]; bones[9].poseRot = [0, -0.9, -0.4];
          bones[11].poseRot = [-0.55, 0, 0.18]; bones[12].poseRot = [0.95, 0, 0];
          bones[14].poseRot = [-0.55, 0, -0.18]; bones[15].poseRot = [0.95, 0, 0];
        } else if (preset === 'sneak') {
          bones[0].poseRot = [0.18, 0, 0];
          bones[1].poseRot = [0.24, 0, 0];
          bones[4].poseRot = [-0.32, 0.18, 0];
          bones[5].poseRot = [0.4, 0.5, -0.65]; bones[6].poseRot = [0, 0.85, 0];
          bones[8].poseRot = [-0.3, -0.4, 0.75]; bones[9].poseRot = [0, -0.85, 0];
          bones[11].poseRot = [-0.65, 0, 0.05]; bones[12].poseRot = [1.05, 0, 0];
          bones[14].poseRot = [0.25, 0, -0.05]; bones[15].poseRot = [0.45, 0, 0];
        } else if (preset === 'wave') {
          bones[2].poseRot = [0, 0.1, -0.08];
          bones[4].poseRot = [0, -0.1, 0.12];
          bones[5].poseRot = [0, 0.15, 0.95]; bones[6].poseRot = [0, 0.1, 0.65];
          bones[8].poseRot = [0.1, -0.1, 1.15]; bones[9].poseRot = [0, -0.3, 0];
        }
      }
    };

    // =========================================================================
    // 4C. PHASE 3: CARTOON CHARACTER WORKSHOP (Expressive Early-2000s Silhouettes)
    // =========================================================================
    const CharacterWorkshop = {
      archetypes: {
        sleuth: { name: 'Shaggy Sleuth',  head: 1.05, torso: 0.86, shoulders: 0.92, limbs: 1.15, chunk: 0.96, hair: 'shaggy',    outfit: 'sweater', acc: 'none',     expr: 'smirk',      shirt: '#4ea363', pants: '#733f2d', hairCol: '#8c5327', skin: '#f5c79e' },
        leader: { name: 'Plucky Leader',  head: 0.98, torso: 1.10, shoulders: 1.24, limbs: 1.02, chunk: 1.05, hair: 'pompadour', outfit: 'varsity', acc: 'ascot',    expr: 'cheerful',   shirt: '#e6dfd0', pants: '#345d96', hairCol: '#dfa83c', skin: '#f7cba4' },
        brain:  { name: 'Bookish Brain',  head: 1.16, torso: 1.04, shoulders: 0.90, limbs: 0.88, chunk: 1.10, hair: 'bob',       outfit: 'sweater', acc: 'glasses',  expr: 'suspicious', shirt: '#e07b28', pants: '#783465', hairCol: '#5c341f', skin: '#f2c49c' },
        spooky: { name: 'Mansion Sleuth', head: 1.12, torso: 1.00, shoulders: 1.06, limbs: 1.00, chunk: 1.14, hair: 'beanie',    outfit: 'trench',  acc: 'backpack', expr: 'spooked',    shirt: '#6d3560', pants: '#303442', hairCol: '#2e313b', skin: '#ecc098' },
      },

      buildCharacter(params) {
        const mesh = new EditableMesh();
        const headS = params.head ?? 1.05;
        const torsoS = params.torso ?? 1.0;
        const shS = params.shoulders ?? 1.0;
        const limbS = params.limbs ?? 1.0;
        const chunk = params.chunk ?? 1.0;
        const skin = params.skin || '#f5c79e';
        const shirt = params.shirt || '#4ea363';
        const pants = params.pants || '#733f2d';
        const hairCol = params.hairCol || '#7a4924';

        const legH = 0.84 * limbS;
        const hipY = legH + 0.04;
        const torsoH = 0.62 * (0.86 + 0.14 * limbS);
        const neckY = hipY + torsoH;
        const headY = neckY + 0.25 * headS;
        const shX = 0.23 * shS;
        const hipX = 0.125 * torsoS;

        // 1. CONTINUOUS LOFTED TORSO + HIPS + NECK (Zero gaps, PS2 smooth silhouette!)
        const torsoRings = [
          { cx: 0, cy: hipY - 0.02,            cz: 0, rx: 0.23 * torsoS, rz: 0.155 * chunk }, // clean untucked shirt hem over pants
          { cx: 0, cy: hipY + 0.08,            cz: 0, rx: 0.21 * torsoS, rz: 0.145 * chunk }, // hips
          { cx: 0, cy: hipY + torsoH * 0.35,   cz: 0, rx: 0.18 * torsoS, rz: 0.13 * chunk }, // cartoon waist cinch
          { cx: 0, cy: hipY + torsoH * 0.78,   cz: 0, rx: 0.25 * shS,    rz: 0.16 * chunk }, // broad cartoon chest
          { cx: 0, cy: neckY - 0.02,           cz: 0, rx: 0.17 * shS,    rz: 0.12 * chunk }, // shoulders taper
          { cx: 0, cy: neckY + 0.02,           cz: 0, rx: 0.075 * chunk, rz: 0.075 * chunk },// collar
        ];
        // Map torso to Bottom-Left Outfit quadrant (u: 0.02..0.48, v: 0.02..0.48)
        mesh.mergeWith(EditableMesh.createLoftedShape(torsoRings, 10, shirt, 'fabric', [0.02, 0.48, 0.02, 0.48], true));

        // Optional trench coat flare
        if (params.outfit === 'trench') {
          const coatRings = [
            { cx: 0, cy: hipY - 0.30, cz: 0, rx: 0.31 * torsoS, rz: 0.22 * chunk },
            { cx: 0, cy: hipY + 0.04, cz: 0, rx: 0.22 * torsoS, rz: 0.15 * chunk },
          ];
          mesh.mergeWith(EditableMesh.createLoftedShape(coatRings, 10, shirt, 'fabric', [0.04, 0.46, 0.04, 0.32], true));
        }

        // Neck (Skin quadrant lower edge)
        const neckRings = [
          { cx: 0, cy: neckY - 0.02, cz: 0, rx: 0.072 * chunk, rz: 0.072 * chunk },
          { cx: 0, cy: neckY + 0.12, cz: 0, rx: 0.065 * chunk, rz: 0.065 * chunk },
        ];
        mesh.mergeWith(EditableMesh.createLoftedShape(neckRings, 8, skin, 'mansion_plaster', [0.05, 0.12, 0.52, 0.58], false));

        // 2. CONTINUOUS LOFTED FLARED CARTOON LEGS + CHUNKY SNEAKERS (Zero knee gaps!)
        [-1, 1].forEach(side => {
          const lx = side * hipX;
          const legRings = [
            { cx: lx, cy: 0.06,          cz: 0.02, rx: 0.105 * chunk, rz: 0.12 * chunk }, // chunky flared cuff (Scooby-Doo bell-bottoms!)
            { cx: lx, cy: legH * 0.25,   cz: 0.00, rx: 0.088 * chunk, rz: 0.095 * chunk },// lower calf
            { cx: lx, cy: legH * 0.52,   cz: 0.01, rx: 0.076 * chunk, rz: 0.080 * chunk },// knee joint
            { cx: lx, cy: legH * 0.78,   cz: 0.00, rx: 0.092 * chunk, rz: 0.095 * chunk },// upper thigh
            { cx: lx, cy: hipY + 0.01,   cz: 0.00, rx: 0.095 * chunk, rz: 0.095 * chunk },// tucks cleanly inside shirt hem
          ];
          // Map pants to Bottom-Right quadrant top 70% (u: 0.52..0.98, v: 0.16..0.48)
          mesh.mergeWith(EditableMesh.createLoftedShape(legRings, 8, pants, 'fabric', [0.52, 0.98, 0.16, 0.48], true));

          // Chunky rounded cartoon sneaker mapped to Bottom-Right quadrant bottom 28% (v: 0.01..0.14)
          const shoe = EditableMesh.createLowPolySphere(0.115 * chunk, 5, 8, '#2e313b', 'wrought_iron', lx, 0.075 * chunk, 0.07);
          for (const v of shoe.vertices) {
            v.z = 0.07 + (v.z - 0.07) * 1.48;
            if (v.y < 0.02) v.y = 0.0; // flat rubber sole on ground!
          }
          shoe.assignRegionUVs(0.54, 0.96, 0.01, 0.14);
          mesh.mergeWith(shoe);
        });

        // 3. CONTINUOUS LOFTED TAPERED ARMS + CHUNKY CARTOON HANDS (T-Pose, zero elbow gaps!)
        const armY = hipY + torsoH * 0.80;
        const armL = 0.56 * limbS;
        [-1, 1].forEach(side => {
          const segs = 8;
          const stations = [
            { x: shX * 0.85,        r: 0.095 * chunk, u: 0.04, v: 0.42 }, // shoulder blends cleanly into chest
            { x: shX + armL * 0.22, r: 0.082 * chunk, u: 0.24, v: 0.42 }, // upper sleeve
            { x: shX + armL * 0.48, r: 0.068 * chunk, u: 0.44, v: 0.42 }, // elbow
            { x: shX + armL * 0.78, r: 0.056 * chunk, u: 0.08, v: 0.54 }, // wrist
            { x: shX + armL * 0.96, r: 0.048 * chunk, u: 0.14, v: 0.54 }, // hand base
          ];
          const verts = [], faces = [];
          for (const st of stations) {
            for (let s = 0; s < segs; s++) {
              const a = (s / segs) * Math.PI * 2;
              verts.push({ x: side * st.x, y: armY + Math.cos(a) * st.r, z: Math.sin(a) * st.r });
            }
          }
          for (let r = 0; r < stations.length - 1; r++) {
            const isSleeve = r < 2;
            const uMin = isSleeve ? 0.04 : 0.04, uMax = isSleeve ? 0.44 : 0.14;
            const vMin = isSleeve ? 0.10 : 0.54, vMax = isSleeve ? 0.44 : 0.62;
            for (let s = 0; s < segs; s++) {
              const n = (s + 1) % segs;
              const quad = side > 0
                ? [r * segs + s, (r + 1) * segs + s, (r + 1) * segs + n, r * segs + n]
                : [r * segs + n, (r + 1) * segs + n, (r + 1) * segs + s, r * segs + s];
              faces.push({
                verts: quad, color: isSleeve ? shirt : skin, materialId: isSleeve ? 'fabric' : 'mansion_plaster',
                uvs: [[uMin, vMin], [uMax, vMin], [uMax, vMax], [uMin, vMax]]
              });
            }
          }
          mesh.mergeWith(new EditableMesh(verts, faces));

          // Chunky cartoon mitten hand
          const hand = EditableMesh.createLowPolySphere(0.082 * chunk, 4, 7, skin, 'mansion_plaster', side * (shX + armL * 1.04), armY, 0.01);
          hand.assignRegionUVs(0.04, 0.14, 0.54, 0.64);
          mesh.mergeWith(hand);
        });

        // 4. EXPRESSIVE SMOOTH SCULPTED CARTOON HEAD WITH DEDICATED FRONT-FACE UV MAPPING!
        const hRings = 7, hSegs = 12, hr = 0.255 * headS;
        const headVerts = [], headFaces = [];
        headVerts.push({ x: 0, y: headY + hr * 1.12, z: 0 });
        for (let r = 1; r < hRings; r++) {
          const phi = (r / hRings) * Math.PI;
          // Stylized cartoon head shape: wider cheeks/cranium, tapered expressive chin!
          const chinTaper = r > hRings * 0.6 ? 0.84 : 1.04;
          const ry = Math.cos(phi) * hr * 1.12;
          const rr = Math.sin(phi) * hr * chinTaper;
          for (let s = 0; s < hSegs; s++) {
            const theta = (s / hSegs) * Math.PI * 2;
            headVerts.push({ x: Math.sin(theta) * rr, y: headY + ry, z: Math.cos(theta) * rr * 1.05 });
          }
        }
        const botV = headVerts.length;
        headVerts.push({ x: 0, y: headY - hr * 1.05, z: 0.02 * headS });

        // Project front-facing vertices cleanly onto Top-Left Face Atlas Quadrant (u:0..0.5, v:0.5..1.0)!
        const headUV = (v) => {
          const nx = (v.x) / (hr * 1.15);
          const ny = (v.y - headY) / (hr * 1.15);
          if (v.z < -hr * 0.15) return [0.06, 0.92]; // back of head -> clean skin/hair edge
          const u = 0.25 + Math.max(-0.22, Math.min(0.22, nx * 0.22));
          const vv = 0.75 + Math.max(-0.23, Math.min(0.23, ny * 0.23));
          return [u, vv];
        };
        for (let s = 0; s < hSegs; s++) {
          const n = (s + 1) % hSegs;
          const vs = [0, 1 + s, 1 + n];
          headFaces.push({ verts: vs, color: skin, materialId: 'mansion_plaster', uvs: vs.map(vi => headUV(headVerts[vi])) });
        }
        for (let r = 0; r < hRings - 2; r++) {
          const r0 = 1 + r * hSegs, r1 = 1 + (r + 1) * hSegs;
          for (let s = 0; s < hSegs; s++) {
            const n = (s + 1) % hSegs;
            const vs = [r0 + s, r1 + s, r1 + n, r0 + n];
            headFaces.push({ verts: vs, color: skin, materialId: 'mansion_plaster', uvs: vs.map(vi => headUV(headVerts[vi])) });
          }
        }
        const lastRow = 1 + (hRings - 2) * hSegs;
        for (let s = 0; s < hSegs; s++) {
          const n = (s + 1) % hSegs;
          const vs = [botV, lastRow + n, lastRow + s];
          headFaces.push({ verts: vs, color: skin, materialId: 'mansion_plaster', uvs: vs.map(vi => headUV(headVerts[vi])) });
        }
        mesh.mergeWith(new EditableMesh(headVerts, headFaces));

        // Sculpted Cartoon Nose & Ears (mapped to warm skin highlight)
        const nose = EditableMesh.createLowPolySphere(0.048 * headS, 4, 6, skin, 'mansion_plaster', 0, headY - 0.02 * headS, hr * 1.06);
        for (const v of nose.vertices) v.z += (v.z - hr * 1.06) * 0.6;
        nose.assignRegionUVs(0.06, 0.14, 0.84, 0.92);
        mesh.mergeWith(nose);
        [-1, 1].forEach(side => {
          const ear = EditableMesh.createLowPolySphere(0.042 * headS, 4, 6, skin, 'mansion_plaster', side * hr * 0.88, headY - 0.02 * headS, -0.02);
          ear.assignRegionUVs(0.04, 0.12, 0.72, 0.82);
          mesh.mergeWith(ear);
        });

        // 5. EXPRESSIVE SWOOPY PS2 HAIRSTYLES (Mapped to Top-Right Hair Quadrant u:0.52..0.98, v:0.52..0.98)
        const hair = params.hair || 'shaggy';
        if (hair === 'shaggy') {
          // Fuller cartoon mop wrapping around top, sides, and back of head
          const mop = EditableMesh.createLoftedShape([
            { cx: 0, cy: headY - 0.10 * headS, cz: -0.09 * headS, rx: hr * 1.15, rz: hr * 0.92 },
            { cx: 0, cy: headY + 0.08 * headS, cz: -0.07 * headS, rx: hr * 1.22, rz: hr * 1.12 },
            { cx: 0, cy: headY + 0.24 * headS, cz: -0.03 * headS, rx: hr * 1.14, rz: hr * 1.12 },
            { cx: 0, cy: headY + 0.34 * headS, cz: -0.02 * headS, rx: hr * 0.65, rz: hr * 0.68 },
          ], 10, hairCol, 'aged_wood', [0.52, 0.98, 0.52, 0.98], true);
          mop.applyDeform('crooked', 0.14);
          mesh.mergeWith(mop);
          // Soft swoopy cartoon fringe above eyebrows
          [-0.10, 0.02, 0.12].forEach((bx, idx) => {
            const bang = EditableMesh.createCone(0.072 * headS, 0.15 * headS, 6, hairCol, 'aged_wood', bx * headS, headY + 0.25 * headS, 0.14 * headS);
            bang.applyDeform('bend', idx === 1 ? 0.4 : -0.3);
            bang.assignRegionUVs(0.55, 0.95, 0.55, 0.95);
            mesh.mergeWith(bang);
          });
        } else if (hair === 'bob') {
          const bob = EditableMesh.createLoftedShape([
            { cx: 0, cy: headY - 0.14 * headS, cz: -0.05 * headS, rx: hr * 1.18, rz: hr * 1.02 },
            { cx: 0, cy: headY + 0.08 * headS, cz: -0.04 * headS, rx: hr * 1.16, rz: hr * 1.08 },
            { cx: 0, cy: headY + 0.28 * headS, cz: -0.02 * headS, rx: hr * 0.88, rz: hr * 0.88 },
          ], 10, hairCol, 'aged_wood', [0.52, 0.98, 0.52, 0.98], true);
          mesh.mergeWith(bob);
        } else if (hair === 'pompadour') {
          const pomp = EditableMesh.createLowPolySphere(hr * 1.02, 5, 8, hairCol, 'tarnished_brass', 0, headY + 0.18 * headS, 0.04 * headS);
          for (const v of pomp.vertices) { v.z *= 1.38; v.y = headY + 0.18 * headS + (v.y - (headY + 0.18 * headS)) * 0.65; }
          pomp.assignRegionUVs(0.52, 0.98, 0.52, 0.98);
          mesh.mergeWith(pomp);
        } else if (hair === 'spiky') {
          for (let k = -2; k <= 2; k++) {
            const sp = EditableMesh.createCone(0.08 * headS, 0.26 * headS, 5, hairCol, 'aged_wood', k * 0.07 * headS, headY + 0.24 * headS, -0.03 * headS);
            sp.assignRegionUVs(0.54, 0.96, 0.54, 0.96);
            mesh.mergeWith(sp);
          }
        } else if (hair === 'beanie') {
          const bean = EditableMesh.createLoftedShape([
            { cx: 0, cy: headY + 0.08 * headS, cz: -0.02 * headS, rx: hr * 1.10, rz: hr * 1.12 },
            { cx: 0, cy: headY + 0.26 * headS, cz: -0.04 * headS, rx: hr * 0.88, rz: hr * 0.92 },
            { cx: 0, cy: headY + 0.34 * headS, cz: -0.05 * headS, rx: hr * 0.32, rz: hr * 0.32 },
          ], 10, '#d97828', 'pumpkin', [0.06, 0.44, 0.12, 0.42], true);
          mesh.mergeWith(bean);
        }

        // 6. Accessories
        if (params.acc === 'ascot') {
          const asc = EditableMesh.createCone(0.11 * chunk, 0.22, 6, '#d97828', 'pumpkin', 0, neckY - 0.06, 0.14 * chunk);
          asc.assignRegionUVs(0.54, 0.96, 0.08, 0.14);
          mesh.mergeWith(asc);
        } else if (params.acc === 'backpack') {
          const bp = EditableMesh.createBox(0.32 * torsoS, 0.40, 0.16 * chunk, '#6b442a', 'aged_wood', 0, hipY + torsoH * 0.52, -0.20 * chunk);
          bp.assignRegionUVs(0.54, 0.94, 0.20, 0.44);
          mesh.mergeWith(bp);
        }

        const bones = RigEngine.createHumanoidSkeleton(mesh.getBounds());
        RigEngine.autoSkinMesh(mesh, bones, 4.4);
        return { mesh, bones };
      }
    };

    // =========================================================================
    // 4D. PHASE 4: PUPPET ANIMATION ENGINE (Named Clips, Easing, 11 Starter Clips, Mirroring)
    // =========================================================================
    const AnimEngine = {
      starterNames: [
        'Walk', 'Run', 'Idle', 'Sit', 'Jump',
        'LookAround', 'Point', 'Talk', 'Laugh', 'Frightened', 'Sneak'
      ],

      emptyPose(boneCount = 17) {
        return Array.from({ length: boneCount }, () => [0, 0, 0]);
      },

      capturePose(bones) {
        return bones.map(b => [+b.poseRot[0].toFixed(4), +b.poseRot[1].toFixed(4), +b.poseRot[2].toFixed(4)]);
      },

      applyPose(bones, pose) {
        if (!pose) return;
        for (let i = 0; i < bones.length && i < pose.length; i++) {
          bones[i].poseRot = [pose[i][0], pose[i][1], pose[i][2]];
        }
      },

      mirrorPose(pose) {
        // Swaps Left (5,6,7 / 11,12,13) and Right (8,9,10 / 14,15,16) limbs with Y/Z sign flip
        const out = pose.map(r => [r[0], -r[1], -r[2]]);
        const pairs = [[5, 8], [6, 9], [7, 10], [11, 14], [12, 15], [13, 16]];
        for (const [l, r] of pairs) {
          if (pose[l] && pose[r]) {
            out[l] = [pose[r][0], -pose[r][1], -pose[r][2]];
            out[r] = [pose[l][0], -pose[l][1], -pose[l][2]];
          }
        }
        return out;
      },

      ease(t, mode = 'smooth') {
        const u = Math.max(0, Math.min(1, t));
        if (mode === 'linear') return u;
        if (mode === 'snappy') {
          // Expressive cartoon ease-in-out cubic with punchy anticipation
          return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
        }
        // Smoothstep
        return u * u * (3 - 2 * u);
      },

      sampleClip(clip, time) {
        if (!clip || !clip.keyframes || !clip.keyframes.length) return null;
        const kfs = clip.keyframes;
        if (kfs.length === 1) return kfs[0].pose.map(r => [...r]);
        const t = Math.max(0, Math.min(clip.duration, time));
        let k0 = kfs[0], k1 = kfs[kfs.length - 1];
        for (let i = 0; i < kfs.length - 1; i++) {
          if (t >= kfs[i].time && t <= kfs[i + 1].time) {
            k0 = kfs[i]; k1 = kfs[i + 1]; break;
          }
        }
        const span = Math.max(1e-5, k1.time - k0.time);
        const alpha = this.ease((t - k0.time) / span, clip.easing || 'smooth');
        const out = [];
        for (let i = 0; i < k0.pose.length; i++) {
          const a = k0.pose[i], b = k1.pose[i] || a;
          out.push([
            a[0] + (b[0] - a[0]) * alpha,
            a[1] + (b[1] - a[1]) * alpha,
            a[2] + (b[2] - a[2]) * alpha
          ]);
        }
        return out;
      },

      getPreviousKeyframePose(clip, time) {
        if (!clip || !clip.keyframes || clip.keyframes.length < 2) return null;
        let prev = clip.keyframes[0];
        for (const kf of clip.keyframes) {
          if (kf.time < time - 0.02) prev = kf;
        }
        return prev.pose;
      },

      setKeyframe(clip, time, pose) {
        const t = +Math.max(0, Math.min(clip.duration, time)).toFixed(2);
        const existing = clip.keyframes.find(k => Math.abs(k.time - t) < 0.03);
        const copy = pose.map(r => [+r[0].toFixed(4), +r[1].toFixed(4), +r[2].toFixed(4)]);
        if (existing) existing.pose = copy;
        else {
          clip.keyframes.push({ time: t, pose: copy });
          clip.keyframes.sort((a, b) => a.time - b.time);
        }
      },

      deleteKeyframeNear(clip, time) {
        if (clip.keyframes.length <= 1) return false;
        const idx = clip.keyframes.findIndex(k => Math.abs(k.time - time) < 0.06);
        if (idx >= 0) { clip.keyframes.splice(idx, 1); return true; }
        return false;
      },

    // =========================================================================
    // 5. HISTORY MANAGER (Undo / Redo Snapshot Stack)
    // =========================================================================
    class HistoryManager {
      constructor(limit = 50) {
        this.limit = limit;
        this.stack = [];
        this.index = -1;
      }
      push(snapshot, label = 'Edit') {
        if (this.index < this.stack.length - 1) this.stack = this.stack.slice(0, this.index + 1);
        this.stack.push({ data: JSON.stringify(snapshot), label });
        if (this.stack.length > this.limit) this.stack.shift();
        this.index = this.stack.length - 1;
      }
      canUndo() { return this.index > 0; }
      canRedo() { return this.index < this.stack.length - 1; }
      undo() {
        if (!this.canUndo()) return null;
        this.index--;
        return { snapshot: JSON.parse(this.stack[this.index].data), label: this.stack[this.index + 1].label };
      }
      redo() {
        if (!this.canRedo()) return null;
        this.index++;
        return { snapshot: JSON.parse(this.stack[this.index].data), label: this.stack[this.index].label };
      }
    }

    // =========================================================================
    // 6. STORAGE MANAGER (IndexedDB + Fallback)
    // =========================================================================
    const StorageManager = {
      DB_NAME: 'PolycraftStudioDB',
      STORE_NAME: 'projects',
      dbPromise: null,
      openDB() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve) => {
          try {
            if (!window.indexedDB) return resolve(null);
            const req = indexedDB.open(this.DB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(this.STORE_NAME)) db.createObjectStore(this.STORE_NAME, { keyPath: 'id' });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch { resolve(null); }
        });
        return this.dbPromise;
      },
      async saveProject(project) {
        const record = { ...project, updatedAt: Date.now() };
        const db = await this.openDB();
        if (db) {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.STORE_NAME, 'readwrite');
              tx.objectStore(this.STORE_NAME).put(record);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => resolve(false);
            } catch { resolve(false); }
          });
        }
        try { localStorage.setItem('polycraft_proj_' + record.id, JSON.stringify(record)); return true; }
        catch { return false; }
      },
      async listProjects() {
        const db = await this.openDB();
        if (db) {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.STORE_NAME, 'readonly');
              const req = tx.objectStore(this.STORE_NAME).getAll();
              req.onsuccess = () => resolve((req.result || []).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)));
              req.onerror = () => resolve([]);
            } catch { resolve([]); }
          });
        }
        const list = [];
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('polycraft_proj_')) list.push(JSON.parse(localStorage.getItem(k)));
          }
        } catch {}
        return list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      },
      async deleteProject(id) {
        const db = await this.openDB();
        if (db) {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.STORE_NAME, 'readwrite');
              tx.objectStore(this.STORE_NAME).delete(id);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => resolve(false);
            } catch { resolve(false); }
          });
        }
        try { localStorage.removeItem('polycraft_proj_' + id); return true; }
        catch { return false; }
      }
    };

    // =========================================================================
    // 7. GODOT 4 GLB 2.0 EXPORTER (WITH EMBEDDED PNG TEXTURES), IMPORTER & VALIDATOR
    // =========================================================================
    const GodotGLB = {
      dataUrlToUint8Array(dataUrl) {
        const base64 = dataUrl.split(',')[1];
        const binStr = (typeof atob === 'function')
          ? atob(base64)
          : Buffer.from(base64, 'base64').toString('binary');
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        return bytes;
      },

      validateScene(objects, unitScale = 1.0) {
        const issues = [];
        let totalTris = 0, visibleCount = 0, texturedCount = 0, riggedCount = 0, animClipCount = 0;

        for (const obj of objects) {
          if (!obj.visible) continue;
          visibleCount++;
          if (obj.textureDataUrl) texturedCount++;
          if (obj.rig && obj.rig.bones && obj.mesh.skinJoints && obj.mesh.skinWeights) {
            riggedCount++;
            if (obj.animations && obj.animations.length) animClipCount += obj.animations.length;
            if (obj.mesh.skinWeights.length !== obj.mesh.vertices.length) {
              issues.push({ level: 'error', text: `"${obj.name}" skin weights out of sync — tap Auto-Skin in Rig.` });
            }
          }
          const m = obj.mesh;
          if (!m.vertices.length || !m.faces.length) {
            issues.push({ level: 'error', text: `"${obj.name}" has no geometry.` });
            continue;
          }
          let degen = 0;
          for (let fi = 0; fi < m.faces.length; fi++) {
            const f = m.faces[fi];
            if (f.verts.length < 3) { degen++; continue; }
            const v0 = m.vertices[f.verts[0]], v1 = m.vertices[f.verts[1]], v2 = m.vertices[f.verts[2]];
            if (!v0 || !v1 || !v2) { degen++; continue; }
            const e1 = new THREE.Vector3(v1.x - v0.x, v1.y - v0.y, v1.z - v0.z);
            const e2 = new THREE.Vector3(v2.x - v0.x, v2.y - v0.y, v2.z - v0.z);
            if (e1.cross(e2).lengthSq() < 1e-10) degen++;
          }
          if (degen > 0) issues.push({ level: 'warn', text: `"${obj.name}" has ${degen} zero-area face(s).` });
          totalTris += m.getTriangleCount();
        }

        if (visibleCount === 0) issues.push({ level: 'error', text: 'No visible objects to export.' });
        if (totalTris > 25000) issues.push({ level: 'warn', text: `High polygon budget (${totalTris} tris) for PS2-era target.` });
        if (unitScale <= 0) issues.push({ level: 'error', text: 'Unit scale must be positive.' });

        return { ok: !issues.some(i => i.level === 'error'), totalTris, visibleCount, texturedCount, riggedCount, animClipCount, issues };
      },

      exportGLB(objects, unitScale = 1.0) {
        const visibleObjs = objects.filter(o => o.visible && o.mesh.faces.length > 0);
        if (!visibleObjs.length) throw new Error('No visible geometry to export.');

        const gltf = {
          asset: { version: '2.0', generator: 'Polycraft Studio 2.0 (Godot 4 Compatible)' },
          scene: 0,
          scenes: [{ name: 'PolycraftScene', nodes: [] }],
          nodes: [],
          meshes: [],
          materials: [],
          buffers: [],
          bufferViews: [],
          accessors: []
        };

        const binChunks = [];
        let binByteLength = 0;

        const appendBuffer = (typedArray, target) => {
          const pad = (4 - (binByteLength % 4)) % 4;
          if (pad > 0) { binChunks.push(new Uint8Array(pad)); binByteLength += pad; }
          const bytes = new Uint8Array(typedArray.buffer, typedArray.byteOffset, typedArray.byteLength);
          const byteOffset = binByteLength;
          binChunks.push(bytes);
          binByteLength += bytes.byteLength;
          const bvIndex = gltf.bufferViews.length;
          const bv = { buffer: 0, byteOffset, byteLength: bytes.byteLength };
          if (target) bv.target = target;
          gltf.bufferViews.push(bv);
          return bvIndex;
        };

        const matKeyMap = new Map();
        const getColorMaterialIndex = (colorHex, materialId) => {
          const preset = MaterialLib.presets.find(p => p.id === materialId) || MaterialLib.presets[0];
          const key = `${colorHex}_${preset.roughness}_${preset.metalness}`;
          if (matKeyMap.has(key)) return matKeyMap.get(key);
          const [r, g, b] = MaterialLib.hexToRgb01(colorHex);
          const toLin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
          const idx = gltf.materials.length;
          gltf.materials.push({
            name: `${preset.name}_${idx}`,
            pbrMetallicRoughness: {
              baseColorFactor: [toLin(r), toLin(g), toLin(b), 1.0],
              metallicFactor: preset.metalness,
              roughnessFactor: preset.roughness
            },
            doubleSided: false
          });
          matKeyMap.set(key, idx);
          return idx;
        };

        const addEmbeddedTextureMaterial = (name, dataUrl) => {
          const pngBytes = this.dataUrlToUint8Array(dataUrl);
          const imgBV = appendBuffer(pngBytes, undefined);
          if (!gltf.images) gltf.images = [];
          if (!gltf.samplers) gltf.samplers = [{ magFilter: 9728, minFilter: 9985, wrapS: 10497, wrapT: 10497 }]; // crisp stylized filtering
          if (!gltf.textures) gltf.textures = [];
          const imgIdx = gltf.images.length;
          gltf.images.push({ bufferView: imgBV, mimeType: 'image/png', name: `${name}_tex` });
          const texIdx = gltf.textures.length;
          gltf.textures.push({ sampler: 0, source: imgIdx });
          const matIdx = gltf.materials.length;
          gltf.materials.push({
            name: `${name}_PaintedMat`,
            pbrMetallicRoughness: {
              baseColorTexture: { index: texIdx },
              metallicFactor: 0.05,
              roughnessFactor: 0.85
            },
            doubleSided: false
          });
          return matIdx;
        };

        for (const obj of visibleObjs) {
          const m = obj.mesh;
          const { min, size } = m.getBounds();
          const sx = Math.max(size.x, 0.01), sy = Math.max(size.y, 0.01), sz = Math.max(size.z, 0.01);
          const smoothNormals = obj.flatShading ? null : m.computeVertexNormals();

          const groups = new Map();
          const texturedMatIdx = obj.textureDataUrl ? addEmbeddedTextureMaterial(obj.name, obj.textureDataUrl) : -1;

          for (let fi = 0; fi < m.faces.length; fi++) {
            const f = m.faces[fi];
            if (f.verts.length < 3) continue;
            const matIdx = texturedMatIdx >= 0 ? texturedMatIdx : getColorMaterialIndex(f.color || '#6b442a', f.materialId || 'aged_wood');
            if (!groups.has(matIdx)) groups.set(matIdx, []);
            groups.get(matIdx).push(fi);
          }

          const hasSkin = !!(obj.rig && obj.rig.bones && obj.rig.bones.length && m.skinJoints && m.skinWeights && m.skinWeights.length === m.vertices.length);
          const primitives = [];
          for (const [matIdx, faceIndices] of groups.entries()) {
            const pos = [], norm = [], uv = [], joints = [], weights = [];
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

            for (const fi of faceIndices) {
              const f = m.faces[fi];
              const fn = m.computeFaceNormal(fi);
              const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);
              for (let i = 1; i < f.verts.length - 1; i++) {
                const triIdx = [0, i, i + 1];
                for (const ci of triIdx) {
                  const vi = f.verts[ci];
                  const v = m.vertices[vi];
                  const px = v.x * unitScale, py = v.y * unitScale, pz = v.z * unitScale;
                  pos.push(px, py, pz);
                  if (px < minX) minX = px; if (py < minY) minY = py; if (pz < minZ) minZ = pz;
                  if (px > maxX) maxX = px; if (py > maxY) maxY = py; if (pz > maxZ) maxZ = pz;
                  const n = obj.flatShading ? fn : smoothNormals[vi];
                  norm.push(n.x, n.y, n.z);

                  if (f.uvs && f.uvs[ci]) {
                    uv.push(f.uvs[ci][0], 1 - f.uvs[ci][1]);
                  } else {
                    let u = 0, vv = 0;
                    if (ay >= ax && ay >= az) { u = (v.x - min.x) / sx; vv = (v.z - min.z) / sz; }
                    else if (ax >= ay && ax >= az) { u = (v.z - min.z) / sz; vv = (v.y - min.y) / sy; }
                    else { u = (v.x - min.x) / sx; vv = (v.y - min.y) / sy; }
                    uv.push(Math.max(0, Math.min(1, u)), 1 - Math.max(0, Math.min(1, vv)));
                  }

                  if (hasSkin) {
                    const sj = m.skinJoints[vi], sw = m.skinWeights[vi];
                    joints.push(sj[0], sj[1], sj[2], sj[3]);
                    weights.push(sw[0], sw[1], sw[2], sw[3]);
                  }
                }
              }
            }

            const vertCount = pos.length / 3;
            if (!vertCount) continue;
            const posBV = appendBuffer(new Float32Array(pos), 34962);
            const normBV = appendBuffer(new Float32Array(norm), 34962);
            const uvBV = appendBuffer(new Float32Array(uv), 34962);

            const posAcc = gltf.accessors.length;
            gltf.accessors.push({ bufferView: posBV, componentType: 5126, count: vertCount, type: 'VEC3', min: [minX, minY, minZ], max: [maxX, maxY, maxZ] });
            const normAcc = gltf.accessors.length;
            gltf.accessors.push({ bufferView: normBV, componentType: 5126, count: vertCount, type: 'VEC3' });
            const uvAcc = gltf.accessors.length;
            gltf.accessors.push({ bufferView: uvBV, componentType: 5126, count: vertCount, type: 'VEC2' });

            const attrs = { POSITION: posAcc, NORMAL: normAcc, TEXCOORD_0: uvAcc };
            if (hasSkin) {
              const jBV = appendBuffer(new Uint16Array(joints), 34962);
              const wBV = appendBuffer(new Float32Array(weights), 34962);
              const jAcc = gltf.accessors.length;
              gltf.accessors.push({ bufferView: jBV, componentType: 5123, count: vertCount, type: 'VEC4' });
              const wAcc = gltf.accessors.length;
              gltf.accessors.push({ bufferView: wBV, componentType: 5126, count: vertCount, type: 'VEC4' });
              attrs.JOINTS_0 = jAcc;
              attrs.WEIGHTS_0 = wAcc;
            }
            primitives.push({ attributes: attrs, material: matIdx, mode: 4 });
          }

          if (!primitives.length) continue;
          const meshIdx = gltf.meshes.length;
          gltf.meshes.push({ name: obj.name, primitives });

          const euler = new THREE.Euler(obj.rotation.x, obj.rotation.y, obj.rotation.z, 'XYZ');
          const quat = new THREE.Quaternion().setFromEuler(euler);
          const nodeIdx = gltf.nodes.length;
          const meshNode = {
            name: obj.name,
            mesh: meshIdx,
            translation: [obj.position.x * unitScale, obj.position.y * unitScale, obj.position.z * unitScale],
            rotation: [quat.x, quat.y, quat.z, quat.w],
            scale: [obj.scale.x, obj.scale.y, obj.scale.z]
          };
          gltf.nodes.push(meshNode);

          if (hasSkin) {
            if (!gltf.skins) gltf.skins = [];
            const bones = obj.rig.bones;
            const boneNodeStart = gltf.nodes.length;
            const jointNodeIndices = [];
            for (let bi = 0; bi < bones.length; bi++) {
              const b = bones[bi];
              const bNodeIdx = boneNodeStart + bi;
              jointNodeIndices.push(bNodeIdx);
              const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(b.poseRot[0], b.poseRot[1], b.poseRot[2], 'XYZ'));
              gltf.nodes.push({
                name: b.name,
                translation: [b.restLocal[0] * unitScale, b.restLocal[1] * unitScale, b.restLocal[2] * unitScale],
                rotation: [q.x, q.y, q.z, q.w],
                children: []
              });
            }
            // Wire parent -> children bone hierarchy
            for (let bi = 0; bi < bones.length; bi++) {
              const p = bones[bi].parent;
              if (p >= 0) gltf.nodes[boneNodeStart + p].children.push(boneNodeStart + bi);
            }
            for (let bi = 0; bi < bones.length; bi++) {
              if (!gltf.nodes[boneNodeStart + bi].children.length) delete gltf.nodes[boneNodeStart + bi].children;
            }
            // Compute scaled inverseBindMatrices (column-major Float32 MAT4)
            const scaledBones = bones.map(b => ({ ...b, restLocal: [b.restLocal[0] * unitScale, b.restLocal[1] * unitScale, b.restLocal[2] * unitScale] }));
            const invMats = RigEngine.getInverseBindMatrices(scaledBones);
            const ibmArr = new Float32Array(bones.length * 16);
            invMats.forEach((mat, i) => ibmArr.set(mat.elements, i * 16));
            const ibmBV = appendBuffer(ibmArr, undefined);
            const ibmAcc = gltf.accessors.length;
            gltf.accessors.push({ bufferView: ibmBV, componentType: 5126, count: bones.length, type: 'MAT4' });

            const skinIdx = gltf.skins.length;
            gltf.skins.push({ name: `${obj.name}_Skeleton`, inverseBindMatrices: ibmAcc, joints: jointNodeIndices, skeleton: boneNodeStart });
            meshNode.skin = skinIdx;
            // Wrap mesh + root bone under an Armature parent node for clean Godot 4 Skeleton3D hierarchy
            const armNodeIdx = gltf.nodes.length;
            gltf.nodes.push({ name: `${obj.name}_Armature`, children: [nodeIdx, boneNodeStart] });
            gltf.scenes[0].nodes.push(armNodeIdx);

            // Export all named skeletal animation clips as glTF 2.0 animations[] for Godot 4 AnimationPlayer!
            if (obj.animations && obj.animations.length) {
              if (!gltf.animations) gltf.animations = [];
              for (const clip of obj.animations) {
                if (!clip.keyframes || !clip.keyframes.length) continue;
                const kfs = [...clip.keyframes].sort((a, b) => a.time - b.time);
                const times = new Float32Array(kfs.map(k => k.time));
                const timeBV = appendBuffer(times, undefined);
                const timeAcc = gltf.accessors.length;
                gltf.accessors.push({
                  bufferView: timeBV, componentType: 5126, count: times.length, type: 'SCALAR',
                  min: [times[0]], max: [times[times.length - 1]]
                });

                const samplers = [];
                const channels = [];
                for (let bi = 0; bi < bones.length; bi++) {
                  const quats = new Float32Array(kfs.length * 4);
                  for (let ki = 0; ki < kfs.length; ki++) {
                    const rot = kfs[ki].pose[bi] || [0, 0, 0];
                    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rot[0], rot[1], rot[2], 'XYZ'));
                    quats[ki * 4] = q.x; quats[ki * 4 + 1] = q.y; quats[ki * 4 + 2] = q.z; quats[ki * 4 + 3] = q.w;
                  }
                  const qBV = appendBuffer(quats, undefined);
                  const qAcc = gltf.accessors.length;
                  gltf.accessors.push({ bufferView: qBV, componentType: 5126, count: kfs.length, type: 'VEC4' });
                  const sIdx = samplers.length;
                  samplers.push({ input: timeAcc, output: qAcc, interpolation: 'LINEAR' });
                  channels.push({ sampler: sIdx, target: { node: boneNodeStart + bi, path: 'rotation' } });
                }
                gltf.animations.push({ name: clip.name || 'Clip', samplers, channels });
              }
            }
          } else {
            gltf.scenes[0].nodes.push(nodeIdx);
          }
        }

        const binPad = (4 - (binByteLength % 4)) % 4;
        if (binPad > 0) { binChunks.push(new Uint8Array(binPad)); binByteLength += binPad; }
        gltf.buffers.push({ byteLength: binByteLength });

        const jsonRaw = new TextEncoder().encode(JSON.stringify(gltf));
        const jsonPad = (4 - (jsonRaw.byteLength % 4)) % 4;
        const jsonLength = jsonRaw.byteLength + jsonPad;
        const totalLength = 12 + 8 + jsonLength + 8 + binByteLength;
        const out = new ArrayBuffer(totalLength);
        const dv = new DataView(out);
        const u8 = new Uint8Array(out);

        dv.setUint32(0, 0x46546C67, true);
        dv.setUint32(4, 2, true);
        dv.setUint32(8, totalLength, true);
        dv.setUint32(12, jsonLength, true);
        dv.setUint32(16, 0x4E4F534A, true);
        u8.set(jsonRaw, 20);
        for (let i = 0; i < jsonPad; i++) u8[20 + jsonRaw.byteLength + i] = 0x20;

        const binStart = 20 + jsonLength;
        dv.setUint32(binStart, binByteLength, true);
        dv.setUint32(binStart + 4, 0x004E4942, true);
        let cursor = binStart + 8;
        for (const chunk of binChunks) { u8.set(chunk, cursor); cursor += chunk.byteLength; }
        return new Uint8Array(out);
      },

      importGLB(arrayBuffer) {
        const dv = new DataView(arrayBuffer);
        if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('Invalid GLB file header.');
        const jsonLen = dv.getUint32(12, true);
        const gltf = JSON.parse(new TextDecoder().decode(new Uint8Array(arrayBuffer, 20, jsonLen)));
        const binOffset = 20 + jsonLen + 8;

        const imported = [];
        for (const node of gltf.nodes || []) {
          if (node.mesh === undefined) continue;
          const gMesh = gltf.meshes[node.mesh];
          const editable = new EditableMesh();
          for (const prim of gMesh.primitives || []) {
            if (prim.attributes.POSITION === undefined) continue;
            const posAcc = gltf.accessors[prim.attributes.POSITION];
            const posBV = gltf.bufferViews[posAcc.bufferView];
            const posArr = new Float32Array(arrayBuffer, binOffset + (posBV.byteOffset || 0) + (posAcc.byteOffset || 0), posAcc.count * 3);
            let hex = '#8b7e96';
            if (prim.material !== undefined && gltf.materials && gltf.materials[prim.material]) {
              const bcf = gltf.materials[prim.material].pbrMetallicRoughness?.baseColorFactor;
              if (bcf) {
                const toSrgb = c => Math.round(Math.min(1, Math.max(0, Math.pow(c, 1 / 2.2))) * 255);
                hex = '#' + [toSrgb(bcf[0]), toSrgb(bcf[1]), toSrgb(bcf[2])].map(x => x.toString(16).padStart(2, '0')).join('');
              }
            }
            const baseV = editable.vertices.length;
            for (let i = 0; i < posAcc.count; i++) editable.vertices.push({ x: posArr[i * 3], y: posArr[i * 3 + 1], z: posArr[i * 3 + 2] });
            if (prim.indices !== undefined) {
              const idxAcc = gltf.accessors[prim.indices];
              const idxBV = gltf.bufferViews[idxAcc.bufferView];
              const idxStart = binOffset + (idxBV.byteOffset || 0) + (idxAcc.byteOffset || 0);
              const idxArr = idxAcc.componentType === 5125 ? new Uint32Array(arrayBuffer, idxStart, idxAcc.count) : new Uint16Array(arrayBuffer, idxStart, idxAcc.count);
              for (let i = 0; i < idxArr.length; i += 3) editable.faces.push({ verts: [baseV + idxArr[i], baseV + idxArr[i + 1], baseV + idxArr[i + 2]], color: hex, materialId: 'aged_wood' });
            } else {
              for (let i = 0; i < posAcc.count; i += 3) editable.faces.push({ verts: [baseV + i, baseV + i + 1, baseV + i + 2], color: hex, materialId: 'aged_wood' });
            }
          }
          editable.weldVertices([], 0.0005);
          const t = node.translation || [0, 0, 0];
          const s = node.scale || [1, 1, 1];
          let rot = { x: 0, y: 0, z: 0 };
          if (node.rotation) {
            const e = new THREE.Euler().setFromQuaternion(new THREE.Quaternion(...node.rotation), 'XYZ');
            rot = { x: e.x, y: e.y, z: e.z };
          }
          imported.push({ name: node.name || gMesh.name || 'Imported Asset', mesh: editable, position: { x: t[0], y: t[1], z: t[2] }, rotation: rot, scale: { x: s[0], y: s[1], z: s[2] } });
        }
        return imported;
      }
    };

    // =========================================================================
    // 8. VIEWPORT ENGINE (Three.js + Sculpting + Direct 3D Texture Paint)
    // =========================================================================
    class ViewportEngine {
      constructor(canvas, app) {
        this.canvas = canvas;
        this.app = app;

        this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.outputEncoding = THREE.sRGBEncoding;

        this.scene = new THREE.Scene();
        this.perspCam = new THREE.PerspectiveCamera(45, 1, 0.05, 150);
        this.orthoCam = new THREE.OrthographicCamera(-4, 4, 4, -4, -50, 100);
        this.isOrtho = false;
        this.camera = this.perspCam;

        this.camTarget = new THREE.Vector3(0, 1.05, 0);
        this.camSpherical = { radius: 5.2, theta: 0.62, phi: 1.18 };
        this.updateCameraTransform();

        this.setupLights();
        this.setupGrid();

        this.objectGroup = new THREE.Group();
        this.scene.add(this.objectGroup);
        this.overlayGroup = new THREE.Group();
        this.scene.add(this.overlayGroup);
        this.gizmoGroup = new THREE.Group();
        this.scene.add(this.gizmoGroup);
        this.buildGizmo();

        this.meshEntries = new Map();
        this.ikHandles = [];
        this.lastFrameTime = performance.now();
        this.raycaster = new THREE.Raycaster();
        this.pointers = new Map();
        this.gesture = null;
        this.bindPointerEvents();

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate();
      }

      setupLights() {
        this.hemiLight = new THREE.HemisphereLight(0xd8c8ff, 0x2d2438, 0.72);
        this.scene.add(this.hemiLight);
        this.keyLight = new THREE.DirectionalLight(0xffdfb8, 1.15);
        this.keyLight.position.set(5, 8, 6);
        this.keyLight.castShadow = true;
        this.keyLight.shadow.mapSize.set(1024, 1024);
        this.keyLight.shadow.bias = -0.0005;
        this.scene.add(this.keyLight);
        this.rimLight = new THREE.DirectionalLight(0x4de0cb, 0.55);
        this.rimLight.position.set(-5, 4, -5);
        this.scene.add(this.rimLight);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.28 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        this.scene.add(ground);
      }

      setupGrid() {
        this.grid = new THREE.GridHelper(16, 32, 0x6b5b95, 0x2d2542);
        this.grid.material.transparent = true;
        this.grid.material.opacity = 0.55;
        this.scene.add(this.grid);

        this.symPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(0.02, 6),
          new THREE.MeshBasicMaterial({ color: 0x38d9c0, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
        );
        this.symPlane.rotation.x = -Math.PI / 2;
        this.symPlane.position.y = 0.005;
        this.symPlane.visible = false;
        this.scene.add(this.symPlane);
      }

      buildGizmo() {
        const axes = [
          { name: 'x', color: 0xff5f7e, rot: [0, 0, -Math.PI / 2] },
          { name: 'y', color: 0x4be39a, rot: [0, 0, 0] },
          { name: 'z', color: 0x56b4ff, rot: [Math.PI / 2, 0, 0] },
        ];
        this.gizmoHandles = [];
        for (const a of axes) {
          const holder = new THREE.Group();
          const mat = new THREE.MeshBasicMaterial({ color: a.color, depthTest: false, transparent: true, opacity: 0.92 });
          const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.78, 8), mat);
          shaft.position.y = 0.39;
          const tip = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 10), mat);
          tip.position.y = 0.86;
          const hit = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.05, 6), new THREE.MeshBasicMaterial({ visible: false }));
          hit.position.y = 0.52;
          hit.userData.gizmoAxis = a.name;
          holder.add(shaft, tip, hit);
          holder.rotation.set(...a.rot);
          this.gizmoGroup.add(holder);
          this.gizmoHandles.push(hit);
        }
        const centerBall = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 10), new THREE.MeshBasicMaterial({ color: 0xf5a623, depthTest: false }));
        centerBall.userData.gizmoAxis = 'free';
        this.gizmoGroup.add(centerBall);
        this.gizmoHandles.push(centerBall);
        this.gizmoGroup.renderOrder = 999;
        this.gizmoGroup.visible = false;
      }

      resize() {
        const w = this.canvas.parentElement.clientWidth || window.innerWidth;
        const h = this.canvas.parentElement.clientHeight || window.innerHeight;
        const scale = this.app.state.preview.retro ? 0.45 : Math.min(window.devicePixelRatio || 1, 2);
        this.renderer.setPixelRatio(scale);
        this.renderer.setSize(w, h, false);
        this.perspCam.aspect = w / h;
        this.perspCam.updateProjectionMatrix();
        this.updateOrthoFrustum(w, h);
      }

      updateOrthoFrustum(w, h) {
        const aspect = (w || window.innerWidth) / (h || window.innerHeight);
        const halfH = this.camSpherical.radius * 0.45;
        this.orthoCam.left = -halfH * aspect;
        this.orthoCam.right = halfH * aspect;
        this.orthoCam.top = halfH;
        this.orthoCam.bottom = -halfH;
        this.orthoCam.updateProjectionMatrix();
      }

      setProjection(isOrtho) {
        this.isOrtho = isOrtho;
        this.camera = isOrtho ? this.orthoCam : this.perspCam;
        this.updateCameraTransform();
      }

      setStandardView(view) {
        if (view === 'front') { this.camSpherical.theta = 0; this.camSpherical.phi = Math.PI / 2; }
        else if (view === 'back') { this.camSpherical.theta = Math.PI; this.camSpherical.phi = Math.PI / 2; }
        else if (view === 'side') { this.camSpherical.theta = Math.PI / 2; this.camSpherical.phi = Math.PI / 2; }
        else if (view === 'top') { this.camSpherical.theta = 0; this.camSpherical.phi = 0.05; }
        this.updateCameraTransform();
      }

      focusSelected() {
        const obj = this.app.getSelectedObject();
        if (obj) {
          const b = obj.mesh.getBounds();
          this.camTarget.set(
            obj.position.x + b.center.x * obj.scale.x,
            obj.position.y + b.center.y * obj.scale.y,
            obj.position.z + b.center.z * obj.scale.z
          );
          const diag = Math.max(1.5, b.size.length() * Math.max(obj.scale.x, obj.scale.y, obj.scale.z));
          this.camSpherical.radius = diag * 1.9;
        } else {
          this.camTarget.set(0, 1.0, 0);
          this.camSpherical.radius = 5.2;
        }
        this.updateCameraTransform();
      }

      updateCameraTransform() {
        const { radius, theta, phi } = this.camSpherical;
        this.camSpherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, phi));
        const cp = this.camSpherical.phi;
        const x = this.camTarget.x + radius * Math.sin(cp) * Math.sin(theta);
        const y = this.camTarget.y + radius * Math.cos(cp);
        const z = this.camTarget.z + radius * Math.sin(cp) * Math.cos(theta);
        this.perspCam.position.set(x, y, z);
        this.perspCam.lookAt(this.camTarget);
        this.orthoCam.position.set(x, y, z);
        this.orthoCam.lookAt(this.camTarget);
        this.updateOrthoFrustum(this.canvas.clientWidth, this.canvas.clientHeight);
      }

      applyPreviewSettings() {
        const p = this.app.state.preview;
        this.resize();
        document.getElementById('retro-dither-overlay').classList.toggle('active', p.retro);
        this.scene.fog = p.retro ? new THREE.FogExp2(0x161224, 0.068) : null;
        if (p.mood === 'studio') {
          this.hemiLight.color.setHex(0xffffff); this.hemiLight.groundColor.setHex(0x4b4757);
          this.keyLight.color.setHex(0xffffff); this.keyLight.intensity = 1.05;
          this.rimLight.color.setHex(0xcbd5e1); this.rimLight.intensity = 0.4;
        } else {
          this.hemiLight.color.setHex(0xd8c8ff); this.hemiLight.groundColor.setHex(0x2d2438);
          this.keyLight.color.setHex(0xffdfb8); this.keyLight.intensity = 1.15;
          this.rimLight.color.setHex(0x4de0cb); this.rimLight.intensity = 0.6;
        }
        for (const entry of this.meshEntries.values()) {
          entry.wire.visible = p.wireframe;
          entry.outline.visible = p.outlines || p.retro;
        }
        this.symPlane.visible = this.app.state.symmetryX;
      }

      syncScene() {
        const activeIds = new Set(this.app.state.objects.map(o => o.id));
        for (const [id, entry] of this.meshEntries.entries()) {
          if (!activeIds.has(id)) {
            this.objectGroup.remove(entry.group);
            entry.mesh.geometry.dispose();
            entry.wire.geometry.dispose();
            entry.outline.geometry.dispose();
            if (entry.threeTex) entry.threeTex.dispose();
            this.meshEntries.delete(id);
          }
        }

        const selObjId = this.app.state.selectedObjectId;
        const mode = this.app.state.mode;

        for (const obj of this.app.state.objects) {
          let entry = this.meshEntries.get(obj.id);
          if (!entry) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({
              vertexColors: true, roughness: 0.82, metalness: 0.08,
              flatShading: obj.flatShading, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
            });
            const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.objectId = obj.id;

            const wire = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffe4b5, transparent: true, opacity: 0.35 }));
            const outline = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: 0x0b0812, side: THREE.BackSide }));
            outline.scale.setScalar(1.03);

            group.add(mesh, wire, outline);
            this.objectGroup.add(group);
            entry = { group, mesh, wire, outline, threeTex: null };
            this.meshEntries.set(obj.id, entry);
          }

          entry.group.visible = obj.visible;
          entry.group.position.set(obj.position.x, obj.position.y, obj.position.z);
          entry.group.rotation.set(obj.rotation.x, obj.rotation.y, obj.rotation.z);
          entry.group.scale.set(obj.scale.x, obj.scale.y, obj.scale.z);

          // Bind live CanvasTexture if object has painted/procedural texture
          if (obj.textureCanvas) {
            if (!entry.threeTex || entry.threeTex.image !== obj.textureCanvas) {
              if (entry.threeTex) entry.threeTex.dispose();
              entry.threeTex = new THREE.CanvasTexture(obj.textureCanvas);
              entry.threeTex.encoding = THREE.sRGBEncoding;
              entry.threeTex.magFilter = THREE.LinearFilter;
              entry.threeTex.minFilter = THREE.LinearMipmapLinearFilter;
            }
            entry.threeTex.needsUpdate = true;
            entry.mesh.material.map = entry.threeTex;
          } else {
            entry.mesh.material.map = null;
          }

          const selFaces = (obj.id === selObjId && mode === 'face') ? this.app.state.selectedFaces : null;
          const posedVerts = (obj.rig && obj.rig.bones && obj.mesh.skinJoints) ? RigEngine.computePosedVertices(obj.mesh, obj.rig.bones) : null;
          const heatBone = (obj.id === selObjId && mode === 'rig' && obj.rig && obj.rig.showHeatmap) ? obj.rig.selectedBone : -1;
          const geom = obj.mesh.toThreeBufferGeometry(obj.flatShading, selFaces, !!obj.textureCanvas, posedVerts, heatBone);
          entry.mesh.geometry.dispose();
          entry.mesh.geometry = geom;
          entry.mesh.material.flatShading = obj.flatShading;
          entry.mesh.material.emissive.setHex(obj.id === selObjId && mode === 'object' ? 0x261a0a : 0x000000);
          entry.mesh.material.needsUpdate = true;

          const edges = obj.mesh.getEdges();
          const linePos = [];
          for (const e of edges) {
            const a = obj.mesh.vertices[e.a], b = obj.mesh.vertices[e.b];
            if (a && b) linePos.push(a.x, a.y, a.z, b.x, b.y, b.z);
          }
          const wireGeom = new THREE.BufferGeometry();
          wireGeom.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
          entry.wire.geometry.dispose();
          entry.wire.geometry = wireGeom;
          entry.wire.visible = this.app.state.preview.wireframe || (obj.id === selObjId && (mode === 'vertex' || mode === 'edge' || mode === 'face'));

          entry.outline.geometry.dispose();
          entry.outline.geometry = geom.clone();
          entry.outline.visible = this.app.state.preview.outlines || this.app.state.preview.retro;
        }

        this.syncSubObjectOverlays();
        this.syncGizmoPosition();
        this.applyPreviewSettings();
      }

      syncSubObjectOverlays() {
        while (this.overlayGroup.children.length) {
          const c = this.overlayGroup.children.pop();
          if (c.geometry) c.geometry.dispose();
          if (c.material) c.material.dispose();
        }
        const obj = this.app.getSelectedObject();
        if (!obj || !obj.visible) return;
        const mode = this.app.state.mode;
        const showGhost = !!(this.app.state.anim.showGhost && obj.rig && obj.animations && obj.animations.length);
        if (mode !== 'vertex' && mode !== 'edge' && mode !== 'rig' && !showGhost) return;

        const container = new THREE.Group();
        container.position.set(obj.position.x, obj.position.y, obj.position.z);
        container.rotation.set(obj.rotation.x, obj.rotation.y, obj.rotation.z);
        container.scale.set(obj.scale.x, obj.scale.y, obj.scale.z);

        if (mode === 'vertex') {
          const selSet = new Set(this.app.state.selectedVerts);
          const pos = [], col = [];
          for (let i = 0; i < obj.mesh.vertices.length; i++) {
            const v = obj.mesh.vertices[i];
            pos.push(v.x, v.y, v.z);
            if (selSet.has(i)) col.push(1.0, 0.72, 0.18);
            else col.push(0.28, 0.88, 0.78);
          }
          const pGeom = new THREE.BufferGeometry();
          pGeom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
          pGeom.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
          const pts = new THREE.Points(pGeom, new THREE.PointsMaterial({ size: 11, sizeAttenuation: false, vertexColors: true, depthTest: false }));
          pts.renderOrder = 500;
          container.add(pts);
        } else if (mode === 'rig' && obj.rig && obj.rig.bones) {
          const { worldPos } = RigEngine.computeMatrices(obj.rig.bones, true);
          let bestBi = -1, bestD = 34;
          for (let i = 0; i < worldPos.length; i++) {
            const s = projectToScreen(worldPos[i]);
            if (s.z < -1 || s.z > 1) continue;
            const d = Math.hypot(s.x - clientX, s.y - clientY);
            if (d < bestD) { bestD = d; bestBi = i; }
          }
          if (bestBi !== -1) {
            obj.rig.selectedBone = bestBi;
            this.app.toast(`Bone: ${obj.rig.bones[bestBi].name}`);
            this.app.refreshAll();
          }
        } else if (mode === 'edge') {
          const selKeys = new Set(this.app.state.selectedEdges);
          const selPos = [];
          for (const e of obj.mesh.getEdges()) {
            if (selKeys.has(e.key)) {
              const a = obj.mesh.vertices[e.a], b = obj.mesh.vertices[e.b];
              selPos.push(a.x, a.y, a.z, b.x, b.y, b.z);
            }
          }
          if (selPos.length) {
            const eGeom = new THREE.BufferGeometry();
            eGeom.setAttribute('position', new THREE.Float32BufferAttribute(selPos, 3));
            const lines = new THREE.LineSegments(eGeom, new THREE.LineBasicMaterial({ color: 0xffb84d, depthTest: false }));
            lines.renderOrder = 500;
            container.add(lines);
          }
        }
        this.ikHandles = [];
        if (mode === 'rig' && obj.rig && obj.rig.bones) {
          const bones = obj.rig.bones;
          const { worldPos } = RigEngine.computeMatrices(bones, true);
          const ikMap = { 7: { limb: 'arm_l', label: 'L Hand' }, 10: { limb: 'arm_r', label: 'R Hand' }, 13: { limb: 'leg_l', label: 'L Foot' }, 16: { limb: 'leg_r', label: 'R Foot' } };
          const boneLines = [];
          for (let i = 0; i < bones.length; i++) {
            const p = worldPos[i];
            if (bones[i].parent >= 0) {
              const pp = worldPos[bones[i].parent];
              boneLines.push(pp.x, pp.y, pp.z, p.x, p.y, p.z);
            }
            const isIK = !!ikMap[i];
            const isSel = i === obj.rig.selectedBone;
            const sphere = new THREE.Mesh(
              new THREE.SphereGeometry(isIK ? 0.072 : (isSel ? 0.055 : 0.036), 10, 10),
              new THREE.MeshBasicMaterial({ color: isIK ? 0xff7b54 : (isSel ? 0xf5a623 : 0x38d9c0), depthTest: false })
            );
            sphere.position.copy(p);
            sphere.renderOrder = isIK ? 620 : 600;
            container.add(sphere);
            if (isIK) {
              // Larger invisible touch collider for effortless iPhone finger grabbing!
              const hit = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
              hit.position.copy(p);
              hit.userData.ikLimb = ikMap[i].limb;
              hit.userData.ikLabel = ikMap[i].label;
              hit.userData.ikBoneIdx = i;
              container.add(hit);
              this.ikHandles.push(hit);
            }
          }
          if (boneLines.length) {
            const bGeom = new THREE.BufferGeometry();
            bGeom.setAttribute('position', new THREE.Float32BufferAttribute(boneLines, 3));
            const lines = new THREE.LineSegments(bGeom, new THREE.LineBasicMaterial({ color: 0xffd07a, depthTest: false }));
            lines.renderOrder = 590;
            container.add(lines);
          }
        }
        if (showGhost) {
          const clip = obj.animations[this.app.state.anim.clipIndex];
          const prevPose = AnimEngine.getPreviousKeyframePose(clip, this.app.state.anim.time);
          if (prevPose) {
            const ghostBones = obj.rig.bones.map((b, i) => ({ ...b, poseRot: prevPose[i] || [0, 0, 0] }));
            const gVerts = RigEngine.computePosedVertices(obj.mesh, ghostBones);
            const gGeom = obj.mesh.toThreeBufferGeometry(true, null, false, gVerts, -1);
            const ghostMesh = new THREE.Mesh(
              gGeom,
              new THREE.MeshBasicMaterial({ color: 0x38d9c0, transparent: true, opacity: 0.22, wireframe: false, depthWrite: false })
            );
            ghostMesh.renderOrder = 400;
            container.add(ghostMesh);
          }
        }
        this.overlayGroup.add(container);
      }

      getSelectionPivotWorld() {
        const mode = this.app.state.mode;
        if (mode === 'sculpt' || mode === 'paint' || mode === 'rig') return null;
        const obj = this.app.getSelectedObject();
        if (!obj) return null;
        const entry = this.meshEntries.get(obj.id);
        if (!entry) return null;
        entry.group.updateMatrixWorld(true);
        if (mode === 'object') {
          return obj.mesh.getBounds().center.clone().applyMatrix4(entry.group.matrixWorld);
        }
        const indices = this.app.getActiveVertexIndices();
        if (!indices.length) return null;
        const avg = new THREE.Vector3();
        for (const vi of indices) { const v = obj.mesh.vertices[vi]; if (v) avg.add(new THREE.Vector3(v.x, v.y, v.z)); }
        return avg.divideScalar(indices.length).applyMatrix4(entry.group.matrixWorld);
      }

      syncGizmoPosition() {
        const pivot = this.getSelectionPivotWorld();
        if (!pivot) { this.gizmoGroup.visible = false; return; }
        this.gizmoGroup.visible = true;
        this.gizmoGroup.position.copy(pivot);
        const dist = this.camera.position.distanceTo(pivot);
        this.gizmoGroup.scale.setScalar(Math.max(0.45, Math.min(2.2, dist * 0.16)));
      }

      getNDC(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        return new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
      }

      trySculptAt(clientX, clientY) {
        const obj = this.app.getSelectedObject();
        if (!obj) return false;
        const entry = this.meshEntries.get(obj.id);
        if (!entry) return false;
        entry.group.updateMatrixWorld(true);
        this.raycaster.setFromCamera(this.getNDC(clientX, clientY), this.camera);
        const hits = this.raycaster.intersectObject(entry.mesh, false);
        if (!hits.length) return false;
        const hit = hits[0];
        const invMat = new THREE.Matrix4().copy(entry.group.matrixWorld).invert();
        const localPt = hit.point.clone().applyMatrix4(invMat);
        const localNorm = hit.face ? hit.face.normal.clone().normalize() : new THREE.Vector3(0, 1, 0);
        const s = this.app.state.sculpt;
        const moved = obj.mesh.applySculptBrush(localPt, localNorm, s.brush, s.radius, s.strength, this.app.state.symmetryX);
        if (moved) this.syncScene();
        return moved;
      }

      tryPaintAt(clientX, clientY) {
        const obj = this.app.getSelectedObject();
        if (!obj) return false;
        const entry = this.meshEntries.get(obj.id);
        if (!entry) return false;
        this.raycaster.setFromCamera(this.getNDC(clientX, clientY), this.camera);
        const hits = this.raycaster.intersectObject(entry.mesh, false);
        if (!hits.length || !hits[0].uv) return false;

        this.app.ensureObjectTexture(obj);
        const uv = hits[0].uv;
        const canvas = obj.textureCanvas;
        const ctx = canvas.getContext('2d');
        const px = Math.floor(uv.x * canvas.width);
        const py = Math.floor((1 - uv.y) * canvas.height);
        const p = this.app.state.paint;

        if (p.tool === 'eyedropper') {
          const d = ctx.getImageData(Math.max(0, Math.min(canvas.width - 1, px)), Math.max(0, Math.min(canvas.height - 1, py)), 1, 1).data;
          this.app.state.activeColor = '#' + [d[0], d[1], d[2]].map(x => x.toString(16).padStart(2, '0')).join('');
          this.app.state.paint.tool = 'brush';
          this.app.toast(`Picked ${this.app.state.activeColor}`);
          this.app.updateContextBar();
          return false;
        }
        if (p.tool === 'fill') {
          ctx.fillStyle = this.app.state.activeColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          this.syncScene();
          return true;
        }

        const r = Math.max(1.5, (p.size / 100) * canvas.width * 0.25);
        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.tool === 'eraser' ? (obj.mesh.faces[0]?.color || '#6b442a') : this.app.state.activeColor;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (entry.threeTex) entry.threeTex.needsUpdate = true;
        else this.syncScene();
        return true;
      }

      bindPointerEvents() {
        this.canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.canvas.setPointerCapture(e.pointerId);
          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, type: e.pointerType, button: e.button });

          if (this.pointers.size === 2) {
            if (this.gesture && (this.gesture.kind === 'transform' || this.gesture.kind === 'sculpt' || this.gesture.kind === 'paint' || this.gesture.kind === 'ik_drag') && this.gesture.moved) {
              this.app.commitGesture(this.gesture.kind);
            }
            const pts = Array.from(this.pointers.values());
            this.gesture = {
              kind: 'two_finger',
              midX: (pts[0].x + pts[1].x) * 0.5,
